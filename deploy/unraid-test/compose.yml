# Juristid — synthetic rehearsal stack for the Unraid host.
#
# Additive and isolated by construction. Its own Compose project name, its own
# bridge network, its own PostgreSQL, its own appdata tree. It joins no existing
# network and touches no existing container, volume or port.
#
# SYNTHETIC DATA ONLY. This stack runs with DJANGO_DEBUG=1 so that the
# development sign-in can work, which means it has no real authentication: any
# visitor can sign in as any seeded user. That is acceptable for a rehearsal on
# a trusted network with invented data, and it is exactly why the environment
# file must keep REAL_DATA_ALLOWED=0 and why this must not be reachable from the
# internet without an authenticating proxy in front of it.
#
# Always name both the file and the project explicitly, so a stray command can
# never reach another stack on this host:
#
#   docker compose -p juristid-test -f compose.yml <command>

name: juristid-test

services:
  db:
    image: postgres:18
    container_name: juristid-test-db
    restart: unless-stopped
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-test/config/juristid.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juristid}
      POSTGRES_USER: ${POSTGRES_USER:-juristid}
      # No POSTGRES_PASSWORD here: it comes from the env file above, which lives
      # outside Git with restrictive permissions.
    volumes:
      # PostgreSQL 18 keeps its cluster in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the persistent mount belongs one
      # level up. Mounting /var/lib/postgresql/data instead — the pattern from
      # every PostgreSQL image up to 17 — produces a container that starts
      # cleanly and stores nothing durable.
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-test}/postgres:/var/lib/postgresql
    networks:
      - internal
    # Deliberately no `ports:`. The database is reachable only from this
    # project's network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juristid} -d ${POSTGRES_DB:-juristid}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: juristid-test-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-test-web
    restart: unless-stopped
    # The image's default CMD is gunicorn. It is repeated here so that reading
    # this file answers "what actually serves requests" without a second lookup,
    # and so nobody reintroduces `runserver` by editing one place.
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-test/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      EVIDENCE_ROOT: /app/evidence
      DERIVATIVE_ROOT: /app/derivatives
      # Declared and mounted for the same reason the main stack declares it:
      # `deployment_readiness` treats LEGACY_SOURCE_ROOT as a canonical storage
      # root and refuses a deployment whose root does not exist. Left unset it
      # falls back to BASE_DIR/legacy-source inside the image, nothing mounts
      # it, and the post-deployment gate that production runs can never go
      # green here — so the rehearsal could not rehearse it.
      LEGACY_SOURCE_ROOT: /app/legacy-source
      # Migrations and seeding are controlled one-off steps, never container
      # start-up work (master specification 24.2). A container that migrates on
      # boot will happily migrate on a restart nobody intended.
      SEED_DEV_DATA: "0"
      # This is a deployed stack, and it says so. `config/test_safety.py`
      # refuses to start the test suite in any environment carrying this
      # marker, which is the control that makes "do not run pytest through this
      # Compose project" more than a sentence in a runbook: `docker compose run`
      # inherits a service's environment, so a test process started here sees it
      # and stops. The application itself never reads it.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${JURISTID_HOST_PORT:-3020}:8000"
    volumes:
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-test}/evidence:/app/evidence
      # A separate directory, not a subdirectory of evidence. One of these must
      # survive and be backed up; the other may be deleted and rebuilt from it.
      # Mixing them puts an operator one `rm -rf` away from destroying the half
      # that cannot be regenerated (docs/adr/0014).
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-test}/derivatives:/app/derivatives
      # OneNote page XML, kept as source evidence beside the register. Empty on
      # this stack — the rehearsal imports no register — but it must exist, because
      # `deployment_readiness` requires every canonical root to be present.
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-test}/legacy-source:/app/legacy-source
      # Held uploads and `Uus teema` staging, READ-WRITE. The same topology as
      # the main stack and for the same reason: `web` writes a staged file and
      # `intake-reader` opens it to parse it, and a container's writable layer is
      # private to that container (deploy/unraid-main/compose.yml,
      # docs/adr/0064).
      #
      # The rehearsal has to agree with production at this boundary above all
      # others, because this is the boundary that hid the defect: a stack whose
      # two containers do not share this volume cannot rehearse assisted intake
      # at all, and would report it working while production could not.
      - pending_uploads:/app/pending-uploads
    networks:
      - internal

  # The `Uus teema` intake reader — the rehearsal's copy of the real thing.
  #
  # Identical to the main stack's in every respect that decides behaviour,
  # which is the property this stack exists to have. The two differing in
  # their runtime shape rather than only in their data is exactly what hid a
  # production defect for months (docs/adr/0066 §Superseded, docs/adr/0069).
  #
  # It reads the files somebody has just chosen on `Uus teema`, so that the
  # form in front of them fills itself in, and it reads nothing else. Its whole
  # universe is `MatterIntakeFile` rows belonging to a live staging session:
  # not the canonical corpus, not the archive, not the historical import
  # (app/matters/management/commands/run_intake_reader.py, docs/adr/0069).
  #
  # **This service replaces `extractor`, and the replacement is the point.**
  # The old worker drained both queues from one loop. On 2026-09-10 the
  # canonical half of it worked through a 16 000-file backlog, drove this
  # host's checkpoint fsyncs from under 2.5 s to 155 s — every small write to
  # the parity-protected array is a read-modify-write on a saturated USB disk —
  # and a single-row INSERT into a 264 kB audit table blocked for two minutes
  # until gunicorn killed the worker holding it. Corpus-wide extraction is no
  # longer part of the product, so there is deliberately no service here that
  # `docker compose up -d` can start it from. An operator who wants it runs
  # `run_extraction_worker` by hand, outside working hours.
  #
  # Separate from `web` because parsing a PDF or running OCR takes seconds to
  # minutes and a request must not wait for it. Same image, so there is one
  # thing to build and one version to reason about.
  #
  # **It mounts one thing and it is read-only.** No evidence, no derivatives,
  # no historical corpus. This process opens staged objects with
  # `storage.open(..., "rb")` and writes its answers to PostgreSQL, so the
  # tree it is given is exactly the tree it reads from and nothing else on this
  # host is reachable from it.
  intake-reader:
    image: juristid-test-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-test-intake-reader
    restart: unless-stopped
    # The image's HEALTHCHECK asks an HTTP port this container does not have, so
    # inherited it can only ever be red — and a container that is always red
    # makes a container that *becomes* unhealthy indistinguishable.
    #
    # The reader leaves a mark each time round its loop; this reads it. That
    # says more than "the process exists": a parser wedged on a malformed file
    # leaves the process alive and the queue stopped, and this catches it — the
    # failure that made a lawyer watch «Loen faili…» for half an hour.
    #
    # The window is INTAKE_READER_STALE_CLAIM_MINUTES, five rather than the old
    # worker's thirty. A staged file is bounded by MAX_INTAKE_UPLOAD_BYTES and
    # finishes in seconds, so a loop that has not turned in five minutes has
    # stopped — and waiting half an hour to say so would outlast the form.
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_intake_reader", "--quiet"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    command:
      - python
      - manage.py
      - run_intake_reader
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-test/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      SEED_DEV_DATA: "0"
      # This is a deployed stack, and it says so. `config/test_safety.py`
      # refuses to start the test suite in any environment carrying this
      # marker, which is the control that makes "do not run pytest through this
      # Compose project" more than a sentence in a runbook: `docker compose run`
      # inherits a service's environment, so a test process started here sees it
      # and stops. The application itself never reads it.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The staged `Uus teema` files, READ-ONLY — the same volume `web` writes.
      #
      # Read-only because that is the whole of what this process does with
      # them. Staging bytes are written by the upload view, deleted by
      # `consume_session` after `Loo teema` and swept by
      # `prune_intake_staging` — all three in `web`. Nothing on this side needs
      # to change the source it is reading, so nothing on this side is given
      # the ability to.
      - pending_uploads:/app/pending-uploads:ro
    networks:
      - internal

  # Search freshness. The rehearsal counterpart of the main stack's service; see
  # deploy/unraid-main/compose.yml for why this is a container and not a cron
  # entry, and docs/adr/0041 for what it converges.
  searchindex:
    image: juristid-test-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-test-searchindex
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_search_freshness", "--quiet"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    command:
      - python
      - manage.py
      - run_search_refresh_worker
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-test/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      SEED_DEV_DATA: "0"
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    # No evidence or derivative mounts: this rebuilds a projection out of
    # PostgreSQL and reads no stored file.
    networks:
      - internal

  # Public access for juristid.orgusaar.ee, behind the shared sign-in PIN.
  #
  # Opt-in, because the LAN deployment must work without it:
  #   docker compose -p juristid-test -f compose.yml --profile tunnel up -d
  #
  # The tunnel is *locally managed*. Its credential was generated on this host
  # by `cloudflared tunnel login` and lives in the ignored appdata directory —
  # no token is stored in this file, in Git, or anywhere a copy could be made
  # by reading the repository.
  #
  # It joins only this project's network and reaches the application by service
  # name, so publishing the site adds nothing to the host's port surface.
  #
  # What stands between this hostname and the open internet is DEV_LOGIN_PIN: a
  # single shared secret, rate limited, guarding a sign-in page where any
  # visitor who passes it becomes any seeded user. That is weaker than the
  # Cloudflare Access policy it replaced - one shared PIN, no per-person
  # identity, no revocation short of changing it for everyone - and it is a
  # deliberate rehearsal tradeoff, not a design. DEBUG also serves tracebacks
  # here. Unset the PIN and this becomes an open door; put real data behind it
  # and the PIN is not remotely enough, which is what REAL_DATA_ALLOWED=0 is
  # for.
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: juristid-test-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    command:
      - tunnel
      - --config
      - /home/nonroot/.cloudflared/config.yml
      - run
    volumes:
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-test}/cloudflared:/home/nonroot/.cloudflared
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:
    name: juristid-test-internal
    driver: bridge

volumes:
  # Temporary upload bytes, shared by `web` and `intake-reader` and by nothing else.
  #
  # Declared exactly as the main stack declares it, with no explicit `name:`, so
  # Compose scopes it to this project: this one is `juristid-test_pending_uploads`
  # and production's is `juristid-main_pending_uploads`. Two stacks on one host,
  # one declaration, and no way for the rehearsal's invented correspondence to
  # land in the volume holding the Chamber's.
  #
  # Nothing here is backed up and nothing here is canonical, in this stack least
  # of all (deploy/unraid-main/RECOVERY.md, docs/adr/0064).
  pending_uploads:
