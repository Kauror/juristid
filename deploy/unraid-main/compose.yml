# Juristid — the real-data stack for the Unraid host.
#
# Additive and isolated by construction, and additive *with respect to the
# rehearsal too*: its own Compose project name, its own bridge network, its own
# PostgreSQL, its own appdata tree, its own containers. Nothing here touches
# `juristid-test`, which stays running with its invented data.
#
# REAL DATA. This stack carries the Chamber's twenty-year register and the
# member material attached to it. Three properties are what make that
# defensible, and each one is enforced somewhere a mistake would show:
#
#   1. No host port. There is no `ports:` on any service. The only way in is
#      through the Cloudflare tunnel, so you cannot reach this by typing the
#      server's LAN address (Stage-2D brief 58).
#   2. The application authenticates its own requests. `AUTH_MODE` decides how,
#      and both supported answers are real authenticators: `shared_gate`, which
#      is what this stack runs today, and `cloudflare_access`, which verifies a
#      signed Cloudflare assertion against the team's published keys and is the
#      hardening step after it. `AUTH_MODE=none` with real data refuses to
#      start (juristid.E006). What the two modes differ in is how much the
#      deployment may claim about *who* is behind a request, and every audit row
#      records which one it was — see deploy/unraid-main/README.md and
#      docs/adr/0016.
#   3. `DJANGO_DEBUG=0`, `DEV_LOGIN_ENABLED=0`, `REAL_DATA_ALLOWED=1`. A system
#      check refuses to start a process that mixes those wrongly
#      (juristid.E002/E003/E004/E006/E008).
#
# The rehearsal's shared PIN does not exist here and must never be added. The
# shared gate is not that PIN: a different mode, a long host-side secret, and
# its own checks (juristid.E010-E013).
#
# Always name both the file and the project explicitly, so a stray command can
# never reach another stack on this host — `juristid-test` most of all:
#
#   docker compose -p juristid-main -f compose.yml <command>
#
# Deploying, backing up and restoring this stack have runbooks and scripts of
# their own. Do not improvise from these comments:
#
#   deploy/unraid-main/README.md     day-to-day operation and deployment
#   deploy/unraid-main/RECOVERY.md   backup, restore and disaster recovery
#   scripts/deploy/                  the scripts both of those call

name: juristid-main

services:
  db:
    image: postgres:18
    container_name: juristid-main-db
    restart: unless-stopped
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juristid}
      POSTGRES_USER: ${POSTGRES_USER:-juristid}
      # No POSTGRES_PASSWORD here: it comes from the env file above, which lives
      # outside Git with restrictive permissions.
    volumes:
      # PostgreSQL 18 keeps its cluster in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the persistent mount belongs one
      # level up. Mounting /var/lib/postgresql/data instead — the pattern from
      # every PostgreSQL image up to 17 — produces a container that starts
      # cleanly and stores nothing durable.
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/postgres:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juristid} -d ${POSTGRES_DB:-juristid}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    # Never run on the production host. The release image is built off-host by
    # .github/workflows/release-image.yml and `docker load`ed here under the
    # `image:` tag below; the runbook's `up -d --no-build` is what keeps this
    # stanza from being used there. It stays because CI resolves it — the
    # compose smoke job checks that the build receives the full GIT_SHA.
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        # The commit this image is built from, baked in so the running
        # container can be asked what code it is rather than an operator being
        # asked to remember. `scripts/deploy/juristid-deploy-preflight.sh`
        # prints the value to pass; leaving it unset produces an image that
        # `manage.py deployment_readiness` refuses to call ready.
        GIT_SHA: ${JURISTID_GIT_SHA:-}
    # Tag by commit where one is known, so a previous build is still on the
    # host under its own name and a rollback is a tag rather than a rebuild.
    # `local` is the fallback for a hand-built image and is deliberately the
    # one tag that gets overwritten.
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-web
    restart: unless-stopped
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      EVIDENCE_ROOT: /app/evidence
      DERIVATIVE_ROOT: /app/derivatives
      LEGACY_SOURCE_ROOT: /app/legacy-source
      HISTORICAL_SOURCE_ROOT: /srv/historical-source
      # Migrations and seeding are controlled one-off steps, never container
      # start-up work (master specification 24.2).
      SEED_DEV_DATA: "0"
      # This is a deployed stack, and it says so. `config/test_safety.py`
      # refuses to start the test suite in any environment carrying this
      # marker, which is the control that makes "do not run pytest through this
      # Compose project" more than a sentence in a runbook: `docker compose run`
      # inherits a service's environment, so a test process started here sees it
      # and stops. The application itself never reads it.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    # Deliberately no `ports:`, and a test fails if one appears. See the
    # header: the tunnel is the only route in, and whichever authenticator
    # `AUTH_MODE` names is in front of everything behind it.
    volumes:
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/evidence:/app/evidence
      # A separate directory, not a subdirectory of evidence. One of these must
      # survive and be backed up; the other may be deleted and rebuilt from it
      # (docs/adr/0014).
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/derivatives:/app/derivatives
      # OneNote page XML, kept as source evidence beside the register.
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/legacy-source:/app/legacy-source
      # The historical corpus, READ-ONLY. The importer reads it and never
      # rewrites it: an importer that can write to its own source is one bad run
      # away from having nothing to re-run against (Stage-2D brief 54).
      - ${JURISTID_SOURCE_ROOT:-/mnt/user/juristid-main/source}:/srv/historical-source:ro
      # Held uploads and `Uus teema` staging, READ-WRITE: this is the process
      # that receives a file, holds it across a refused save, promotes it on
      # `Loo teema` and deletes it afterwards.
      #
      # A named volume rather than a directory inside the container, because
      # since docs/adr/0064 these bytes have a second reader in a second
      # container: `web` writes the staged file and `intake-reader` opens it
      # to parse it. A container's writable layer is private to that container, so
      # the arrangement before this worked only while one process did both.
      #
      # A named volume rather than a bind under the appdata tree, deliberately.
      # None of this is evidence — nothing outside the staging tables points at
      # it and losing all of it costs one re-pick — so it must not become
      # another directory in the backup's field of view, and it must not become
      # another path inside the appdata SMB share.
      - pending_uploads:/app/pending-uploads
    networks:
      - internal

  # The `Uus teema` intake reader. The only queue consumer this stack runs.
  #
  # It reads the files somebody has just chosen on `Uus teema`, so that the
  # form in front of them fills itself in, and it reads nothing else. Its whole
  # universe is `MatterIntakeFile` rows belonging to a live staging session:
  # not the canonical corpus, not the archive, not the historical import
  # (app/matters/management/commands/run_intake_reader.py, docs/adr/0072).
  #
  # **This service replaces `extractor`, and the replacement is the point.**
  # The old worker drained both queues from one loop. On 2026-09-10 the
  # canonical half of it worked through a 16 000-file backlog, drove this
  # host's checkpoint fsyncs from under 2.5 s to 155 s — every small write to
  # the parity-protected array is a read-modify-write on a saturated USB disk —
  # and a single-row INSERT into a 264 kB audit table blocked for two minutes
  # until gunicorn killed the worker holding it. Corpus-wide extraction is no
  # longer part of the product, so there is deliberately no service here that
  # `docker compose up -d` can start it from. An operator who wants it runs
  # `run_extraction_worker` by hand, outside working hours.
  #
  # Separate from `web` because parsing a PDF or running OCR takes seconds to
  # minutes and a request must not wait for it. Same image, so there is one
  # thing to build and one version to reason about.
  #
  # **It mounts one thing and it is read-only.** No evidence, no derivatives,
  # no historical corpus. This process opens staged objects with
  # `storage.open(..., "rb")` and writes its answers to PostgreSQL, so the
  # tree it is given is exactly the tree it reads from and nothing else on this
  # host is reachable from it.
  intake-reader:
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-intake-reader
    restart: unless-stopped
    # The image's HEALTHCHECK asks an HTTP port this container does not have, so
    # inherited it can only ever be red — and a container that is always red
    # makes a container that *becomes* unhealthy indistinguishable.
    #
    # The reader leaves a mark each time round its loop; this reads it. That
    # says more than "the process exists": a parser wedged on a malformed file
    # leaves the process alive and the queue stopped, and this catches it — the
    # failure that made a lawyer watch «Loen faili…» for half an hour.
    #
    # The window is INTAKE_READER_STALE_CLAIM_MINUTES, five rather than the old
    # worker's thirty. A staged file is bounded by MAX_INTAKE_UPLOAD_BYTES and
    # finishes in seconds, so a loop that has not turned in five minutes has
    # stopped — and waiting half an hour to say so would outlast the form.
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_intake_reader", "--quiet"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    command:
      - python
      - manage.py
      - run_intake_reader
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      SEED_DEV_DATA: "0"
      # This is a deployed stack, and it says so. `config/test_safety.py`
      # refuses to start the test suite in any environment carrying this
      # marker, which is the control that makes "do not run pytest through this
      # Compose project" more than a sentence in a runbook: `docker compose run`
      # inherits a service's environment, so a test process started here sees it
      # and stops. The application itself never reads it.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The staged `Uus teema` files, READ-ONLY — the same volume `web` writes.
      #
      # Read-only because that is the whole of what this process does with
      # them. Staging bytes are written by the upload view, deleted by
      # `consume_session` after `Loo teema` and swept by
      # `prune_intake_staging` — all three in `web`. Nothing on this side needs
      # to change the source it is reading, so nothing on this side is given
      # the ability to.
      - pending_uploads:/app/pending-uploads:ro
    networks:
      - internal

  # Search freshness: what keeps the index current after a vocabulary change.
  #
  # An Organisation rename, an alias edit, a Tag or PolicyArea rename changes
  # the indexed text of every record naming them — thousands of rows from one
  # small admin form. That is deliberately not fanned out inside the request;
  # instead the mutation records a durable obligation in its own transaction and
  # this loop discharges it with an atomic full rebuild
  # (app/search/freshness.py, docs/adr/0041).
  #
  # A container rather than a cron entry, and not for want of trying the simpler
  # thing: this host's cron is generated from the flash drive and editing it can
  # take Unraid's own mover and parity jobs with it, which the test stack's
  # README says in as many words. The master specification names a management
  # command from the application image for exactly this job (§24.3).
  #
  # Without this service the stack still works and search still converges — an
  # operator runs `rebuild_search_index` when `check_search_integrity` says a
  # rebuild is owed, which is what happened before SEARCH-001. What is lost is
  # that somebody has to notice.
  searchindex:
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-searchindex
    restart: unless-stopped
    # Convergence, not liveness: the probe asks whether anything has been owed
    # too long, which is the failure that reaches a reader. A stopped worker
    # with nothing owed is green here and correctly so — the index is complete —
    # and goes red within SEARCH_REBUILD_DEBT_STALE_SECONDS of the first change
    # it fails to pick up (app/search/management/commands/check_search_freshness.py).
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_search_freshness", "--quiet"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    command:
      - python
      - manage.py
      - run_search_refresh_worker
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      SEED_DEV_DATA: "0"
      # As on every other service in this file: `config/test_safety.py` refuses
      # to run the test suite in a process that inherits this marker.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    # No evidence, derivative or source mounts. This process rebuilds a
    # projection out of PostgreSQL and reads no file the application stores;
    # giving it the evidence tree would widen what a compromised container can
    # reach for no benefit.
    networks:
      - internal

  # The only route in.
  #
  # Not opt-in, unlike the rehearsal's: there is no host port here, so without
  # the tunnel this stack is unreachable, and a profile would only make that
  # look like a choice.
  #
  # The tunnel is *locally managed*. Its credential was generated on this host
  # by `cloudflared tunnel login` and lives in the ignored appdata directory —
  # no token is stored in this file, in Git, or anywhere a copy could be made by
  # reading the repository.
  #
  # Cloudflare Access sits in front of the hostname and is not optional. The
  # application verifies the assertion Access adds, so a misconfigured or
  # removed Access policy fails closed: requests arrive without a valid
  # assertion and are refused rather than served.
  tunnel:
    # Pinned, not `latest`. This container is the only route in, and `latest`
    # means an unrelated `docker pull` on this host can change the ingress of a
    # real-data system without anyone deciding to. Update it deliberately:
    # read the release notes at https://github.com/cloudflare/cloudflared/releases,
    # change the tag here, redeploy, and confirm the hostname still answers.
    # A version tag rather than a digest, so the next person can see what they
    # are moving from and to.
    image: cloudflare/cloudflared:2026.8.2
    container_name: juristid-main-tunnel
    restart: unless-stopped
    command:
      - tunnel
      - --config
      - /home/nonroot/.cloudflared/config.yml
      - run
    volumes:
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/cloudflared:/home/nonroot/.cloudflared
    depends_on:
      # Healthy, not merely started. A tunnel that connects before gunicorn is
      # accepting sends the public hostname 502s that look like an outage, and
      # during a deployment that is precisely the moment somebody is watching.
      web:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    name: juristid-main-internal
    driver: bridge

volumes:
  # Temporary upload bytes, shared by `web` and `intake-reader` and by nothing else.
  #
  # Deliberately left for Compose to name. A volume declared like this becomes
  # `juristid-main_pending_uploads`, scoped by the project name at the top of
  # this file — so `juristid-test`, a CI project and a recovery rehearsal each
  # get their own and none of them can reach this one. Writing an explicit
  # `name:` here would give up exactly that isolation, which is the property
  # worth having.
  #
  # Its recovery class is unchanged by having become a volume: not canonical,
  # not backed up, not in the recovery fingerprint. `juristid-backup.sh` does
  # not know about it and must not learn. It may outlive a container
  # replacement, which is convenient and means nothing — what bounds this data
  # is expiry and `prune_intake_staging`, not the lifetime of a container
  # (deploy/unraid-main/RECOVERY.md, docs/adr/0064).
  pending_uploads:
