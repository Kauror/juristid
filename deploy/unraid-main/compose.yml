# Juristid — the real-data stack for the Unraid host.
#
# Additive and isolated by construction, and additive *with respect to the
# rehearsal too*: its own Compose project name, its own bridge network, its own
# PostgreSQL, its own appdata tree, its own containers. Nothing here touches
# `juristid-test`, which stays running with its invented data.
#
# REAL DATA. This stack carries the Chamber's twenty-year register and the
# member material attached to it. Three properties are what make that
# defensible, and each one is enforced somewhere a mistake would show:
#
#   1. No host port. There is no `ports:` on any service. The only way in is
#      through the Cloudflare tunnel, so you cannot reach this by typing the
#      server's LAN address (Stage-2D brief 58).
#   2. The application authenticates its own requests. `AUTH_MODE` decides how,
#      and both supported answers are real authenticators: `shared_gate`, which
#      is what this stack runs today, and `cloudflare_access`, which verifies a
#      signed Cloudflare assertion against the team's published keys and is the
#      hardening step after it. `AUTH_MODE=none` with real data refuses to
#      start (juristid.E006). What the two modes differ in is how much the
#      deployment may claim about *who* is behind a request, and every audit row
#      records which one it was — see deploy/unraid-main/README.md and
#      docs/adr/0016.
#   3. `DJANGO_DEBUG=0`, `DEV_LOGIN_ENABLED=0`, `REAL_DATA_ALLOWED=1`. A system
#      check refuses to start a process that mixes those wrongly
#      (juristid.E002/E003/E004/E006/E008), or that holds a template
#      `replace-me…` secret or one too short for real data (E016-E019). Every
#      service on the application image runs the checks before anything else:
#      the workers and their healthchecks are `manage.py` commands, and `web`
#      starts gunicorn through scripts/serve-after-checks.sh, so a refused
#      configuration exits and restarts rather than serving (JOPS-004).
#
# The rehearsal's shared PIN does not exist here and must never be added. The
# shared gate is not that PIN: a different mode, a long host-side secret, and
# its own checks (juristid.E010-E013).
#
# Always name both the file and the project explicitly, so a stray command can
# never reach another stack on this host — `juristid-test` most of all:
#
#   docker compose -p juristid-main -f compose.yml <command>
#
# Deploying, backing up and restoring this stack have runbooks and scripts of
# their own. Do not improvise from these comments:
#
#   deploy/unraid-main/README.md     day-to-day operation and deployment
#   deploy/unraid-main/RECOVERY.md   backup, restore and disaster recovery
#   scripts/deploy/                  the scripts both of those call

name: juristid-main

# Every long-lived container's log is bounded (ENG-071). Unbounded, `docker
# logs` grows for as long as the container lives, and whatever reached it — the
# access log included — stays there with it. json-file is Docker's own default
# driver; it is named rather than assumed so that the two options below are
# always valid for it. Five files of 10 MB is at most 50 MB a container, which
# at this stack's traffic is weeks of history rather than hours.
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    # The tag for the reader, the digest for Docker (ADR 0179). `postgres:18`
    # alone is a moving pointer: Docker Hub re-pushes it for every minor and
    # every Debian rebuild, so an unrelated pull on this host could change the
    # server under the register with nobody deciding to. The digest is the
    # multi-platform index production was already running on 2026-10-22
    # (`docker image inspect` RepoDigests, read-only), verified against
    # docker.io/library/postgres: PostgreSQL 18.6 (`PG_VERSION=18.6-1.pgdg13+2`),
    # Debian 13, built 2026-08-13. Moving it is a deliberate change: resolve the
    # new tag's index digest from the registry, replace it here and in the other
    # Compose files and CI services (tests/test_supply_chain_pinning.py keeps
    # them equal), and recreate `db` as an announced maintenance step.
    image: postgres:18@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    container_name: juristid-main-db
    # JIT off for this OLTP workload (AUD-039, docs/adr/0153): it fires on the
    # planner's estimated cost and spent 150-350 ms compiling statements that
    # run in 15-70 ms. `core/0002` sets the same per database, so a restore
    # into a server started without this line still answers `jit = off`.
    command: ["postgres", "-c", "jit=off"]
    restart: unless-stopped
    logging: *bounded-logs
    # No `env_file:`, deliberately (ADR 0179). The application's environment
    # file holds the Django signing key, the shared-gate password and the
    # mail/MFA settings; PostgreSQL reads none of them, and a container that is
    # handed them can leak them (`docker inspect`, `/proc/1/environ`, a crash
    # dump) for no benefit. The database is given exactly the three variables
    # its image reads, and tests/test_service_secret_isolation.py holds it there.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-juristid}
      POSTGRES_USER: ${POSTGRES_USER:-juristid}
      # Read by the image ONCE, when it initialises an empty cluster; on every
      # later start the password already lives in the cluster and this value is
      # ignored. So day to day it is empty — Compose interpolates it, and no
      # file beside this one supplies it (the preflight refuses a `.env` here).
      # Initialising a new cluster (disaster recovery onto an empty `postgres/`)
      # is the one time it is needed, and the runbook passes it then with
      # `--env-file <the environment file>`, which feeds interpolation only and
      # sends nothing else into a container (RECOVERY.md). Forgetting it fails
      # closed: the image refuses to initialise without a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      # PostgreSQL 18 keeps its cluster in a major-version subdirectory
      # (/var/lib/postgresql/18/docker), so the persistent mount belongs one
      # level up. Mounting /var/lib/postgresql/data instead — the pattern from
      # every PostgreSQL image up to 17 — produces a container that starts
      # cleanly and stores nothing durable.
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/postgres:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juristid} -d ${POSTGRES_DB:-juristid}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    # Never run on the production host. The release image is built off-host by
    # .github/workflows/release-image.yml and `docker load`ed here under the
    # `image:` tag below; the runbook's `up -d --no-build` is what keeps this
    # stanza from being used there. It stays because CI resolves it — the
    # compose smoke job checks that the build receives the full GIT_SHA.
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        # The commit this image is built from, baked in so the running
        # container can be asked what code it is rather than an operator being
        # asked to remember. `scripts/deploy/juristid-deploy-preflight.sh`
        # prints the value to pass; leaving it unset produces an image that
        # `manage.py deployment_readiness` refuses to call ready.
        GIT_SHA: ${JURISTID_GIT_SHA:-}
    # Tag by commit where one is known, so a previous build is still on the
    # host under its own name and a rollback is a tag rather than a rebuild.
    # `local` is the fallback for a hand-built image and is deliberately the
    # one tag that gets overwritten.
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-web
    restart: unless-stopped
    logging: *bounded-logs
    command:
      # The system checks first, and gunicorn only if they pass (JOPS-004,
      # scripts/serve-after-checks.sh): a configuration `juristid.E0xx`
      # refuses exits here instead of serving and reporting healthy.
      - sh
      - /app/scripts/serve-after-checks.sh
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "120"
      - --access-logfile
      - "-"
      # The path, never the query string, and no Referer. gunicorn's default
      # `%(r)s` is the raw URI, and a search term or a filter value typed into
      # this application is business text that must not reach `docker logs`
      # (ENG-071). deploy/unraid-test/compose.yml carries the same format, and
      # tests/test_access_log_privacy.py holds both to it.
      #
      # `%(h)s` is the tunnel connector for every request; the second field is
      # the client address Cloudflare saw (`CF-Connecting-IP`, `-` when absent),
      # the same address the audit rows record (app/core/client_ip.py, JOPS-008).
      - --access-logformat
      - '%(h)s %({cf-connecting-ip}i)s %(t)s "%(m)s %(U)s %(H)s" %(s)s %(b)s %(M)sms'
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      EVIDENCE_ROOT: /app/evidence
      DERIVATIVE_ROOT: /app/derivatives
      LEGACY_SOURCE_ROOT: /app/legacy-source
      HISTORICAL_SOURCE_ROOT: /srv/historical-source
      # Migrations and seeding are controlled one-off steps, never container
      # start-up work (master specification 24.2).
      SEED_DEV_DATA: "0"
      # This is a deployed stack, and it says so. `config/test_safety.py`
      # refuses to start the test suite in any environment carrying this
      # marker, which is the control that makes "do not run pytest through this
      # Compose project" more than a sentence in a runbook: `docker compose run`
      # inherits a service's environment, so a test process started here sees it
      # and stops. The application itself never reads it.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    # Deliberately no `ports:`, and a test fails if one appears. See the
    # header: the tunnel is the only route in, and whichever authenticator
    # `AUTH_MODE` names is in front of everything behind it.
    volumes:
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/evidence:/app/evidence
      # A separate directory, not a subdirectory of evidence. One of these must
      # survive and be backed up; the other may be deleted and rebuilt from it
      # (docs/adr/0014).
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/derivatives:/app/derivatives
      # OneNote page XML, kept as source evidence beside the register.
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/legacy-source:/app/legacy-source
      # The historical corpus, READ-ONLY. The importer reads it and never
      # rewrites it: an importer that can write to its own source is one bad run
      # away from having nothing to re-run against (Stage-2D brief 54).
      - ${JURISTID_SOURCE_ROOT:-/mnt/user/juristid-main/source}:/srv/historical-source:ro
      # Held uploads and `Uus teema` staging, READ-WRITE: this is the process
      # that receives a file, holds it across a refused save, promotes it on
      # `Loo teema` and deletes it afterwards.
      #
      # A named volume rather than a directory inside the container, because
      # since docs/adr/0064 these bytes have a second reader in a second
      # container: `web` writes the staged file and `intake-reader` opens it
      # to parse it. A container's writable layer is private to that container, so
      # the arrangement before this worked only while one process did both.
      #
      # A named volume rather than a bind under the appdata tree, deliberately.
      # None of this is evidence — nothing outside the staging tables points at
      # it and losing all of it costs one re-pick — so it must not become
      # another directory in the backup's field of view, and it must not become
      # another path inside the appdata SMB share.
      - pending_uploads:/app/pending-uploads
    networks:
      - internal

  # The `Uus teema` intake reader. The only queue consumer this stack runs.
  #
  # It reads the files somebody has just chosen on `Uus teema`, so that the
  # form in front of them fills itself in, and it reads nothing else. Its whole
  # universe is `MatterIntakeFile` rows belonging to a live staging session:
  # not the canonical corpus, not the archive, not the historical import
  # (app/matters/management/commands/run_intake_reader.py, docs/adr/0072).
  #
  # **This service replaces `extractor`, and the replacement is the point.**
  # The old worker drained both queues from one loop. On 2026-09-10 the
  # canonical half of it worked through a 16 000-file backlog, drove this
  # host's checkpoint fsyncs from under 2.5 s to 155 s — every small write to
  # the parity-protected array is a read-modify-write on a saturated USB disk —
  # and a single-row INSERT into a 264 kB audit table blocked for two minutes
  # until gunicorn killed the worker holding it. Corpus-wide extraction is no
  # longer part of the product, so there is deliberately no service here that
  # `docker compose up -d` can start it from. An operator who wants it runs
  # `run_extraction_worker` by hand, outside working hours.
  #
  # Separate from `web` because parsing a PDF or running OCR takes seconds to
  # minutes and a request must not wait for it. Same image, so there is one
  # thing to build and one version to reason about.
  #
  # **It mounts one thing and it is read-only.** No evidence, no derivatives,
  # no historical corpus. This process opens staged objects with
  # `storage.open(..., "rb")` and writes its answers to PostgreSQL, so the
  # tree it is given is exactly the tree it reads from and nothing else on this
  # host is reachable from it.
  intake-reader:
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-intake-reader
    restart: unless-stopped
    logging: *bounded-logs
    # The image's HEALTHCHECK asks an HTTP port this container does not have, so
    # inherited it can only ever be red — and a container that is always red
    # makes a container that *becomes* unhealthy indistinguishable.
    #
    # The reader leaves a mark each time round its loop; this reads it. That
    # says more than "the process exists": a parser wedged on a malformed file
    # leaves the process alive and the queue stopped, and this catches it — the
    # failure that made a lawyer watch «Loen faili…» for half an hour.
    #
    # The window is INTAKE_READER_STALE_CLAIM_MINUTES, five rather than the old
    # worker's thirty. A staged file is bounded by MAX_EVIDENCE_UPLOAD_BYTES and
    # finishes in seconds, so a loop that has not turned in five minutes has
    # stopped — and waiting half an hour to say so would outlast the form.
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_intake_reader", "--quiet"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    command:
      - python
      - manage.py
      - run_intake_reader
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      SEED_DEV_DATA: "0"
      # This is a deployed stack, and it says so. `config/test_safety.py`
      # refuses to start the test suite in any environment carrying this
      # marker, which is the control that makes "do not run pytest through this
      # Compose project" more than a sentence in a runbook: `docker compose run`
      # inherits a service's environment, so a test process started here sees it
      # and stops. The application itself never reads it.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # The staged `Uus teema` files, READ-ONLY — the same volume `web` writes.
      #
      # Read-only because that is the whole of what this process does with
      # them. Staging bytes are written by the upload view and deleted by
      # `consume_session` after `Loo teema`, both in `web`, and swept by
      # `intake-sweeper` (docs/adr/0177). Nothing on this side needs
      # to change the source it is reading, so nothing on this side is given
      # the ability to.
      - pending_uploads:/app/pending-uploads:ro
    networks:
      - internal

  # Search freshness: what keeps the index current after a vocabulary change.
  #
  # An Organisation rename, an alias edit, a Tag or PolicyArea rename changes
  # the indexed text of every record naming them — thousands of rows from one
  # small admin form. That is deliberately not fanned out inside the request;
  # instead the mutation records a durable obligation in its own transaction and
  # this loop discharges it with an atomic full rebuild
  # (app/search/freshness.py, docs/adr/0041).
  #
  # A container rather than a cron entry, and not for want of trying the simpler
  # thing: this host's cron is generated from the flash drive and editing it can
  # take Unraid's own mover and parity jobs with it, which the test stack's
  # README says in as many words. The master specification names a management
  # command from the application image for exactly this job (§24.3).
  #
  # Without this service the stack still works and search still converges — an
  # operator runs `rebuild_search_index` when `check_search_integrity` says a
  # rebuild is owed, which is what happened before SEARCH-001. What is lost is
  # that somebody has to notice.
  searchindex:
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-searchindex
    restart: unless-stopped
    logging: *bounded-logs
    # Convergence, not liveness: the probe asks whether anything has been owed
    # too long, which is the failure that reaches a reader. A stopped worker
    # with nothing owed is green here and correctly so — the index is complete —
    # and goes red within SEARCH_REBUILD_DEBT_STALE_SECONDS of the first change
    # it fails to pick up (app/search/management/commands/check_search_freshness.py).
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_search_freshness", "--quiet"]
      interval: 60s
      timeout: 15s
      start_period: 60s
      retries: 3
    command:
      - python
      - manage.py
      - run_search_refresh_worker
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      SEED_DEV_DATA: "0"
      # As on every other service in this file: `config/test_safety.py` refuses
      # to run the test suite in a process that inherits this marker.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    # No evidence, derivative or source mounts. This process rebuilds a
    # projection out of PostgreSQL and reads no file the application stores;
    # giving it the evidence tree would widen what a compromised container can
    # reach for no benefit.
    networks:
      - internal

  # The `Uus teema` staging sweeper (docs/adr/0177, csf_3942255b466a4e213b958b16).
  #
  # Deletes staging nobody will ask for again — forms past their expiry and
  # forms a Teema has consumed — every INTAKE_STAGING_SWEEP_INTERVAL_SECONDS,
  # bounded per run by INTAKE_STAGING_SWEEP_MAX_SESSIONS and
  # INTAKE_STAGING_SWEEP_MAX_BYTES. An unfinished form survives until its own
  # expiry. Before this it was `prune_intake_staging` run by hand, which nothing
  # scheduled, so the volume below was bounded by an operator's memory.
  #
  # A container rather than a cron entry, for the reason `searchindex` gives:
  # this host's cron is generated from the flash drive. Its own container
  # rather than a turn of the intake reader's loop, because the reader mounts
  # the staged files read-only on purpose and deleting them needs write access.
  #
  # **It mounts the staging volume and nothing else.** No evidence, no
  # derivatives, no corpus: the immutable evidence tree is not reachable from
  # this process at all, and inside the volume the sweep follows no symbolic
  # link and refuses a session whose tree is not what it wrote.
  #
  # Convergence, not liveness, like `searchindex`: the probe is red when a stale
  # session has waited longer than INTAKE_STAGING_SWEEP_STALE_SECONDS, or when
  # staging is full or the volume is short of INTAKE_STAGING_MIN_FREE_BYTES.
  intake-sweeper:
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-intake-sweeper
    restart: unless-stopped
    logging: *bounded-logs
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_intake_staging", "--quiet"]
      interval: 300s
      timeout: 15s
      start_period: 60s
      retries: 3
    command:
      - python
      - manage.py
      - prune_intake_staging
      - --loop
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      SEED_DEV_DATA: "0"
      # As on every other service in this file: `config/test_safety.py` refuses
      # to run the test suite in a process that inherits this marker.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # READ-WRITE, because deleting is what this process is for.
      - pending_uploads:/app/pending-uploads
    networks:
      - internal

  # «Kontrolli jõustumist» (docs/adr/0188): one idempotent, advisory-locked
  # reconcile of the commencement reminders every 600 s. The same shape as the
  # intake sweeper: no host cron, no mounts, nothing published. If it is not
  # running, no new reminder appears and nothing else is affected.
  notifications:
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-notifications
    restart: unless-stopped
    logging: *bounded-logs
    healthcheck:
      test: ["CMD", "python", "manage.py", "generate_commencement_reminders", "--check", "--quiet"]
      interval: 600s
      timeout: 30s
      start_period: 120s
      retries: 3
    command:
      - python
      - manage.py
      - generate_commencement_reminders
      - --loop
    env_file:
      - ${JURISTID_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      SEED_DEV_DATA: "0"
      # As on every other service in this file: `config/test_safety.py` refuses
      # to run the test suite in a process that inherits this marker.
      JURISTID_RUNTIME: deployed
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # The only route in.
  #
  # Not opt-in, unlike the rehearsal's: there is no host port here, so without
  # the tunnel this stack is unreachable, and a profile would only make that
  # look like a choice.
  #
  # The tunnel is *locally managed*. Its credential was generated on this host
  # by `cloudflared tunnel login` and lives in the ignored appdata directory —
  # no token is stored in this file, in Git, or anywhere a copy could be made by
  # reading the repository.
  #
  # Cloudflare Access sits in front of the hostname and is not optional. The
  # application verifies the assertion Access adds, so a misconfigured or
  # removed Access policy fails closed: requests arrive without a valid
  # assertion and are refused rather than served.
  tunnel:
    # Pinned, not `latest`. This container is the only route in, and `latest`
    # means an unrelated `docker pull` on this host can change the ingress of a
    # real-data system without anyone deciding to. Update it deliberately:
    # read the release notes at https://github.com/cloudflare/cloudflared/releases,
    # change the tag and the digest here, redeploy, and confirm the hostname
    # still answers.
    #
    # The version tag so the next person can see what they are moving from and
    # to; the digest because a tag is only a name the publisher can re-push
    # (ADR 0179). It is the index production was running on 2026-10-22, and it
    # is what docker.io/cloudflare/cloudflared:2026.8.2 resolves to: its amd64
    # image carries `CI_GIT_COMMIT=733bfb93…`, the commit GitHub's 2026.8.2
    # release tag names.
    #
    # No `env_file:` and no `environment:`: the tunnel's credential is the
    # locally managed one in the volume below, and it needs nothing of the
    # application's (tests/test_service_secret_isolation.py).
    image: cloudflare/cloudflared:2026.8.2@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
    container_name: juristid-main-tunnel
    restart: unless-stopped
    logging: *bounded-logs
    command:
      - tunnel
      - --config
      - /home/nonroot/.cloudflared/config.yml
      - run
    volumes:
      - ${JURISTID_DATA_ROOT:-/mnt/user/appdata/juristid-main}/cloudflared:/home/nonroot/.cloudflared
    depends_on:
      # Healthy, not merely started. A tunnel that connects before gunicorn is
      # accepting sends the public hostname 502s that look like an outage, and
      # during a deployment that is precisely the moment somebody is watching.
      web:
        condition: service_healthy
    networks:
      - internal

  # -- AI access: the MCP server, its tunnel (docs/adr/0185) and the write
  # gateway (docs/adr/0189) ---------------------------------------------------
  #
  # All three are behind the `mcp` profile, and that is the switch. Compose leaves a
  # profiled service out of every command that does not name it or activate
  # its profile, so `up -d --no-build` (a release), `up -d tunnel` (a restore)
  # and the backup scripts neither start, replace nor stop them. They start
  # only when named:
  #
  #   docker compose -p juristid-main -f compose.yml up -d --no-build --no-deps mcp
  #   docker compose -p juristid-main -f compose.yml up -d --no-build --no-deps mcp-tunnel
  #
  # and stop the same way, without touching anything else:
  #
  #   docker compose -p juristid-main -f compose.yml stop mcp-tunnel mcp
  #
  # A service named on the command line has its profile enabled for that
  # command (compose-go `WithServicesEnabled`, Compose v2); its `env_file` is
  # read only then, so a host where AI access was never set up — no
  # `juristid-mcp.env` at all — resolves and deploys exactly as before.
  # docs/mcp/OPERATIONS.md is the runbook.

  # The MCP server: ChatGPT's questions, answered from the register as the
  # person who connected, through the same services the pages call.
  #
  # Read-only twice over: no tool writes, and its database connections open
  # with `default_transaction_read_only=on` (JURISTID_PROCESS_ROLE=mcp), so an
  # INSERT from this process fails in PostgreSQL whatever the code says.
  mcp:
    # The release image, like every application service: a release that
    # replaces `web` replaces this too (README "Deploying a release", step 9 —
    # named there, because a profiled service is not part of an unqualified
    # `up`). `assert_deployment_identity.py` derives it from this prefix.
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-mcp
    profiles: ["mcp"]
    restart: unless-stopped
    logging: *bounded-logs
    # A `manage.py` command, so Django's system checks run before it listens
    # and a refused configuration exits rather than serving (JOPS-004).
    command: ["python", "manage.py", "run_mcp_server"]
    # The image's HEALTHCHECK asks gunicorn's port 8000, which this container
    # does not have, so it is replaced: inherited, it could only ever be red.
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_mcp_server", "--quiet"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    # Its OWN environment file, not `juristid.env`. That one holds the shared
    # gate password, the MFA key and the mail credentials; this process
    # verifies bearer tokens by their SHA-256 and reads, so it is given none of
    # them (ADR 0185 §6, tests/test_service_secret_isolation.py). What it does
    # hold is in deploy/unraid-main/juristid-mcp.env.example.
    env_file:
      - ${JURISTID_MCP_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid-mcp.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      # What makes the database connections read-only and the browser's gate
      # secrets unnecessary (config/settings.py, app/core/checks.py).
      JURISTID_PROCESS_ROLE: mcp
      # As on every other service in this file: `config/test_safety.py` refuses
      # to run the test suite in a process that inherits this marker.
      JURISTID_RUNTIME: deployed
      # The container-network address, so `mcp-tunnel` can reach it as
      # http://mcp:8001/mcp over `mcp_edge`. Still no host port.
      MCP_LISTEN_HOST: 0.0.0.0
      MCP_LISTEN_PORT: "8001"
      SEED_DEV_DATA: "0"
      # Where the write tools forward a prepare or a commit (docs/adr/0189):
      # `mcp-writer`, over `mcp_write` only. Not a secret, and unused while
      # MCP_WRITES_ENABLED is off; the key that goes with it is in
      # juristid-mcp.env.
      MCP_WRITE_GATEWAY_URL: http://mcp-writer:8002
    depends_on:
      db:
        condition: service_healthy
    # No volumes at all. Not the evidence tree, not the derivatives, not the
    # staging volume: every answer comes out of PostgreSQL, document text
    # included (its extracted fragments), and a process that holds a bearer
    # token from a third party has no reason to reach a stored file.
    # `internal` for `db`, and `mcp_edge` — the one network the tunnel client
    # is on — so the tunnel reaches this service and nothing else of the stack
    # (MCPSEC-02). `mcp_write`, which holds this service and the write gateway
    # and nothing else, so `mcp` reaches `mcp-writer` and the tunnel client
    # does not (docs/adr/0189).
    networks:
      - internal
      - mcp_edge
      - mcp_write
    # Nothing in this container is written to: Python runs with
    # PYTHONDONTWRITEBYTECODE, logs go to stdout, sessions and caches are in
    # PostgreSQL (and read-only from here). `/tmp` is the one scratch
    # directory, in memory, for anything a library insists on.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bounded so a runaway answer cannot starve `web` and `db` on the same
    # host. MCP_MAX_CONCURRENT_CALLS (4) bounded threads, one Django process.
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128

  # The MCP write gateway (docs/adr/0189): the one process that executes an AI
  # client's proposed change, and only after the person approved it on
  # Juristid's own page with their own authenticator. `mcp` forwards the
  # client's prepare and commit here over `mcp_write`; this process verifies
  # the forwarded bearer token itself, writes through the canonical services,
  # and connects as `juristid_mcp_writer`, a role that writes only the tables
  # those services need — never an account, a grant, a token or an approval
  # (app/mcp_writes/db_role.py, juristid.E050).
  #
  # Behind the `mcp` profile like the other two, so a release, a restore and
  # the backup scripts leave it alone, and it starts only when named:
  #
  #   docker compose -p juristid-main -f compose.yml up -d --no-build --no-deps mcp-writer
  #
  # **Stopping it is the kill switch for every AI write**, and reading goes on:
  #
  #   docker compose -p juristid-main -f compose.yml stop mcp-writer
  mcp-writer:
    # The release image, replaced by a release in the same step as `mcp`.
    image: juristid-main-web:${JURISTID_IMAGE_TAG:-local}
    container_name: juristid-main-mcp-writer
    profiles: ["mcp"]
    restart: unless-stopped
    logging: *bounded-logs
    # `manage.py` commands, so the system checks — E050–E056 among them — run
    # before it listens and before every probe (JOPS-004).
    command: ["python", "manage.py", "run_mcp_write_gateway"]
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_mcp_write_gateway", "--quiet"]
      interval: 30s
      timeout: 15s
      start_period: 60s
      retries: 3
    # Its OWN environment file: its database role and password, its signing
    # key, the gateway key it shares with `mcp`. Nothing of juristid.env — no
    # gate password, no MFA or authenticator key, no mail credential
    # (juristid.E056, tests/test_service_secret_isolation.py) — and nothing of
    # juristid-mcp.env either: `mcp`'s database credentials are not its own.
    env_file:
      - ${JURISTID_MCP_WRITER_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid-mcp-writer.env}
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      # Bounded statements, no kept connection, the writer's own checks
      # (config/settings.py, app/core/checks.py). Not read-only: writing is
      # what it is for, and its role is what bounds the writing.
      JURISTID_PROCESS_ROLE: mcp_writer
      JURISTID_RUNTIME: deployed
      # The container-network address, so `mcp` reaches it as
      # http://mcp-writer:8002 over `mcp_write`. No host port, ever.
      MCP_WRITE_LISTEN_HOST: 0.0.0.0
      MCP_WRITE_LISTEN_PORT: "8002"
      SEED_DEV_DATA: "0"
    depends_on:
      db:
        condition: service_healthy
    # No volumes: no evidence, no derivatives, no staging. No file is uploaded
    # through it and none is read (CONTRACT §0.7).
    #
    # `internal` for `db`; `mcp_write` for `mcp`. NOT `mcp_edge`: the tunnel
    # client — a third party's binary — cannot resolve or reach this service.
    networks:
      - internal
      - mcp_write
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # MCP_WRITE_MAX_CONCURRENT_CALLS (2) bounded threads, one Django process.
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 64

  # The OpenAI Secure MCP Tunnel client: an outbound-only HTTPS connection to
  # api.openai.com:443 that carries ChatGPT's MCP requests to `mcp` and nothing
  # else. No inbound port, no Cloudflare hostname, no public MCP URL.
  #
  # It is on `mcp_edge` and nothing else (MCPSEC-02): a third-party binary,
  # steered by a third party's control plane, that can reach `mcp:8001` and the
  # internet — and not `db`, not `web` (where it could set CF-Connecting-IP and
  # bypass Cloudflare), not `tunnel`, not a worker. `mcp_edge` is an ordinary
  # bridge (not `internal: true`), which is what lets it reach api.openai.com.
  mcp-tunnel:
    # Tag for the reader, digest for Docker (ADR 0179). v0.0.17 is the
    # multi-platform OCI index ghcr.io/openai/tunnel-client:v0.0.17 resolved to
    # on 2026-10-22 (anonymous registry read; amd64 manifest
    # sha256:2a2a85e7…, image revision a248b7f7…, built 2026-10-21). Alpine
    # 3.22, entrypoint `/usr/bin/tunnel-client run`. Moving it: read the
    # release notes at https://github.com/openai/tunnel-client/releases,
    # resolve the new tag's index digest, replace both here, and recreate only
    # this service.
    image: ghcr.io/openai/tunnel-client:v0.0.17@sha256:67b473b4bc23bc984e4a381752e9a2fa75649746edc06e46b27025611835c5c0
    container_name: juristid-main-mcp-tunnel
    profiles: ["mcp"]
    restart: unless-stopped
    logging: *bounded-logs
    # The image sets no USER and would run as root. It needs no privilege — a
    # static Go binary making outbound connections and a loopback health
    # listener on an unprivileged port — so it runs as Alpine's `nobody`.
    user: "65534:65534"
    # The runtime API key and the tunnel id, and nothing else: no value of
    # `juristid.env` or `juristid-mcp.env` (tests/test_service_secret_isolation.py).
    env_file:
      - ${JURISTID_MCP_TUNNEL_ENV_FILE:-/mnt/user/appdata/juristid-main/config/juristid-mcp-tunnel.env}
    environment:
      # Plain HTTP, and only on `mcp_edge`: the bearer token in it never
      # leaves this host's bridge between the two containers.
      MCP_SERVER_URL: http://mcp:8001/mcp
      # At start the client reads the server's protected-resource metadata
      # (RFC 9728) from that same origin and registers it as a target, under
      # the HTTPS-only policy of its OAuth relay. The origin is plain HTTP on a
      # private bridge — the one hop that never leaves this host — so the
      # policy is relaxed for it explicitly; without this `/readyz` stays 503.
      # The metadata names the authorization server, the public Juristid
      # origin, which the client must also be told to trust:
      # MCP_OAUTH_TRUSTED_ORIGINS, in the environment file because it is this
      # host's hostname and the repository is public.
      HARPOON_ALLOW_PLAINTEXT_HTTP: "true"
      # Loopback, the client's own default, named so it stays that way: the
      # health endpoints and the embedded admin UI answer only inside this
      # container, which is where the healthcheck below runs.
      HEALTH_LISTEN_ADDR: 127.0.0.1:8080
      LOG_FORMAT: json
      LOG_LEVEL: info
    # `/readyz` is 200 once the client can take work and 503 while it is gated.
    # busybox `wget` is in the image (/usr/bin/wget); there is no curl.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      # Healthy, not merely started: a tunnel that announces itself before the
      # server answers hands ChatGPT errors that look like a broken connector.
      mcp:
        condition: service_healthy
    networks:
      - mcp_edge
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

networks:
  internal:
    name: juristid-main-internal
    driver: bridge
  # `mcp` and `mcp-tunnel`, and nothing else (MCPSEC-02, docs/adr/0185 §6) —
  # both behind the `mcp` profile. A bridge that reaches the internet, because
  # the tunnel client dials out to api.openai.com.
  mcp_edge:
    name: juristid-main-mcp-edge
    driver: bridge
  # `mcp` and `mcp-writer`, and nothing else (docs/adr/0189). `internal: true`:
  # no route off the host at all — the gateway fetches nothing and calls no one.
  # The tunnel client is not on it, so it cannot reach the gateway.
  mcp_write:
    name: juristid-main-mcp-write
    driver: bridge
    internal: true

volumes:
  # Temporary upload bytes, shared by `web`, `intake-reader` and `intake-sweeper`
  # and by nothing else.
  #
  # Deliberately left for Compose to name. A volume declared like this becomes
  # `juristid-main_pending_uploads`, scoped by the project name at the top of
  # this file — so `juristid-test`, a CI project and a recovery rehearsal each
  # get their own and none of them can reach this one. Writing an explicit
  # `name:` here would give up exactly that isolation, which is the property
  # worth having.
  #
  # Its recovery class is unchanged by having become a volume: not canonical,
  # not backed up, not in the recovery fingerprint. `juristid-backup.sh` does
  # not know about it and must not learn. It may outlive a container
  # replacement, which is convenient and means nothing — what bounds this data
  # is expiry, the staging quotas and the `intake-sweeper` service (docs/adr/0177),
  # not the lifetime of a container
  # (deploy/unraid-main/RECOVERY.md, docs/adr/0064).
  pending_uploads:
