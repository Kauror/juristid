  "1d9d0180371a70cf34c74923590834cba59b3d27",
]
prs = [180, 181, 182, 183, 184, 185, 186, 187, 188, 189, 190, 191, 192]
changes = [
  "Teema lehe ülaosas on Praegune tegevus: kirjuta, mida sa selle ülesandega tegid, ja salvesta — see ongi sammu lõpetamine. Eraldi «Tehtud» nuppu enam ei ole.",
  "Lisa teemale pakub seitset valikut — märge, järgmine tegevus, kaasamine, oluline tähtaeg, jõustumine, töövõit ja teema lõpetamine. Igaühel on oma väike vorm ja oma Salvesta; korraga on lahti üks.",
  "Fail lisatakse täpselt sellele kandele, mille juurde ta kuulub, ja ajajoonel on ta sama rea juures.",
  "Kui kolleeg on vahepeal sama sammu lõpetanud või teema sulgenud, salvestust vastu ei võeta ja midagi ei kirjutata.",
  "Suletud teema Dokumendid on lugemiseks: faile ja arvamusi juurde ei lisa ega saatmist ei registreeri enne, kui teema on uuesti avatud. Lugeda, avada ja alla laadida saab kõike endiselt.",
  "Saatmise registreerimine nõuab saatmise kuupäeva ja vähemalt ühte adressaati; tänast kuupäeva enam ise ei panda.",
  "Teemade otsingusõna × võtab maha ainult otsingusõna, mitte teisi filtreid ega järjestust.",
  "Uue teema vormile kirjutatud uus saatja jääb alles ka siis, kui vorm mõne muu välja pärast tagasi lükatakse.",
  "Kaasamise liigil on igal lehel sama nimi: Kirjade voor.",
  "Valdkond «Muu» koos selgitusega on teema päises näha, mitte enam «Määramata».",
  "Õigusakti liik on teema andmete hulgas loetav.",
  "Uue teema Arvamuse tähtaeg algab tühjana, mitte tänase kuupäevaga.",
  "Muuda teemat küsib saatjat ja adressaati sama otsinguga nagu Uus teema.",
  "Kui teema failide loetelu on filtreeritud, ütleb pealkiri seda ja filtri saab sealtsamast maha võtta.",
  "Kui teema või tegevus on teises aknas vahepeal muutunud — kolleeg lõpetas sammu või sulges teema —, näitab Juristid nüüd selgelt, miks salvestamine ebaõnnestus, ja suletud teema päis uueneb samas aknas.",
  "Lugeja õigusega kasutajale ei näidata enam Vastutaja, Valdkonna, Hetkeseisu ega Märkmete muutmisvälju, mida tal ei ole õigust kasutada. Väärtused on endiselt loetavad.",
  "Kui uue teema juurde valitud faili ei saa vastu võtta, jääb veateade nähtavaks ka pärast teiste failide lugemise lõppu.",
  "Järgmiseks seatud kuupäeva näidatakse töövaadetes nüüd «Plaanis» ning ainult sellise tegevuse hilinemise filter on «Üle aja». Arvamuse tähtaeg ja oluline tähtaeg jäävad endiselt päris tähtaegadeks.",
  "Teema käigu ribal on kohe näha Arvamuse tähtaeg ning hiljem ka Jõustumine. Need paiknevad kuupäeva järgi koos Alustatud, Koja arvamuse ja Lõpetatud verstapostidega.",
  "Tühja andmestiku korral ei näita Statistika enam protsente ega väljasaadetud arvamuste arvu seal, kus järelduse tegemiseks pole piisavalt andmeid.",
  "Kui arvamuste arhiiv on päriselt tühi, ütleb arhiiv seda otse ega jäta muljet, et tulemused puuduvad valitud filtrite tõttu.",
]

[[day]]
date = 2026-09-11
basis = "deployment"
# Kaks väljalaset ühel päeval, üks kirje — nii nagu reegel ütleb.
#
# Öine väljalase (3f795a7d) tõi saatja–adressaadi vaikeväärtuse, Õigusakti
# liigi, faili lugemise uue teema vormil ja Teemade koondamise üheks
# avastamispinnaks. Sama päeva teine väljalase — nelja ettevalmistuse ühendus —
# tõi otsinguga algava asutusevaliku, tabelipäiste filtrid ja järjestused,
# ümber tehtud teema vaate ja osakonna meeskonna paranduse.
#
# Teise väljalaske liitmisrevisjon sünnib alles pärast selle faili kirjutamist,
# nii et siia seda ette kirjutada ei saa; ta on kirjas väljalaske raportis —
# täpselt nagu 9. septembri kirje puhul.
revisions = ["3f795a7ddbac36a25245cf2df1f5854646a0002d"]
prs = [169, 170, 171, 172, 173, 174, 175, 176, 177, 179]
changes = [
  "Uue teema saatja määratakse nüüd vaikimisi ka adressaadiks. Adressaati saab endiselt eraldi muuta.",
  "Uuel teemal saab määrata Õigusakti liigi või mitu liiki.",
  "Uue teema vormile lisatud fail loetakse kohapeal läbi ja leitut kasutatakse pealkirja, saatja, arvamuse tähtaja, menetlusliigi ja valdkondade eeltäitmiseks.",
  "Saatja ja adressaadi valik algab nüüd otsingust: sama väljaga leiab olemasoleva asutuse või lisab + abil uue.",
  "Teemad on keskne avastamispind: töövõidu ja jõustumise leiab Täpsema otsingu kaudu ning eraldi Tähtajad jaotist enam ei ole.",
  "Teemade tabeli päised on toimivad: Hetkeseis, Vastutaja ja Järgmiseks filtreerivad, Kuupäev ja Viimane tegevus järjestavad.",
  "Teema vaade on ümber tehtud: tegevuse sisestamine on kohe avatud, Saabus on päises, kaasamine ja muud sündmused lisatakse samast tegevusalast ning Ajajoone ülaosas näitab uus riba, kus menetlus parajasti on.",
  "Osakonna Meeskond näitab ainult osakonna töötajaid. Mujale kuuluva vastutaja töö on koondatud reale «Väljaspool osakonda».",
]

[[day]]
date = 2026-09-09
basis = "deployment"
# Kaks väljalaset ühel päeval, üks kirje — nii nagu reegel ütleb.
#
# Esimene väljalase (b3df3179) tõi uue teema vormi, ettepanekute paneeli ja
# failide alleshoidmise. Päris andmetega jäid failid sellegipoolest lugemata:
# ükski tee ei viinud pahavarakontrollist läbi, nii et fail jäi igaveseks
# ootele. Sama päeva teine väljalase — allpool loetletud ettevalmistuste
# ühendus — on see, millega lugemine tegelikult tööle hakkas. Esimest
# revisjoni ei tohi lugeda selle rea täitjaks üksi.
#
# Teise väljalaske liitmisrevisjon sünnib alles pärast selle faili kirjutamist,
# nii et siia seda ette kirjutada ei saa; ta on kirjas väljalaske raportis.
revisions = ["b3df3179c273d7c89f22db1d05d764f72e236151"]
prs = [149, 150, 151, 152, 153, 154, 155, 156, 157]
changes = [
  "Uue teema vormile lisatud failid loetakse läbi kohe, veel enne teema loomist, ning leitud saatja, arvamuse tähtaeg, menetlusliik ja valdkonnad pakutakse samal vormil üle vaatamiseks. Iga leid näitab lauset, kust ta pärineb.",
  "Kui automaatne lugemine venib, ütleb vorm seda ja pakub väljad käsitsi täita — varem jäi ekraanile lõputult keerlev ootamise märk. Fail on mõlemal juhul alles ja salvestub teemale.",
  "Kui uue teema salvestamine tagasi lükatakse, jäävad juba valitud failid alles — neid ei pea uuesti otsima.",
  "Saatja valimine on lihtsam: sagedasemad saatjad on kohe näha, kogu kataloogi saab läbi otsida ja puuduva saatja saab lisada otse samal vormil.",
  "Saatjaks valitud asutus on adressaatide seas kohe esimene, nii et vastamiseks ei pea sama asutust nimekirjast uuesti otsima. Valituks ta ise ei hakka.",
  "Jõustumise ja töövõidu saab lisada otse teema lehel, ilma eraldi lehele minemata.",
  "Kokkuvolditud tegevuste kokkuvõte ütleb lühidalt, millal teema loodi ja mitu tegevust seal on, mitte enam süsteemi enda sündmuste loetelu.",
  "Kolleegi määratud lugemata teema ees on töölaual punane hüüumärk.",
  "Kuu täpsusega tähtaeg mahub töörea kitsasse kuupäevalahtrisse: september 2026 asemel 09.26. Päeva juurde ei mõelda.",
]

