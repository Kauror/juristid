# Omaniku kasutajapoolse testi (29.09) parandused, üks väljalase, ADR 0120.
# Kaks aditiivset migratsiooni: documents/0012 (dokumendi eemaldamise veerud)
# ja audit/0030 (kaks uut muudatuse liiki). Ajajoone leiud (UQ-02…UQ-08,
# UQ-14) on meelega järgmiseks korraks jäetud.
prs = [345]
changes = [
  "«Praeguses tegevuses» ei ole enam lauset «Koja arvamus on saadetud. Menetlus võib jätkuda».",
  "Kui teemal ei ole järgmist tegevust määratud, näidatakse «Praeguses tegevuses» järgmisena lähimat tulevast olulist tähtaega. Sama kehtib «Minu asjades» ja nimekirjas «Järgmise tegevuseta» — sellist teemat seal enam ei loeta.",
  "«+ Kaasamine» küsib kohe ka «Tagasisidet ootame kuni». Väli on valikuline ja tühi; täidetuna algab tagasiside ootamine kohe, ilma teise muutmiseta.",
  "«Minu asjades» on kuu, kvartali ja aasta täpsusega kuupäev kirjas sõnadega («oktoober 2026», «IV kvartal 2026», «2026»), mitte «10.26». Sellist rida ei panda «Sel nädalal» alla ainult seetõttu, et periood algab sel nädalal, ja päise arvud «üle tähtaja» ning «sel nädalal» loevad täpselt neid ridu, mis nende all on.",
  "Dokumendi lehel saab nüüd lisada uue versiooni, muuta dokumendi liiki ja ekslikult lisatud dokumendi eemaldada. Varasemad versioonid ja muudatuste logi jäävad alles. Saadetud arvamuse faili ei saa eemaldada ega asendada — selleks võta arvamus kõigepealt tagasi.",
  "«Võta tagasi» on nüüd ka Koja arvamuse real «Teema käigus» ning küsib enne kinnitust. Arvamus jääb ajalukku tagasivõetuna ja ei lähe enam arvestusse.",
  "«Kustuta» on teema päises ainult siis, kui teemat saab tõesti kustutada. Muul juhul selgitab «Muuda teemat» leht, miks see ei ole võimalik.",
]

[[day]]
date = 2026-09-28
basis = "deployment"
# «Dokumentide» vahelehe «Arvamused» plokk on eemaldatud (#342). Koja arvamuse
# lisamise ainus tee on teema lehe «Lisa teemale → Koja arvamus». «Lae dokument»
# ei paku enam rolli «Arvamus». Olemasolevaid kirjeid ei muudetud; «Lõpetamata
# arvamused» ilmub ainult siis, kui vanem mustand või registreerimata
# arvamusfail tõesti ootab — tootmises neid väljalaske ajal ei olnud.
#
# Sama päeva teine väljalase (#343): sisselogimise lehe pealkiri on
# «Õigusloome töölaud» ning sissejuhatav lõik ja jagatud parooli selgitus on
# eemaldatud. Autentimine ei muutunud.
#
# Kolmas (#344): menetluse kulule saab «Muuda» paneelis lisada oma samme
# («+ Lisa samm») — nimi, kuupäev tavalise täpsusega ja koht rajal. «Muuda» on
# nüüd igal avatud teemal, ka siis, kui rajal veel midagi pole. Läbitud etapp
# jääb rajale ka siis, kui see oli varem peidetud või kui teema õigusakti liik
# muutus. Üks migratsioon (matters/0040), ADR 0119.
prs = [342, 343, 344]
changes = [
  "Koja arvamus lisatakse nüüd ainult teema lehel, «Lisa teemale» → «Koja arvamus», kus fail salvestatakse koos saatmise kuupäeva ja adressaatidega. «Dokumentide» vahelehel ei ole enam «Arvamused» plokki ega nuppe «+ Uus arvamus» ja «+ Registreeri saatmine», ning «Lae dokument» ei paku enam rolli «Arvamus».",
  "Saadetud arvamused on «Dokumentides» endiselt «Arvamus» ridadena näha, koos saatmise andmete, parandamise ja tagasivõtmisega; varem lisatud arvamusi ja faile ei muudetud.",
  "Sisselogimise lehel on nüüd ainult pealkiri «Õigusloome töölaud» ja parooli väli; selgitavad tekstid lehelt eemaldati.",
  "Menetluse kulule saab nüüd ise samme lisada: «Muuda» → «+ Lisa samm», kus annad sammule nime, kuupäeva (päev, kuu, kvartal või aasta) ja koha rajal. Sama nimega samme võib olla mitu, lisatud sammu saab hiljem parandada või eemaldada ning «Muuda» on olemas ka teemal, mille rajal veel midagi ei ole.",
  "Etapi eemaldamine võtab rajalt ainult selle etapi. Etapp, kuhu teema on jõudnud või mis on kirja pandud, jääb rajale ka siis, kui see oli varem peidetud või kui teema õigusakti liik hiljem muutus.",
]

[[day]]
date = 2026-09-27
basis = "deployment"
# Üks väljalase: inseneriauditi paranduste ringid 9–19 (#309–#334), teema
# lehe puhastus (#335), väikese kirja «i»-täpi parandus (#337) ja menetluse
# kulu siltide kattumise parandus (#336). Suur osa ringidest on turvalisus,
# lukustus, varundus, kontrollid, testid ja CI — neist siin punkte ei ole,
# sest jurist seda ei näe. Punktid on ainult see, mida ta märkab.
#
# **Hiireklõps muutub ka.** #311 järel ei salvesta teema päise vastutaja ja
# hetkeseis enam valiku muutmisel, ka mitte hiirega valides — ainult
# «Salvesta». Sellepärast on see oma punkt, mitte ainult klaviatuuri oma.
#
# **Meelega punktita:** #310 (registri uuendamisel arhiivi mineva teema
# avatud töö lõpetamine) juhtub ainult operaatori registriuuendusel; #322 ja
# #323 on kiirus, mida lugeja ei mõõda; #332/#333 eemaldavad kasutamata koodi
# ilma nähtava muutuseta.
#
# **Sama päeva parandus pärast väljalaset:** omaniku kasutajatestis leitud
# viga — «Alguses» oleval teemal joonistas menetluse kulg saadetud arvamused
# «Alguse» ette (#339); ja «Teema käigus» joonistati ka toetavad kirjed
# (märge, tagasiside, teiste arvamus, «Teema loodud») suure sinise punktiga
# tavalise kirja kõrval (#340). Mõlemad ainult kuvamine; andmeid ei muudetud.
#
# **Samal päeval veel:** omaniku tagasiside järel on «Teema käik» kompaktne
# akordion (#341) — iga kirje on vaikimisi üks rida ning üksikasjad, failid ja
# «Muuda» avanevad kirjel klõpsates. Ainult kuvamine ja avamine; andmeid,
# järjekorda ega õigusi ei muudetud.
prs = [309, 310, 311, 312, 313, 314, 315, 316, 317, 318, 319, 320, 321, 322, 323, 324, 325, 326, 327, 328, 329, 330, 331, 332, 333, 334, 335, 336, 337, 339, 340, 341]
changes = [
  "«+ Märke» vormil ei ole enam «Etapi» valikut. Varasemate märgete etapid jäävad alles ja «Muuda» pakub etappi ainult real, millel see juba on.",
  "«+ Märke» ja «+ Arvamuse / tagasiside» kuupäevaväli on nüüd kompaktne ega veni enam üle kogu vormi.",
  "«Lõpeta teema» on lihtsam: selgitavad lisatekstid on ära võetud, valikud ja nende mõju on samad.",
  "«Menetluse kulu» sinine joon kulgeb nüüd ühe katkematu joonena kuni praeguse kohani. Pikk etapinimi, näiteks «Kooskõlastusring», ei kirjutu enam kõrvaloleva nime peale; kui kõik etapid ei mahu, kerib ainult menetluse kulg, mitte kogu leht.",
  "«Menetluse kulus» on välja saadetud Koja arvamused nüüd õiges kohas: pärast teema algust saadetud arvamus ei ole enam «Alguse» ees ja mitu arvamust on alati saatmise järjekorras.",
  "«Teema käigus» on esile tõstetud ainult välja saadetud arvamus, avaldatud ülevaade ja teema lõpetamine, nii et olulisemad sündmused on kergemini leitavad.",
  "«Teema käigus» on suur sinine punkt nüüd ainult välja saadetud arvamusel, avaldatud ülevaatel ja teema lõpetamisel; märked, saabunud tagasiside, teiste arvamused ja muud toetavad kirjed on väiksema halli punktiga.",
  "«Teema käik» on nüüd kompaktsem: iga kirje on vaikimisi üks rida pealkirja ja kuupäevaga ning üksikasjad, failid ja «Muuda» avanevad kirjel klõpsates; olulisemad kirjed on endiselt teistest selgemalt esile tõstetud.",
  "Pika ajalooga teemal näitab «Näita varasemaid» nüüd kogu teema käigu; varem võis tihedalt täidetud teemal mõni rida vahele jääda.",
