# Üks väljalase, kolm ühendust: välise organisatsiooni seisukoht teema juures,
# tagasiside tähtaja nähtavus ajajoonel ja kodulehe ülevaate lisamise teine tee.
#
# Kolm punkti, mitte neli. Kolmas ühendus puudutab ainult üht visuaaltesti ja
# selle kinnisel kuupäeval seismist — ühtegi tööpinda, arvu ega kuupäeva, mida
# lugeja näeb, see ei muuda. README ütleb, et selline päevatöö punkti ei saa.
#
# Esimene punkt. Teema juurde saab nüüd kirja panna, mida mõni teine
# organisatsioon samast asjast arvab — kes, kust see pärineb ja soovi korral
# millal ning lühidalt mida. Lugejale on oluline ainult see, et selleks on nüüd
# koht; mis selle taga on, ei ole tema küsimus.
#
# Seisukoht on märge teema juures: see ei muuda Koja arvamust, ei tekita
# tähtaega, tööülesannet ega töövõitu, ja seda siin ei lubata — lugeja ei tohi
# jääda arvama, et märkimine kuidagi asja ennast edasi liigutab.
#
# Teine punkt on tagasiside tähtaja oma. Tähtaeg ise sai kirja panna juba
# 14. septembrist; uus on see, et ta paistab ajajoone ülaosas välja, mitte ainult
# kaasamise rea sees. Punkt ütleb seda ja mitte rohkem — tähtajast ei teki
# endiselt järgmist tegevust ega tööülesannet.
#
# Kolmas punkt on kodulehe ülevaate oma, ja see **ei korda** 15. septembri punkti.
# Seal sai ülevaate märkida plaanituks ja lingi hiljem salvestada. Siin on juurde
# tulnud teine tee: juba ilmunud ülevaate saab lisada kohe, koos lingi ja
# avaldamise kuupäevaga, ilma seda enne plaaniks märkimata.
#
# `revisions` oli seda kirjet kirjutades tühi, sest väljalase ei olnud veel
# toimunud. Nüüd on ja revisjon on teada, nii et see on siia kirja pandud.
revisions = [
  "a4393b737f973ccf9e6c20d9efa94f09c7c9bad0",
]
prs = [220, 221]
changes = [
  "Teemale saab nüüd lisada välise organisatsiooni seisukoha: märkida organisatsiooni, lisada lingi või dokumendi ning soovi korral kuupäeva ja lühiselgituse.",
  "Teema ajajoone ülaosas kuvatakse nüüd ka kaasamise juurde märgitud tagasiside tähtaeg.",
  "Kodulehe ülevaate saab nüüd lisada kas plaanituna või kohe koos koda.ee lingi ja avaldamise kuupäevaga.",
