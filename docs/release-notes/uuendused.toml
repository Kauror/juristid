  # #359). Üks migratsioon (matters/0044). Kui see väljalase ei jõua tootmisse
  # 02.10 (Tallinna aja järgi), liiguvad need read väljalaske päeva kirjesse.
  "Kaasamine jääb avatuks seni, kuni vajutad «Lõpeta kaasamine», ka siis, kui tagasiside tähtaega ei ole määratud.",
