  "Klaviatuuriga liikudes on fookus paremini näha: «Mida tegid?» väljal on taas fookuse raam, ülemine riba ei kata enam fookuses olevat välja ja «Näita varasemaid» järel jääb fookus esimesele uuele reale.",
  "Väike hall tekst on paremini loetav ja Windowsis ei sulandu väikese kirja «i» ja «j» täpp enam tähe sisse.",
