changes = [
  "Otsing on täpsete, harvade ja kirjavigadega otsingusõnade puhul tunduvalt kiirem. Tulemused ei katke enam 50 juures: ülejäänud on nummerdatud lehtedel.",
  "Otsing leiab nüüd ka sõna teisi vorme (näiteks «seadus» leiab ka «seaduse»), täpitähtedeta kirjutatud sõnu («pollumajandus» leiab «põllumajandus») ja sõna algust. Iga tulemuse juures on kirjas, millisest kirjest vaste tuli.",
  "Iga dokumendi leiab otsinguga tema pealkirja või failinime järgi, ka siis, kui faili sisu ei ole loetud.",
  "Otsingu täielik uuendamine ei pane enam salvestamist pikalt ootama.",
