  "„Arvamuse tähtaeg” on nüüd ainus kuupäev, mida uue teema loomisel küsitakse, ja see tekitab teemale ka esimese tegevuse „Koostan arvamuse”; tühjaks jäetud lahter ei tekita endiselt midagi.",
