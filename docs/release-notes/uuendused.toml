  "Teema päises salvestub vastutaja ja hetkeseisu muutus nüüd alles «Salvesta» vajutamisel, ja klaviatuuriga valikute vahel liikumine ei muuda enam kogemata teemat ega filtrit.",
  "«Minu asjade» «Kuupäevata» plokis avab «Näita kõiki» nüüd täpselt need kuupäevata tegevused, mille eest sina vastutad.",
  "Teema dokumentide loetelus on rea tegevused — allalaadimine, «⋯» ja «Ava» — nüüd alati näha, ka puuteekraanil, ja neid on lihtsam tabada.",
