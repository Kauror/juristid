  "Edasist teed pakutakse nüüd õigusakti liigi järgi: ELi määruse juures ei pakuta enam ülevõtmist, sest ELi määrust ei võeta üle, ja määruse juures ei pakuta Riigikogu. Valitsuse etapp on määruse puhul märgitud tingimuslikuna, sest õigusakti liik ei ütle, kas määruse annab valitsus või minister.",
  "Kirjas olevad kuupäevad — alustatud, tähtajad, Koja arvamus, jõustumine — on nüüd menetluse kulu juures, sest need vastavad küsimusele, kuhu teema läheb. ELi õiguse ülevõtmise tähtaeg on nüüd nende seas nähtav juba siis, kui see alles ees on.",
