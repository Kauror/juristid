# Juristidi uuendused, päevade kaupa.
#
# Üks kirje ühe kalendripäeva kohta. Kuupäev on päev, mil muudatus jõudis
# kasutajateni; mitu sama päeva väljalaset on üks kirje. Kirjuta kasutaja
# keeles — mis on teisiti, kui ma Juristidit kasutan.
#
# `basis`, `revisions` ja `prs` on hooldaja märkmed. Neid lehel ei näidata ja
# need ei tohi jõuda `changes` teksti. Vt docs/release-notes/README.md.

