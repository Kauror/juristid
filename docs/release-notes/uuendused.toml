# Üks väljalase, seitse ühendust: kaasamise tagasiside ootamine ja lõpetamine,
# välise organisatsiooni seisukoht ainult tekstina koos ühise organisatsioonide
# loendiga, ülevaate ja uudise lisamine mis tahes avaliku lingiga, sarnaste
# varasemate teemade pakkumine uue teema loomisel, kasutusest võetud hetkeseisu
# säilimine, uue teema vormi failipõhise automaattäitmise äravõtmine ning
# kompaktsem valdkondade valik kahe kasutusest võetud valdkonnaga.
#
# **Miks 17., mitte 16. september.** Need ühendused said valmis 16. septembril ja
# kirje oli algul sinna kirjutatud. Väljalase ise jääb järgmisesse päeva, ja
# README ütleb, et kuupäev on päev, mil muudatus jõuab kasutajateni — mitte see,
# millal ta valmis sai. Seda kirjet kirjutades ei ole väljalaset veel toimunud:
# 17. september on päev, millele see on plaanitud, ja kui väljalase peaks
# nihkuma, nihkub kirje koos sellega. 16. septembri kirje on puutumata: selle
# kolm punkti jõudsid lugejani sel päeval ja jäävad sinna.
#
# Esimene punkt (kaasamine) räägib tähtajast, mis jõuab vastutaja tööde hulka,
# ja kaasamise lõpetamisest. Sellega ei ole vastuolus 15. septembri kaasamise
# punkt ega 16. septembri teine punkt: seal oli kuupäeva täpsus ja tähtaja
# *nähtavus*, siin on see, et tähtaeg on nüüd töö, mida oodatakse, ja et
# kaasamise saab kinni panna.
#
# Teine punkt (väline seisukoht) **ei korda** 16. septembri esimest punkti. Seal
# oli seisukoha koht üldse; siin on juurde tulnud see, et linki ega dokumenti ei
# pea olema — piisab tekstist — ja et organisatsioon valitakse samast loendist,
# mida saatja ja adressaadi juures juba kasutatakse. Lugeja jaoks on teine pool
# sama tähtis kui esimene: nimi kirjutatakse ühtemoodi kõikjal.
#
# Kolmas punkt (ülevaade ja uudis) **ei korda** 16. septembri kolmandat ega
# 15. septembri oma. Seal oli koda.ee ülevaade; siin on ülevaate kõrvale tulnud
# uudis ja link võib viia ükskõik millisele avalikule lehele. Kuupäeva ettepanek
# mainitakse, sest see on vormil nähtav abi, mitte sisemine reegel.
#
# Neljas punkt (sarnased teemad) puudutab uue teema vormi. Punkt ütleb, mida
# soovitus arvesse võtab ja mida ta varasema teema kohta näitab, sest just see
# teeb soovitusest otsustatava asja. Mootorist, mis soovitused arvutab, ei ole
# lugejal midagi teada vaja.
#
# Viies punkt (hetkeseis) on piiripealne ja siin teadlikult sees. Ükski
# hetkeseis ei ole praegu kasutusest väljas, nii et täna ei näe lugeja midagi
# teisiti; varem oleks aga kasutusest võetud seisu kandval teemal see seis
# vaikselt kaotsi läinud, kui teemat muudeti. Punkt kirjeldab lubadust, mitte
# uut nuppu — ja lubadus on see, mille peale lugeja hiljem loodab.
#
# Kuues punkt (uue teema vorm) on juristide esimese tagasisidevooru oma: vorm ei
# loe enam lisatud faili ega täida selle põhjal välju ette. Punkt ütleb kohe ka
# selle, mis alles jääb — faile saab endiselt lisada ja need säilivad, ning
# saatja tuleb nüüd nime otsides —, sest muidu loeks seda kui failide või
# saatja kadumist. Sellega ei ole vastuolus sama päeva neljas punkt: sarnaseid
# varasemaid teemasid pakutakse edasi, sest need pakuvad teemasid, mitte
# vormiväljade sisu.
#
# Seitsmes punkt (valdkonnad) on kaks muudatust ühes lauses, sest lugeja kohtab
# neid ühel ja samal väljal: valik on kompaktsem ja kaks senist valikut ei ole
# uutele teemadele enam valitavad. Mõlemad valdkonnad on nimepidi väljas, sest
# lugeja otsib just neid kahte ega leia; ja et varasemad valikud säilivad, on
# sama lubadus, mille viies punkt hetkeseisu kohta annab — vana teema
# klassifikatsiooni ei võeta ära sellega, et uus valik on kitsam.
#
# `revisions` oli seda kirjet kirjutades tühi, sest väljalaset ei olnud veel
# toimunud. Nüüd on ja revisjon on teada — loetud toodangu enda käest, `/healthz`
# ja `/app/GIT_SHA` ühtelangevalt —, nii et see on siia kirja pandud, nagu
# 16. septembri kirje juures.
revisions = [
  "b2d2001f08ac2fa8f8a02583fb1aa8fa7aaf1769",
]
prs = [225, 226, 227, 228, 230, 231]
changes = [
  "Kaasamisele saab nüüd määrata tagasiside tähtaja, mis ilmub vastutaja tööde hulka; saabunud arvamused saab lisada ning kaasamise lõpetatuks märkida.",
  "Välise organisatsiooni seisukoha saab nüüd salvestada ka ainult tekstina ning organisatsiooni valida samast loendist, mida kasutatakse saatjate ja adressaatide juures.",
  "Teemale saab nüüd lisada nii ülevaate kui ka uudise mis tahes avaliku veebilingiga; lingi sisestamisel pakub vorm avaldamise kuupäevaks tänast kuupäeva.",
  "Uue teema loomisel pakub rakendus nüüd sarnaseid varasemaid teemasid; soovitused arvestavad ka õigusakti liiki ning näitavad, kas varasemas teemas esitati arvamus, saadeti seisukoht või märgiti töövõit.",
  "Kui mõni hetkeseis võetakse kasutusest, jääb see alles neil teemadel, mis selles seisus on, ja on nende juures eraldi märgitud.",
  "Uue teema vorm ei paku enam failipõhist automaattäitmist; failide lisamine säilib ja saatja valikud ilmuvad nime otsimisel.",
  "Valdkondade valik on kompaktsem ning „Koalitsioonilepped” ja „ELi õiguse ülevõtmine” ei ole uutele teemadele enam valitavad; varasemad valikud säilivad.",
]

