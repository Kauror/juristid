  "Päeva teise uuendusega võeti see erand tagasi: menetlusliiki, kellele ja silte teema muutmise vaates enam ei küsita ning uus teema ja teema muutmine küsivad nüüd täpselt samu asju. Varem sisestatud väärtused jäävad alles.",
  "Menetluse link käib nüüd teema andmete juurde: seda küsitakse nii uut teemat luues kui ka teemat muutes, ja teema lehel on lingid koos ülejäänud teema andmetega.",
  "Teemale lisamise rida on nüüd neli valikut — märge, kaasamine, arvamus või tagasiside ja ülevaade või uudis — ning täpsem liik valitakse teise sammuna.",
  "Märget ja menetluse arengut ei lisata enam eraldi: mõlemad on üks märge, mis küsib kuupäeva ja seda, mis juhtus. Varem lisatud kirjed jäävad muutmata ja neid saab endiselt parandada.",
  "Sama märke juurde saab kohe valida uue hetkeseisu ja järgmise tegevuse, nii et eraldi järgmise tegevuse valikut lisamise real enam ei ole.",
  "Töövõidu lisamisel küsitakse nüüd täpset kuupäeva; varem kuu, kvartali või aasta täpsusega salvestatud töövõidud jäävad nii, nagu need on.",
