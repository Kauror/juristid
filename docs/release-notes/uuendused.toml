  "Teema lehel on nüüd eraldi sisuline „Teema käik” ja „Menetluse kulg”, tehnilise muutmisajaloo saab avada „Kõik muudatused” kaudu, töövõit seisab ajaloos oma tegeliku perioodi juures ning teadmata kuupäev kirjutatakse välja, mitte ei asendata tänase päevaga.",
  "Vormiväljade selgitused seisavad nüüd välja enda juures ja jõuavad ka ekraanilugejani — nende hulgas ülevaate või uudise avaldamiskuupäeva selgitus ning teema lühikokkuvõtte oma, mida varem üldse ei kuvatud.",
  "Kaasamise lõpetamisel lisatud failid säilivad nüüd koos saabunud tagasisidega ja on selle kaasamise juures tõendina avatavad; varem läksid need salvestamisel kaduma ilma veateateta.",
