# Üks väljalase inseneriauditi paranduste ringide tööst. Suur osa
# sellest on turvalisus, lukustus, logid, kontrollid ja CI — sellest siin punkte
# ei ole, sest jurist seda ei näe. Punktid on ainult see, mida ta märkab.
