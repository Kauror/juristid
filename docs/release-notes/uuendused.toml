# Omaniku teine läbivaatus Teema ekraanidel. Neli parandust, millest kolm
# muudavad seda, mida leht küsib, ja üks lisab tegevuse, mida rakenduses seni
# üldse ei olnud.
#
# **Esimene punkt võtab tagasi selle, mida eile lubati.** 19. septembri kirje
# kuues ja seitsmes punkt ütlesid, et valdkonnad ja hetkeseis valitakse nüüd
# rippmenüüst. Juristid vaatasid lehte ja palusid nähtavad valikud tagasi.
# Punkt nimetab mõlemad väljad korraga, sest lugeja jaoks on see üks muudatus:
# klassifikatsioonid on lehel lahti, nagu õigusakt nende all alati olnud on.
# Vanu punkte ei kustutata ega parandata — 19. september ütleb, mis sel päeval
# tõesti nii oli (docs/release-notes/README.md).
#
# **Teine punkt on see, mida lugeja päriselt märkab** kahe ekraani võrdlusest:
# samad küsimused, samas järjekorras, samade valikutega. Punkt ei nimeta
# ühtegi välja, sest nimekiri oleks pikem kui see, mida keegi peab teadma —
# oluline on, et muutmise vaadet ei pea eraldi õppima.
#
# **Kolmas punkt nimetab ka selle, mis ei muutu.** Nähtavuse valikut enam ei
# küsita, kuid juba piiratud teemad jäävad piiratuks — vaikimine jätaks mulje,
# et valiku kadumisega kadus ka piirang. Seda, kuidas piirangut nüüd seatakse,
# punkt ei luba, sest rakenduses seda praegu teha ei saa.
#
# **Neljas ja viies punkt käivad koos.** Kustutamine on ainus pöördumatu tegu
# rakenduses, nii et lugeja peab teadma nii seda, et see on olemas, kui ka
# seda, et see võib keelduda. Keeldumise põhjuseid punkt ei loetle — rakendus
# ütleb need ise, siis kui need kehtivad.
#
# **Teine väljalase samal päeval, ja see võtab tagasi kahe eelmise punkti
# erandi.** Ülemine loetelu kirjeldab hommikust ringi, nagu see sel hetkel
# tõesti oli; vanu punkte ei kustutata ega parandata, täpselt nagu 19. septembri
# omi ei parandatud (docs/release-notes/README.md). Kuues punkt ütleb, mis
# päeva lõpuks kehtib — teine punkt lubas kolme lisaküsimust muutmise vaates ja
# omanik võttis erandi tagasi, nii et loetelu tuleb lugeda järjekorras.
#
# **Ülejäänud punktid on teema lehe enda ring.** Kaks neist nimetavad ka seda,
# mis ei muutu — vanad menetluse arengud ja varem kuu või kvartali täpsusega
# salvestatud töövõidud —, sest kirje, mis ütleb ainult uut reeglit, jätab
# mulje, et vana sisu kirjutati üle.
#
# Ükski punkt ei nimeta kirjeliike ega ekraaniosade sisemisi nimesid: lugeja
# kohtab neid nuppudena, mitte mõistetena.
#
# **Kolmas väljalase samal päeval: teema käik etappide kaupa ja tingimuslik
# edasine tee.** Sama kalendripäev, sama kirje — lugeja kohtab kõike kolme
# järgmisel korral, kui rakenduse avab (docs/release-notes/README.md).
#
# **Esimene uus punkt on see, mida juristid päriselt palusid**: kolme aasta
# teema ei loeta enam ühe pika kuupäevade veeruna, vaid menetluse enda kujuga.
# Punkt nimetab etapid nende oma sõnadega, sest need on juristide endi sõnad.
#
# **Teine punkt ütleb, kust etapp tuleb, ja ütleb selle ausalt.** Rakendus ei
# arva midagi teksti, faili ega kuupäeva järgi — etapi paneb inimene märke
# juurde, ja ülejäänud kirjed leiavad koha kahe märke vahele jäävast ajast.
# Punkt lubab ka seda, et vana sisu ei kirjutata ümber: ükski varem sisestatud
# kirje ei saa etappi juurde ega kaota midagi.
#
# **Kolmas punkt on «Etapiga sidumata», ja see peab kõlama tavalise vastusena.**
# See ei ole viga ega töönimekiri; kirje on olemas, loetav ja parandatav.
# Punkt ütleb ka, kuidas see laheneb — üks märge, ja rida leiab oma koha.
#
# **Neljas punkt on edasine tee, ja iga sõna selles on tingimuslik.** «Võib
# olla» on punktis sees, sest see on kogu asja mõte: rakendus tuletab meelde,
# mis võib järgneda, ega luba, et see juhtub. Punkt ütleb otse välja, et sellest
# ei teki tähtaega ega järgmist tegevust — muidu loeks lugeja seda plaanina.
#
# **Viies punkt nimetab kaks asja, mida rakendus enam valesti ei ütle.** ELi
# määrust ei võeta üle ja määrust ei võta vastu Riigikogu; varem pakkus leht
# mõlemat. Punkt kirjutab selle kasutaja keeles, mitte reegli keeles.
#
# **Kuues punkt on kuupäevade koht.** Need liikusid sinna, kus küsitakse «kuhu
# see teema läheb», ja ülevõtmise tähtaeg on nüüd üldse nähtav — varem sai selle
# kirja panna ja seejärel ei näinud seda enne, kui päev kätte jõudis.
#
# Ükski punkt ei luba, et rakendus jälgib eelnõude registrit ise: kõik, mida
# leht ütleb, tuleb sellest, mis on teemale kirja pandud.
prs = [263, 265]
changes = [
  "Uue teema lisamisel on valdkonnad ja hetkeseis taas kohe nähtavate valikutena — rippmenüüsid enam ei ole ja kõik valikud on lehel lahti.",
  "Teema muutmise vaade järgib nüüd uue teema lisamise vaadet: samad küsimused samas järjekorras ja samade valikutega, lisaks menetlusliik, kellele ja sildid, mida uut teemat luues ei küsita.",
  "Teema muutmise vaatest ja saabunud materjali registreerimisest eemaldati nähtavuse valik; juba piiratud nähtavusega teemad jäävad piiratuks.",
  "Teema saab nüüd muutmise vaatest kustutada: kustutamine eemaldab teema ja kogu selle sisu jäädavalt ning seda küsitakse eraldi lehel üle.",
