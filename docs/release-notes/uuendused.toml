date = 2026-09-30
basis = "deployment"
# Omaniku teise kasutajapoolse testi (30.09) parandused, üks väljalase, ADR 0121.
# Migratsioone ei ole. Saadetud Koja arvamuse kuupäev jääb tulevikku keelatuks.
# Sama päeva teine väljalase, ADR 0122 (samuti migratsioonideta): e-kirja manused
# ühe reana ja laia perioodiga tähtaeg igas tähtajavaates ühtmoodi — kaks viimast
# rida. opinion_sources.py juhtmärgi parandus ei ole kasutajale nähtav.
changes = [
  "Kuupäeva võib sisestada nii minevikku, tänasesse kui ka tulevikku — ka märkele, kaasamisele, teiste arvamusele, meile saadetud tagasisidele ja avaldatud ülevaatele. Tulevikku jääv kirje on «Teema käigus» kohe näha ja märgitud «Eesolev».",
  "Kaasamise muutmisel on samad väljad, mis selle lisamisel. Üldist «Link» ja «Märkus» välja seal enam ei ole; varem salvestatud väärtused jäävad alles.",
  "Veebiaadressi võib kirjutada ilma «https://»-ta, näiteks www.delfi.ee või delfi.ee/uudised — see lisatakse ise. Täielik aadress jääb samaks ning aadressiks mittesobiv tekst lükatakse endiselt tagasi.",
  "«Teema käigus» on lingid puhtad: kaasamisel lihtsalt «Smaily» ja «Alchemer», ülevaatel «Ülevaade / uudis», ilma lisanumbrite ja ikoonideta.",
  # ADR 0123, migratsioonideta: laia perioodiga jõustumine ja menetluse kulu
  # kuupäev on läbitud alles perioodi lõpus. Kui see väljalase ei jõua tootmisse
  # 30.09, liiguvad need kaks rida väljalaske päeva kirjesse.
  "Kuu, kvartali või aasta täpsusega jõustumine on «Teema käigus» «Jõustub» kuni perioodi lõpuni ja «Jõustus» alles siis, kui periood on läbi. «Menetluse kulg» ja statistika loevad akti jõustunuks samal päeval.",
  "«Menetluse kulus» ei märgita kuu, kvartali ega aasta täpsusega kuupäeva ega sellise kuupäevaga lisatud sammu enam tänaseks — see on tulevikus, kuni kogu periood on möödas.",
  "Kui uue teema loomisel lisatakse korraga mitu faili, on «Teema käigus» üks rida, näiteks «lisas 7 dokumenti». Hiljem eraldi lisatud failid on oma real.",
  "«Minu asjades» ei panda kuu, kvartali ega aasta täpsusega kuupäeva enam «Sel nädalal» alla — see on «Hiljem», kuni periood on läbi. Teema, mille järgmine tegevus on kolleegil, ei ole enam «Järgmise tegevuseta».",
  "Teema lõpetamisel saab valida ka «Muu».",
  "Teema lõpetamisel saab linnukesega «Märgi töövõiduks» lisada samal ajal tavalise töövõidu koos lühikirjeldusega.",
  "Kui teemasse lisatud e-kirjast tuuakse välja mitu manust, on «Teema käigus» üks rida, näiteks «lisas 3 dokumenti». Iga e-kiri on oma real ja loetakse ainult tegelikult lisatud manuseid.",
  "Kuu, kvartali või aasta täpsusega tähtaeg on nüüd igas tähtajavaates ühtmoodi: «Osakonna» «Eesolevas», teemade nimekirja tähtajavalikutes ja «tähtaeg 30 p jooksul» arvudes ei ole see enam «Täna», «Homme» ega «sel nädalal» ainult seetõttu, et periood algab — see on «Kaugemal», nagu «Minu asjades» «Hiljem». Üle tähtaja on see alles siis, kui kogu periood on möödas.",
  # ADR 0124, migratsioonideta: «+ Märge» küsib üht tegevust ja üht kuupäeva.
  # Kui see väljalase ei jõua tootmisse 30.09, liiguvad need kaks rida
  # väljalaske päeva kirjesse.
  "«+ Märge» küsib nüüd üht «Tegevust» — kirjuta, mida tegid või mis on järgmine tegevus — ja üht kuupäeva. Eraldi «Järgmine tegevus» ja «Millal?» välju seal enam ei ole.",
  "Kui märke kuupäev on tulevikus, ilmub selle kõrvale linnuke «Märgi järgmiseks tegevuseks». Linnukesega salvestades on sama tekst ja kuupäev ka teema järgmine tegevus; linnukeseta jääb tulevikku jääv märge lihtsalt teadmiseks ega muuda järgmist tegevust.",
]

