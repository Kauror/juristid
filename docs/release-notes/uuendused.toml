[[day]]
date = 2026-09-19
basis = "deployment"
# Kaks väljalaset, viis ühendust. Hommikul: menetluse arengu parandamine,
# tõendi hilisem lisamine sama sammu juurde, ja pikkade katkestusteta tekstide
# taltsutamine neil tööpindadel, kuhu 18. septembri ring ei ulatunud. Pärastlõunal:
# Koja arvamuse enda märksõnad ja arvamuse sidumine sama teema ülevaadete ja
# uudistega.
#
# Üks kirje, mitte kaks. Kalendripäev on siin üksus, mitte väljalase: lugeja
# kohtab mõlemat ringi järgmisel korral, kui rakenduse avab, ja see, kumb pilt
# kumba kandis, ei ole tema küsimus (docs/release-notes/README.md).
#
# Hommikuse ringi kolm punkti, mitte neli. Selle neljas ühendus on katsestiku
# enda sisemine parandus — see ei muuda midagi, mida lugeja rakenduses kohtab,
# ja selline töö ei saa README järgi punkti. Number seisab `prs` real, nagu iga
# teinegi.
#
# **Esimene punkt on see, mida eile veel ei saanud.** 18. septembri
# üheteistkümnes punkt ütles, mida menetluse arenguna salvestada *ei* saa; siin
# on juures see, mida juba salvestatuga peale hakata. Punkt nimetab eraldi
# välja, mis parandamisel ei muutu — hetkeseis, järgmine tegevus ja varem
# lisatud failid —, sest „Muuda” loeks muidu nagu terve salvestuse
# tagasivõtmine. Need kolm on omaette faktid, igaühel oma koht; parandus
# puudutab sündmust ennast, selle kuupäeva ja juristi märkust.
#
# **Teine punkt on esimese teine pool.** Parandamine ei võta faile vastu ja
# faili lisamine ei paranda lauset — kaks eraldi tegu, kaks eraldi nuppu. Punkt
# ütleb otse välja, et tõend *lisandub*, ega luba midagi, mida rakendus ei tee:
# eemaldamist ei ole, sest vale sammu juurde sattunud fail saab vastuse sellest,
# et ta pannakse ka õige juurde.
#
# **Kolmas punkt ei korda 18. septembri viieteistkümnendat.** Seal oli jutt
# märkmete vaatest mobiilis. Siin on tööpinnad, mida too ring ei puudutanud:
# teema lehe käik, järgmine tegevus ja otsingutulemused. Lugeja, kes eile luges,
# et pikk link enam märget ei venita, ja kohtas sama viga otsingutulemuses, peab
# teada saama, et nüüd on ka see kord.
#
# **Neljas punkt nimetab mõlemad sõnad.** Teemal on `Sildid` ja arvamusel on nüüd
# `Märksõnad`, ja kaks klassifikatsiooni ühe faili ümber on täpselt see koht, kus
# lugeja eeldab ülekandumist — nii et punkt ütleb otse välja, et ei kandu. See on
# ka see, mida rakendus teeb: ükski varasem arvamus ei saanud selle
# väljalaskega ühtegi märksõna, ja teema siltide lisamine ei lisa neid arvamusele
# kunagi hiljemgi.
#
# **Viies punkt ütleb, et seos käib mõlemat pidi.** «Siduda saab» üksi jätaks
# lahtiseks, kas ühe arvamuse kohta käib üks ülevaade; tegelikkuses kirjutatakse
# pikk menetlus mitu korda üles ja üks ülevaade katab sageli nii esialgse kui ka
# täiendava arvamuse. Punkt nimetab mõlemad suunad, sest ainult siis teab lugeja,
# et tal ei ole vaja valida.
#
# Kumbki punkt ei luba otsingut. Märksõna ei ole otsingusõna — teema enda sildid
# on otsitavad nagu varem, arvamuse omad ei ole —, ja punkt, mis ütleks «leiad
# üles», lubaks midagi, mida see väljalase ei too.
#
# ---------------------------------------------------------------------------
# Kolmas väljalase, üks ring: «Uus teema» ise.
#
# Neli parandust juristide tagasisidest, kõik ühel lehel. Nad on siin ühes
# kirjes eelmise kahe ringiga, sest kalendripäev on üksus: lugeja kohtab kõiki
# kolme järgmisel korral, kui rakenduse avab.
#
# **Kuues ja seitsmes punkt räägivad sellest, mis vormiga juhtus, mitte sellest,
# kuidas seda tehti.** Juristid ei palunud «menüüd» — nad palusid, et vorm ei
# hakkaks valimise ajal nende käe all ümber laduma. Nii et punkt nimetab mõlemad
# pooled: valimine käib rippmenüüst *ja* ülejäänud vorm seisab paigal. Sellest,
# et menüü katab all olevad väljad seni, kuni ta lahti on, ei ole punkti — nii
# käitub iga rippmenüü ja see ei ole uudis.
#
# **Kaheksas punkt ütleb, mida enam ei küsita.** Menetluse allikas oli viie
# nupuga rida, millest üks oli ette valitud; lugeja, kellel on aadress ees, pidi
# selle enne ära klassifitseerima. Punkt ei luba, et keegi teine selle nüüd ära
# arvab — rakendus ei arva aadressist midagi — vaid ütleb ainult, et küsimust
# ei ole. Teema lehel saab allika endiselt ise nimetada ja vanad lingid on
# puutumata; seda punkt ei korda, sest see ei muutunud.
#
# **Üheksas punkt on see, mille pärast see ring üldse tõusis.** Ühte kuupäeva
# küsiti kahes kohas kahe nime all. Nüüd on üks, vormi lõpus, ja punkt ütleb
# otse välja, mis sellest saab: teema esimene tegevus. Ilma selle teise pooleta
# oleks järgmine hommik üllatus — «Minu asjad» näitab uut teemat lausega
# «Koostan arvamuse», mitte sõnaga «Arvamuse tähtaeg», ja see on täpsalt see,
# mida see punkt lubab. Tühi lahter ei tekita endiselt midagi.
#
# **Kümnes punkt on äravõtmine, ja see väärib punkti.** «Järgmiseks» lahter koos
# oma kiirvalikutega oli uue teema vormil ja on nüüd ainult teema lehel. Lugeja,
# kes seda kasutas, ei leia seda enam ülelt — puuduv kontroll on sama uudis kui
# uus, ja selle vaikimine oleks ainus viis, kuidas see ring saaks kedagi üllatada.
#
# ---------------------------------------------------------------------------
# Neljas väljalase, üks ring: „Lisa teemale” neli paneeli.
#
# Kõik neli olid tehtud ühe harva juhtumi jaoks, mis on päris, ja neid
# kasutatakse iga päev hoopis tavalise juhtumi jaoks. Küsimused, mis harva
# vastust vajavad, on nüüd „Muuda” all; salvestatud kirjetest ei kadunud midagi.
#
# **Üheteistkümnes punkt nimetab mõlemad pooled.** Adressaat on nüüd ette
# pakutud *ja* seda saab ära võtta — ainult esimesest poolest jääks mulje, et
# rakendus otsustab, kellele kiri läks. Viimane lause on seal, sest lugeja, kes
# adressaadi ära vahetab, peab teadma, et teema saatja ei liigu kaasa: need on
# kaks eri fakti ja see punkt on ainus koht, kus lugeja seda kuuleb.
#
# **Kaheteistkümnes punkt on asendus, mitte ümbernimetamine.** „Pealkiri” küsis
# nime; „Kokkuvõte” küsib sisu. Punkt ütleb ka, kus kokkuvõte näha on, sest
# muidu oleks see lahter, mille täitmist keegi kunagi ei kohta.
#
# **Neljateistkümnes punkt on äravõtmine ja väärib punkti.** Neli küsimust
# kadus kahelt paneelilt ja lugeja, kes neid kasutas, ei leia neid enam sealt.
# Punkt ütleb, kuhu nad läksid ja et vanad kirjed on puutumata — vaikimine
# oleks ainus viis, kuidas see ring saaks kedagi üllatada (docs/release-notes/README.md).
#
# **Kuueteistkümnes punkt ütleb ka selle, mida enam ei saa.** Tühjalt
# salvestamine tekitas varem plaanis oleva ülevaate; nüüd küsib vorm lingi.
# Juba plaanis olevad read on alles ja neid saab avaldada ning tühistada nagu
# varem, ja punkt ütleb selle välja, sest lugeja, kes seda võtet kasutas,
# märkaks muidu ainult kadu.
#
# Otsingust punkti ei ole. Kokkuvõte on otsitav nagu arvamuse pealkiri varem —
# see ei ole uus võimalus, vaid sama võimalus uues lahtris, ja punkt, mis
# lubaks „nüüd leiad üles”, lubaks midagi, mida see väljalase ei too.
prs = [248, 249, 252, 253, 255, 257, 259]
changes = [
  "Juba salvestatud menetluse arengut saab nüüd parandada: „Muuda” avab sündmuse enda, selle kuupäeva ja juristi märkuse ning jätab teema hetkeseisu, järgmise tegevuse ja varem lisatud failid puutumata.",
  "Menetluse arengu juurde saab tõendi lisada ka hiljem — „Lisa tõend” paneb faili selle sammu juurde, mida see tõendab, ja varem lisatud failid jäävad alles.",
  "Pikk katkestusteta tekst, näiteks kopeeritud link, ei venita ega lõika enam teema lehe käiku, järgmist tegevust ega otsingutulemusi.",
  "Koja arvamusele saab nüüd lisada eraldi märksõnad; teema sildid jäävad omaette ega kandu arvamusele üle.",
  "Koja arvamuse saab nüüd siduda sama teema ülevaadete ja uudistega — üks arvamus võib olla seotud mitmega ja üks ülevaade mitme arvamusega.",
  "Uue teema valdkonnad valitakse nüüd rippmenüüst: mitu valdkonda saab märkida ühe avamisega ja ülejäänud vorm ei nihku valimise ajal enam allapoole.",
  "Ka hetkeseis valitakse rippmenüüst ja valitud seis on näha nööbil endal, nii et üks kord vastatud küsimus ei võta uue teema vormil enam kahte rida.",
  "„Menetluse link” on uue teema vormil kohe avatud ja küsib ainult aadressi ning soovi korral nimetuse — menetluse allikat ei pea enam ise valima.",
  "„Arvamuse tähtaeg” on nüüd ainus kuupäev, mida uue teema loomisel küsitakse, ja see tekitab teemale ka esimese tegevuse „Koostan arvamuse”; tühjaks jäetud lahter ei tekita endiselt midagi.",
  "„Järgmiseks” lahtrit koos kiirvalikutega uue teema vormil enam ei ole — järgmise tegevuse saab kirja panna teema lehel nagu varemgi.",
  "Koja arvamust lisades on adressaadiks juba pakutud teema saatja: asutusi otsitakse ühelt realt, neid saab juurde võtta, ära võtta ja vahetada, ning teema enda saatja sellest ei muutu.",
