  "Kui valdkondi, saatjat või lühikokkuvõtet on vahepeal teises aknas muudetud, ei kirjuta salvestus kolleegi muudatust enam vaikselt üle: väljal on näha salvestatud väärtus, mille saab üle vaadata ja uuesti salvestada.",
