  "Etapi paneb inimene märke juurde ja see on ette pakutud teema praeguse hetkeseisu järgi; rakendus ei tuleta etappi tekstist, failinimest ega kuupäevast. Ülejäänud kirjed leiavad koha kahe märke vahele jääva aja järgi ja varem sisestatud kirjed jäävad täpselt nii, nagu need on.",
  "Kirjed, mille etappi ei saa kindlalt öelda, on koos pealkirja «Etapiga sidumata» all — need on täiesti tavalised kirjed, mitte vead. Kui lisad märke sammust, mis teema edasi liigutas, leiavad need ise oma etapi.",
