# Üks väljalase, neli ühendust: juristide teise tagasisidevooru neli paketti
# korraga.
#
# Seitse punkti, mitte neli. Ühendusi on neli, aga lugeja ei kohta neid
# ühenduste kaupa — punktid on jaotatud selle järgi, millisel tööpinnal
# muudatus näha on: uue teema vorm, kaks üle vaadatud valikuloendit, menetluse
# link ja avaldamiskuupäev, arvamuse koostamise algus koos kaasamisega,
# tagasiside allikad, teema lehelt lisamine ja teema lehe lugemisvaade.
#
# **Esimene punkt ütleb, mida vormil enam ei ole.** Menetlusliik ja adressaat
# olid mõlemad loomise hetkel küsimused, mida seal vaja ei ole: menetlusliik
# palus juristil sama faili kaks korda liigitada, ja adressaat on fakt, mis
# selgub alles siis, kui Koda vastama hakkab. Kumbki ei kadunud rakendusest —
# mõlemat saab teema andmetes edasi täita —, ja punkt ütleb selle välja, sest
# muidu loeks seda kui kaotust.
#
# **Teine punkt on kaks üle vaadatud loendit.** Hetkeseisus on kolm nimetust
# ümber sõnastatud; ükski seis ei kadunud ja ükski teema ei liikunud. Õigusakti
# loend on lühem ja iga nimetus ütleb ise, kas tegu on siseriikliku või ELiga
# seotud aktiga — see on täpselt see, mida menetlusliigi küsimus varem teist
# korda küsis. Varasemad valikud säilivad; see on sama lubadus, mille
# 17. septembri viies ja seitsmes punkt hetkeseisu ja valdkondade kohta annavad.
#
# **Kolmas punkt parandab 17. septembri kirjet.** Sel päeval lubati, et ülevaate
# või uudise lingi sisestamisel pakub vorm avaldamise kuupäevaks tänast
# kuupäeva. Nii see enam ei ole: kuupäeva ei täideta ette ja tühi lahter on nüüd
# korralik vastus, mis tähendab „kuupäev ei ole teada”. See on käitumise muutus,
# mida lugeja ise ei tellinud, nii et punkt ütleb selle otse välja — muidu ootab
# ta kuupäeva, mida vorm ei paku, ja arvab, et midagi on katki.
#
# **Neljas punkt on kaks käitumise muutust ühes lauses, sest mõlemad puudutavad
# seda, mis juhtub iseenesest.** Uue teema loomisel saab kohe kirja panna
# kuupäeva, mis ajaks arvamus koostatakse, ja sellest saab teema esimene
# järgmine tegevus. Kaasamise lisamine seevastu ei pane enam ise tagasisidet
# ootama — ootus on eraldi, nimeline tegu. Sellega ei ole vastuolus
# 17. septembri esimene punkt: seal sai kaasamisele tähtaja määrata ja kaasamise
# lõpetada, ja see on endiselt nii; muutunud on see, et ootus ei hakka ise peale.
#
# **Viies punkt ei korda 16. ega 17. septembri välise seisukoha punkte.** Seal
# oli seisukoha koht üldse ja see, et piisab tekstist. Siin on juurde tulnud, et
# rakendus eristab meile saadetud tagasisidet teiste arvamustest — kaks eri
# asja, mis varem ühtemoodi paistsid — ja et juristi enda märkus on allika
# sõnadest nähtavalt lahus.
#
# **Kuues punkt ütleb, kust kaks asja nüüd algavad.** Menetluse arengu juures on
# nimetatud kolm asja, mida saab sama salvestusega kaasa panna, sest just see
# teeb ühest väljast töövahendi.
#
# **Seitsmes punkt on teema lehe lugemisvaade.** Teema käik ja menetluse kulg
# vastavad kahele eri küsimusele ja on nüüd kaks eri jaotist. Tehniline
# muutmisajalugu on alles ja ühe lingi kaugusel — punkt ütleb selle, sest
# sisulisest käigust on osa kirjeid välja jäetud ja lugeja peab teadma, kuhu
# need läksid. Töövõidu koht ajaloos on muutunud: varem seisis ta seal, kus ta
# kinnitati, nüüd seal, kuhu ta päriselt kuulub. Viimane pool lauset on tahtlik:
# „kuupäev teadmata” on vastus, mida rakendus nüüd ütleb välja, selle asemel et
# panna reale päev, mida keegi ei ole öelnud.
#
# `revisions` jääb siin tühjaks: seda kirjet kirjutades ei ole väljalaset veel
# toimunud. Vale või oletatud revisjoni siia panna oleks halvem kui selle
# puudumine.
#
# **Kaheksas punkt tuli juurde sama päeva teise väljalaskega** (#239). Üks kirje
# ühe kalendripäeva kohta, nii et see ei ole uus päev, vaid rida olemasolevas
# kirjes.
#
# Punkt räägib vormiväljade selgitustest. Kolmas punkt ülalpool lubab, et
# avaldamiskuupäeva võib jätta teadmata — seda lauset ei olnud lahtri juures
# kirjas, vaid jaotise all eraldi lõiguna, ja ekraanilugejale ei jõudnud ta
# üldse. Nüüd seisab ta lahtri juures ja on välja enda selgitus. Sama
# parandust vajasid veel kuus välja; ainus, mille juures tekib päris uut teksti
# näha, on teema lühikokkuvõte, mille selgitust ei kuvatud varem kusagil.
#
# **Sama väljalaske teine pool ei saa punkti.** See on visuaaltestide
# parandus — kuvatõmmised jäädvustasid oma jooksupäeva kuupäeva ja vananesid
# öö jooksul. README ütleb, et testid ja CI punkti ei saa, ja siin ei muutu
# lugeja jaoks midagi.
#
# **Üheksas, kümnes ja üheteistkümnes punkt tulid juurde sama päeva kolmanda
# väljalaskega** (#246). Endiselt üks kirje ühe kalendripäeva kohta, nii et need
# on read olemasolevas kirjes, mitte uus päev.
#
# Kõik kolm parandavad vigu, mille leidis sama päeva öine läbivaatus, ja kõik
# kolm puudutavad punkte, mis on ülalpool juba lubatud — seepärast on nad siin
# eraldi read ja mitte parandused nendesse punktidesse. Lugeja, kes eile lehte
# luges, on ülemised laused juba näinud; ta peab teada saama, mis nendest
# päriselt ei töötanud.
#
# **Üheksas punkt on tõendite kadu, ja see on neist kolmest kõige tõsisem.**
# Kaasamise lõpetamisel sai faili juurde panna, salvestamine õnnestus ja fail
# kadus jäljetult — ei veateadet, ei hoiatust, ei rida dokumentides. Punkt
# ütleb otse, et failid *säilivad nüüd*, sest lugeja, kes on sel viisil ühe
# vastuskirja kaotanud, peab aru saama, et see oli viga ja et seda enam ei
# juhtu. Ülalpool kuues punkt lubab menetluse arengu juures faile; kaasamise
# lõpetamine on eraldi koht ja seal see lubadus ei pidanud.
#
# **Kümnes punkt ei korda viiendat punkti.** Viies ütleb, et juristi märkus on
# allika sõnadest nähtavalt eraldi — see käis välise seisukoha kohta ja see
# vastab tõele. Menetluse arengu juures küsiti sama märkust, salvestati see ära
# ja ei näidatud seda mitte kusagil. Punkt nimetab seepärast menetluse arengu
# eraldi välja, muidu loeks lugeja seda kordusena ega saaks aru, et miski oli
# katki.
#
# **Üheteistkümnes punkt on ainus, mis midagi ära võtab, ja seepärast ütleb ta
# välja ka põhjuse.** Menetluse arenguna sai varem kirja panna tulevikus toimuva
# sammu; rakendus võttis selle vastu, kuid ei näidanud seda teema käigus, ja
# samal salvestusel valitud hetkeseis jõustus sellest hoolimata kohe. Nii seisis
# failil hetkeseis, milleni menetlus ei olnud jõudnud, ja lause, mis seda
# selgitanuks, ei olnud kusagil näha. Nüüd keeldub rakendus tervest
# salvestusest. Punkt nimetab ka koha, kuhu plaan käib — „Järgmiseks” ja
# „Oluline tähtaeg” —, sest muidu jääks lugejale mulje, et tulevikukuupäeva ei
# saa kuhugi kirja panna. Varem sisestatud kirjeid ei muudetud ega kustutatud.
#
# **Kaheteistkümnes kuni kuueteistkümnes punkt tulid juurde sama päeva neljanda
# väljalaskega** (#241, #242, #243, #244, #245). Ikka üks kirje ühe
# kalendripäeva kohta, nii et need on read olemasolevas kirjes, mitte uus päev.
#
# Viis parandust samast öisest läbivaatusest, mis andis üheksanda kuni
# üheteistkümnenda punkti. Need viis olid vähem tõsised ja läksid seepärast
# eraldi ringiga; tööpind on igal neist erinev, nii et nad on viis rida ja mitte
# üks.
#
# **Kaheteistkümnes punkt on veateade, mida ei oleks tohtinud olla.** Uue teema
# vormil on menetluslink vabatahtlik, aga kui salvestus keelduti mõnel muul
# põhjusel — näiteks puuduva pealkirja pärast —, kurtis vorm ka lingi puudumise
# üle, mida keegi täitma ei pidanudki. Punkt ütleb selle välja, sest lugeja, kes
# nägi kahte viga ja parandas ühe, ei saanud aru, miks teine ei kadunud.
#
# **Kolmeteistkümnes punkt ei korda neljandat.** Neljas räägib sellest, mis
# kaasamise lisamisel juhtub; siin on juurde tulnud see, et juba salvestatud
# vastuste arvu saab parandada — ja tühjaks jätta, mis tähendab «keegi ei
# lugenud» ja on midagi muud kui null vastust.
#
# **Neljateistkümnes punkt on kolmanda paranduse teine pool.** Teema loomise
# järel Tagasi-nupuga vormile naastes jäi sarnaste teemade hoiatus tühjaks ja
# lehekülg väitis, et midagi sarnast ei ole — sealhulgas teema kohta, mis oli
# just loodud. Punkt nimetab olukorra ära, sest just seal oleks keegi võinud
# sama teema teist korda luua.
#
# **Viieteistkümnes ja kuueteistkümnes punkt on kaks eraldi ebamugavust ühel ja
# samal teemal — asjad on väikesed.** Pikk katkestusteta tekst, näiteks
# kopeeritud link, venitas märkme mobiilis ekraanist laiemaks, nii et lehte sai
# külgsuunas kerida. Ja kuupäevavälja kalendrinupp koos kuu vahetamise nuppudega
# oli nii väike, et sellesse oli raske tabada. Kummalgi ei muutu see, mida
# rakendus teeb — muutub see, kas sellega saab mugavalt töötada.
prs = [233, 235, 236, 237, 239, 241, 242, 243, 244, 245, 246]
