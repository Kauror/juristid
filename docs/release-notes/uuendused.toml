# Täielik läbimängitud QA-ring kogu teema töövoos, pluss omaniku neli
# tähelepanekut. Kakskümmend neli leidu, neist kolm rasket.
#
# **Esimene punkt on kaks rasket leidu korraga**, ja mõlemad on sama asi: kaks
# akent, üks fail, vaikiv ülekirjutus. Punkt ütleb, mis nüüd juhtub — töö jääb
# ekraanile ja kirje jääb alles — sest lugeja jaoks on see lubadus, mitte
# tehniline mehhanism. Sõna «optimistlik lukustus» siin ei ole ega tule.
#
# **Teine punkt on kolmas raske leid.** Otsing ei leidnud seda, mida jurist ise
# oli kirjutanud — mitte «leidis valesti», vaid ei leidnud üldse.
#
# **Neljandast kaheksandani on menetluse kulg.** Kaheksa eraldi leidu osutusid
# üheks: rida vastas korraga kahele küsimusele — kuhu fail läheb ja mis on
# juhtunud — ja teine küsimus on «Teema käigu» oma. Neljas punkt ütleb, et
# «Alustatud» kadus, ja ütleb kohe ka selle, mis *ei* kadunud: «Saabus» on
# endiselt päises. Ilma selleta loeks see kuupäeva kaotusena (omaniku kolmas
# tähelepanek).
#
# **Kümnes punkt on omaniku esimene tähelepanek** ja kogu ringi kõige otsesem
# kasutajavõit: paneel ei nõua enam nime, mida juristil ei ole. Punkt ütleb ka,
# mis ei muutu — avaldatud arvamus vajab endiselt autorit —, sest muidu loeks
# see lubadusena, et failile võib panna nimetuid väiteid.
#
# **Üheteistkümnes ja kaheteistkümnes on omaniku teine tähelepanek ja üks
# leid, mis selle kõrvalt välja tuli**: «Liige» oli vormil olemas, aga avanes
# tühjana, nii et kokkuvõtte parandaja võttis märke maha ilma seda puutumata.
#
# **Seitsmeteistkümnes punkt on omaniku neljas tähelepanek** ja ainus selle
# ringi punkt, mis lisab päriselt uue tegevuse. Punkt ütleb selgelt, mida
# kustutamine *ei* tee: kirje kaob teema käigust, mitte muudatuste logist.
# Ilma selleta loeks see lubadusena, et jälg kaob, ja see ei ole tõsi ega
# hakka olema.
#
# **Kaheksateistkümnes punkt nimetab Koja arvamust eraldi**, sest see oli ainus
# rida teema käigus, mida ei saanud üldse parandada — ja just seal loeb vale
# kuupäev või vale saaja kõige rohkem. Punkt ütleb ka, mida see ei puuduta:
# saadetud fail ise jääb muutmata, sest tõend on muutumatu.
#
# Ükski punkt ei luba, et rakendus midagi teksti, lingi või failinime järgi
# arvab. Kuupäeva hoiatus on kirjutamise hetkel antud vihje, mitte keeld.
#
# **Sama päeva teine väljalase lisab neli viimast punkti**, ja need on üks
# ring: teema käik loeb ühe nimekirjana, märke saab salvestada sellega, mis
# päriselt teada on, ja järgmine tegevus ei nõua enam väljamõeldud kuupäeva.
# Üks kirje päeva kohta, nii et need on siin eelmiste kõrval, mitte omaette.
#
# **Esimene neist on «Etapiga sidumata» kadumine**, ja punkt ütleb ka selle,
# mis *ei* kadunud: etapid on endiselt näha, menetluse kulus. Ilma selleta
# loeks see etappide kaotusena.
#
# **Kolmas punkt on selle ringi kõige otsesem kasutajavõit.** Jurist teab
# sageli, mida ta teeb, enne kui ta teab, millal — ja siiani pidi ta kuupäeva
# välja mõtlema. Punkt ütleb ka, kus selline tegevus paistab ja kus mitte,
# sest muidu jääks mulje, et kuupäevata töö kaob silmist.
prs = [274, 275, 276]
changes = [
  "Kui teema andmeid või menetluse kulgu on vahepeal teises aknas muudetud, siis salvestus ei kirjuta seda enam vaikselt üle: salvestamine peatub, sisestatu jääb ekraanile ja kõrvale tuleb näha, mis vahepeal muutus.",
  "Otsing leiab nüüd ka selle, mis on kirjutatud märkmesse ning arvamusse ja tagasisidesse — nii teksti kui ka organisatsiooni nime järgi. Varem leidis otsing ainult teema enda välju.",
  "«Oluline tähtaeg» on nüüd näha sellel teemal, kuhu see lisati: teema käigus, ja kui tähtaeg on alles ees, siis märkega «Eesolev tähtaeg».",
  "Menetluse kulg näitab nüüd ainult seda, kuhu menetlus läheb, ja seda, mis on teemale kuupäevana kirja pandud. Rakenduse enda tekitatud «Alustatud» on ära võetud — see oli päev, mil teema sai süsteemi kirja, mitte päev, mil menetlus algas. «Saabus» on endiselt teema päises.",
  "Etapi kuupäev tuleb nüüd sellest, mis on menetluse kulusse kirja pandud, mitte esimesest sinna alla sattunud märkest; korduva kooskõlastusringi ajalugu on teema käigus, kus iga kord on omaette.",
  "Jõustumine on menetluse kulus nüüd üks veerg, mille all seisavad kõik kirja pandud jõustumised nähtava tekstina; varem joonistati iga jõustumine eraldi veeruna sama nimega.",
  "Menetluse kulu muutmisel ei saa enam ära võtta praegust etappi ega etappi, mille juures on kirja pandud kuupäev; põhjus on nende juures kirjas ja iga muu etapi saab endiselt ära võtta.",
  "Kui menetluse kulusse kirjutatud kuupäevad on menetluse järjekorra suhtes vastuolus, ütleb vorm seda kohe ja jätab sisestatu alles.",
  "Suletud või «Koda ei tegele edasi» teemal ei loe päis enam tähtaja päevi alla; kuupäev ise jääb kirja.",
  "«Meile saadetud tagasiside» ei nõua enam organisatsiooni valimist: kui jurist kirjutab üles, mida liige telefonis ütles, saab selle salvestada nimeta. «Teiste arvamus» vajab endiselt autorit.",
  "Kui tagasiside juures on märgitud «Liige», siis see nüüd ka paistab teema käigus ja seda saab «Muuda» alt maha võtta.",
  "«Muuda» avab tagasiside sellisena, nagu see kirjas on — «Liige», allikas ja juristi märkus tulevad kaasa. Varem tulid need tühjalt ja läksid kokkuvõtte parandamisega kaotsi.",
  "Menetluse link avaneb nüüd täpselt sellel aadressil, mis on kirja pandud, ja selle muutmise nupp on lingi enda kõrval ning ütleb «Muuda».",
  "Muudatuste logi ja teema kustutamise leht räägivad nüüd «märgetest», nagu teema leht ise, ja kustutamise juures «Loobu» viib tagasi teema lehele, mitte muutmise vormi.",
  "Pärast salvestamist jääb klaviatuur nüüd kohta, kust saab edasi töötada, mitte lehe algusesse; vigase välja puhul läheb fookus endiselt sellele väljale.",
  "Kui jurist loob teema ja määrab selle endale, siis «Uus asi» teadet enam ei tule; teiselt saadud teema puhul tuleb nagu enne.",
  "Teema käigus saab nüüd enda tehtud kirje — märke, kaasamise, arvamuse, ülevaate, olulise tähtaja, jõustumise või töövõidu — ära võtta «Kustuta» nupuga «Muuda» kõrval. Kirje kaob teema käigust, otsingust ja menetluse kulust, aga jääb muudatuste logisse koos sellega, kes selle ära võttis, ja lisatud failid jäävad alles.",
  "Koja arvamuse rida teema käigus on nüüd parandatav: saatmise kuupäeva, kokkuvõtet, liiki ja adressaate saab «Muuda» alt korda teha. Saadetud fail ise jääb muutmata.",
  "Arvamusele ja tagasisidele saab nüüd lisada faili ka hiljem, «Lisa fail» nupuga selle rea juures; varem sai faili panna ainult kirje lisamise hetkel.",
  "Kui teemade otsing ei anna praeguse olekufiltriga tulemusi, aga mõnes teises olekus on vasteid, siis leht ütleb seda ja pakub lingi; filtrit ise ta ei muuda.",
  "Ebatavaliselt vana kuupäeva sisestamisel ütleb väli seda kohe — salvestamist see ei takista, sest vanad kirjed on päris kirjed.",
  "Kui teemal on kaks ühenimelist faili, siis nende juures on nüüd ka üleslaadimise kellaaeg ja faili suurus, et neid saaks eristada.",
  "«Praegune tegevus» salvestusnupp ütleb nüüd «Salvesta tegevus», et see ei oleks segi aetav kõrvalolevatega.",
  "Teema käik on nüüd üks nimekiri: kõik kirjed ajalises järjekorras, ilma etappide vahepealkirjadeta ja ilma «Etapiga sidumata» plokita. Etapid on endiselt näha menetluse kulus, kus on ka nende kuupäevad.",
  "Teema käigu read on lühemad: pealkiri, kuupäev ja «Muuda» on nüüd ühel real, ja «Ülevaade / uudis» rea juures on kirjas aadress ise, mitte «Ava ülevaade või uudis».",
  "Järgmine tegevus ei nõua enam kuupäeva. Kui on teada, mida teha, aga mitte millal, siis saab selle nii kirja panna — tegevus on «Praeguse tegevuse» all ja «Minu asjades» kuupäevata tööde all, tähtaegade ja hilinemiste hulka see ei lähe. Kuupäeva saab hiljem lisada või ära võtta.",
  "«Märke» saab salvestada sellega, mis teada on: ainult kommentaar, ainult fail, ainult uus hetkeseis või ainult järgmine tegevus — või neist mitu korraga. Tühja märget salvestada ei saa.",
]

