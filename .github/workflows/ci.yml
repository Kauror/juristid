name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  quality:
    name: Format, lint, types and system checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # What this run is testing, named by the tree it checked out.
      #
      # For a pull request that is GitHub's test merge of the branch into main,
      # not the branch head — the tree the merge button will produce when the
      # branch is up to date, which branch protection requires. The release
      # gate (`scripts/ci/assert_release_provenance.py`) accepts a pull
      # request's green run as the proof for the merge commit only when this
      # recorded tree is byte-for-byte the merge commit's own; without the
      # artifact it accepts nothing but main's own run, as it always did.
      - name: Record the tree this run tests
        run: |
          set -euo pipefail
          mkdir -p tested
          {
            echo "tree $(git rev-parse 'HEAD^{tree}')"
            echo "commit $(git rev-parse HEAD)"
            echo "event $GITHUB_EVENT_NAME"
          } > tested/tested-tree.txt
          cat tested/tested-tree.txt

      - name: Upload the tested tree
        uses: actions/upload-artifact@v4
        with:
          name: tested-tree
          path: tested/tested-tree.txt
          if-no-files-found: error
          retention-days: 30

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # Every install in this workflow, the pip-audit export and both image
      # installs use `--frozen`, which trusts `uv.lock` without comparing it
      # with `pyproject.toml`. So a raised floor (`pyjwt>=2.14`) or a removed
      # dependency edited into pyproject alone was silently ignored: CI tested,
      # the image shipped and pip-audit audited the old set (ENG-053). This is
      # the comparison `--frozen` switches off, run once, failing rather than
      # re-locking. `UV_FROZEN` is unset for it because uv refuses `--check`
      # alongside frozen mode.
      - name: The lockfile agrees with pyproject.toml
        run: env -u UV_FROZEN uv lock --check

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Static types
        run: uv run mypy

      # The era contracts are data the parser trusts, and the Markdown overview
      # is generated from them. Editing a contract without regenerating the
      # overview must fail here rather than leave a reviewer reading the wrong
      # description of the parser's rules. Needs no database.
      - name: Workbook era contracts are valid and their overview is current
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost
        run: uv run python manage.py check_era_contracts --check

      - name: Django system checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost
        run: uv run python manage.py check

      - name: Django deployment checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost
          DJANGO_SECURE_SSL_REDIRECT: "1"
        run: uv run python manage.py check --deploy

      # The deployment and recovery scripts are the tooling an operator reaches
      # for on the worst day of the system's life, and shell is where an unquoted
      # path or an unset variable turns into a command that runs against the
      # wrong thing. `ruff` never sees them; this does. Pre-installed on the
      # runner, so it costs nothing.
      #
      # `--severity=warning` rather than the default: the style and info levels
      # include advice about sourced files a static checker cannot resolve, and
      # a gate that fails on that gets switched off within a month. Warnings and
      # errors are the levels that catch the failures worth catching here.
      - name: Shell scripts
        run: >-
          shellcheck --severity=warning --external-sources --source-path=SCRIPTDIR
          scripts/*.sh scripts/deploy/*.sh

      # The proof that the sharded jobs below still run the whole suite. It
      # collects every shard of every sharded suite and compares node ids
      # against the unsharded collection, so a partition that started dropping
      # tests is a red build here rather than a fast green one over there.
      #
      # Collection only — no database, no browser — which is why it belongs in
      # the job that finishes in half a minute rather than in the jobs it is
      # about. See docs/ci-architecture.md.
      - name: Every test still runs in exactly one shard
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_GATE_BASE_URL: http://127.0.0.1:8001
        run: uv run python scripts/ci/assert_shard_completeness.py

      # The gauge beside that proof, and the reason nobody has to notice drift
      # by hand. `ci/shard-timings.json` decays quietly — no test stops running,
      # nothing goes red, the shards just drift apart until one runner carries
      # the suite. This prints the numbers every build and says
      # `CI SHARD TIMINGS NEED REFRESH` when they cross thresholds taken from
      # the 2026-08-30 table's own decay.
      #
      # `continue-on-error` as well as an exit code of 0, because a report is
      # not a gate: hosted runners have slow days, and a build that went red
      # over a three-week-old table would teach people to ignore the words.
      - name: Shard timings are still current
        continue-on-error: true
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_GATE_BASE_URL: http://127.0.0.1:8001
        run: uv run python scripts/ci/report_shard_health.py

  postgres-safety:
    name: PostgreSQL migration and runtime safety
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Everything the PostgreSQL suite proved *before* running a test, kept
    # exactly as it was and moved to a job of its own.
    #
    # It moved because it is not per-shard work. Migrating from zero, stepping a
    # deployment's state backwards and forwards, and asserting that the OCR
    # engine is really installed are claims about the repository, not about a
    # subset of it — running them again in each of the 7 shards would
    # multiply a minute of setup by 7 and prove nothing further. Nothing here
    # was removed, weakened or reordered; the steps are the ones that stood in
    # the `tests` job, with their reasoning intact.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: juristid
          POSTGRES_USER: juristid
          POSTGRES_PASSWORD: juristid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U juristid -d juristid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DEV_LOGIN_ENABLED: "0"
      REAL_DATA_ALLOWED: "0"
      POSTGRES_DB: juristid
      POSTGRES_USER: juristid
      POSTGRES_PASSWORD: juristid
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # The OCR runtime, from packages cached per runner image.
      #
      # `apt-get update` against Ubuntu's mirrors is what made this step cost
      # 18s on a good day and up to four minutes on a bad one — and a slow
      # mirror on one shard is the whole round waiting for it. The .deb files
      # are kept under a key naming the runner image, so a new image (whose
      # installed libraries the cached packages were resolved against) starts
      # a fresh cache rather than installing stale ones over it. Anything that
      # goes wrong on the cached path falls back to the plain apt install this
      # step always was, and the languages are checked either way.
      - name: Runner image identity
        id: runner-image
        run: echo "key=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the OCR packages
        uses: actions/cache@v4
        with:
          path: ~/ocr-debs
          key: ocr-debs-${{ steps.runner-image.outputs.key }}-v1

      - name: Install the OCR runtime
        run: |
          set -euo pipefail
          packages="tesseract-ocr tesseract-ocr-est tesseract-ocr-eng"
          cache="$HOME/ocr-debs"
          if compgen -G "$cache/*.deb" > /dev/null && sudo dpkg -i "$cache"/*.deb > /dev/null; then
            echo "installed from the cached packages"
          else
            echo "no usable cache; installing from the mirror"
            rm -rf "$cache" && mkdir -p "$cache/partial"
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes --download-only -o Dir::Cache::archives="$cache" $packages
            sudo dpkg -i "$cache"/*.deb > /dev/null || sudo apt-get install --no-install-recommends --yes $packages
            sudo rm -rf "$cache/partial" "$cache/lock"
            sudo chown -R "$(id -u):$(id -g)" "$cache"
          fi
          langs="$(tesseract --list-langs 2>&1)"
          for lang in est eng; do
            grep -qx "$lang" <<<"$langs" || { echo "tesseract has no '$lang'"; echo "$langs"; exit 1; }
          done

      - name: Migrations are complete
        run: uv run python manage.py makemigrations --check --dry-run

      - name: A fresh database migrates from zero
        run: uv run python manage.py migrate --noinput

      # Rows, before anything steps backwards. The step-back below used to run
      # on an empty schema, so every RunPython migration it reversed and
      # re-applied did so over no data, and a data migration whose reverse or
      # forward breaks on real rows passed CI (ENG-052). The seed runs at the
      # leaf — it uses today's models and services, so it cannot run against an
      # older schema — and the step-back then carries those rows backwards and
      # forwards through every migration in its range.
      - name: A populated database to step back from
        run: uv run python manage.py seed_e2e_data

      # From zero is the easy direction. A deployment migrates from wherever it
      # already is, and the migrations that carry a release are the ones nobody
      # has run against a populated database yet — so the state a deployment
      # actually starts from is named here and stepped forward.
      #
      # `migrate <app> <number>` backwards, then forwards, which exercises the
      # reverse each data migration claims to have as well as the forward path —
      # on the seeded rows above, so the RunPython code runs over data rather
      # than an empty table. A data migration whose reverse was never run is a
      # rollback plan nobody has tested. A RunPython migration this range does
      # not reach must name its own populated test
      # (tests/test_migration_data_proof.py), or the build is red.
      #
      # The targets are the last migration in each app on `main` that a release
      # steps past. When a release adds another, move them: leaving them behind
      # quietly narrows this to a range that is no longer the one being
      # deployed.
      #
      # That instruction was followed by prose alone and was missed once —
      # SEARCH-001 added `search/0007` and left this list at the range DATA-001
      # had set, so the migration carrying the release was never reversed here.
      # `tests/test_deployment_state.py` now holds the list to the repository's
      # own migrations, so forgetting is a red build rather than a quiet gap.
      - name: And forwards again from the state a deployment is in
        run: |
          uv run python manage.py migrate taxonomy 0003 --noinput
          uv run python manage.py migrate workflow 0005 --noinput
          uv run python manage.py migrate submissions 0004 --noinput
          uv run python manage.py migrate search 0006 --noinput
          uv run python manage.py migrate legacy_import 0012 --noinput
          uv run python manage.py migrate intelligence 0001 --noinput
          uv run python manage.py migrate documents 0006 --noinput
          uv run python manage.py migrate matters 0011 --noinput
          uv run python manage.py migrate audit 0015 --noinput
          uv run python manage.py migrate reporting 0001 --noinput
          uv run python manage.py migrate organisations 0001 --noinput
          uv run python manage.py migrate --noinput

      - name: Estonian search capabilities are available
        run: uv run python manage.py check_search_capabilities

      # Asserted rather than assumed. The OCR tests skip themselves when the
      # engine is absent, which is right for a laptop and wrong for CI: a
      # silently skipped OCR suite looks identical to a passing one, and the
      # runtime it was meant to prove is the one that ships (Stage-2B brief 89).
      - name: The OCR runtime CI claims to have is actually present
        run: uv run python manage.py check_ocr_runtime --required

      # The property being proved is that this job's result does not depend on
      # which DJANGO_SETTINGS_MODULE the surrounding environment happened to
      # export. `pyproject.toml` passes `--ds=config.test_settings`, which is
      # the one form pytest-django resolves *ahead* of the environment variable
      # — and the production image bakes that variable in as `config.settings`,
      # which is how a pytest run on the server wrote 63 test files into the
      # real evidence store on 2026-08-24.
      #
      # Two node ids rather than the module, so this step stays free of both the
      # database and the subprocess tests; the module itself runs in full in
      # whichever shard the partition put it in.
      - name: An inherited production settings module does not decide the suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings
        run: >-
          uv run pytest -q
          "tests/test_test_isolation.py::test_the_settings_in_force_are_the_test_settings"
          "tests/test_test_isolation.py::test_the_writable_roots_are_not_a_deployments"

      # And the other accepted outcome: an environment that says it may hold the
      # Chamber's real material stops the suite before collection rather than
      # relying on a fixture to redirect storage later. Asserted as a *failure*,
      # because a guard that silently stopped refusing would otherwise look
      # exactly like a passing job.
      - name: A real-data environment stops the suite instead of running it
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          REAL_DATA_ALLOWED: "1"
        run: |
          if uv run pytest -q "tests/test_test_isolation.py::test_the_settings_in_force_are_the_test_settings" > isolation.log 2>&1; then
            echo "the suite ran in an environment marked as holding real data"; cat isolation.log; exit 1
          fi
          grep -q "JURISTID TEST SAFETY" isolation.log || { echo "it failed, but not for the safety reason"; cat isolation.log; exit 1; }
          rm -f isolation.log

  tests:
    name: "PostgreSQL tests, shard ${{ matrix.shard }} of 7"
    runs-on: ubuntu-latest
    # Was 25 for the whole serial suite. A shard is roughly a 7th of it, and
    # the same reasoning applies at the smaller size: generous slack so that a
    # slow runner is never mistaken for a broken branch, and a number that gets
    # noticed if the suite ever grows into it.
    timeout-minutes: 15

    strategy:
      # Every shard runs. Stopping the others when one fails would hide which
      # part of the suite is red and turn one investigation into several
      # re-runs.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    # A whole PostgreSQL of its own per shard, which is the point of sharding
    # here rather than reaching for `pytest -n`. Each runner gets its own
    # database server, its own filesystem, its own process environment and its
    # own port space, so the isolation the suite already relies on is not
    # weakened by running it in 7 places at once — and the assignment is a
    # pure function of the collected files rather than of which worker happened
    # to be free (ci_sharding.py, docs/ci-architecture.md).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: juristid
          POSTGRES_USER: juristid
          POSTGRES_PASSWORD: juristid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U juristid -d juristid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      DJANGO_DEBUG: "0"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DEV_LOGIN_ENABLED: "0"
      REAL_DATA_ALLOWED: "0"
      POSTGRES_DB: juristid
      POSTGRES_USER: juristid
      POSTGRES_PASSWORD: juristid
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # The OCR runtime, from packages cached per runner image.
      #
      # `apt-get update` against Ubuntu's mirrors is what made this step cost
      # 18s on a good day and up to four minutes on a bad one — and a slow
      # mirror on one shard is the whole round waiting for it. The .deb files
      # are kept under a key naming the runner image, so a new image (whose
      # installed libraries the cached packages were resolved against) starts
      # a fresh cache rather than installing stale ones over it. Anything that
      # goes wrong on the cached path falls back to the plain apt install this
      # step always was, and the languages are checked either way.
      - name: Runner image identity
        id: runner-image
        run: echo "key=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Cache the OCR packages
        uses: actions/cache@v4
        with:
          path: ~/ocr-debs
          key: ocr-debs-${{ steps.runner-image.outputs.key }}-v1

      - name: Install the OCR runtime
        run: |
          set -euo pipefail
          packages="tesseract-ocr tesseract-ocr-est tesseract-ocr-eng"
          cache="$HOME/ocr-debs"
          if compgen -G "$cache/*.deb" > /dev/null && sudo dpkg -i "$cache"/*.deb > /dev/null; then
            echo "installed from the cached packages"
          else
            echo "no usable cache; installing from the mirror"
            rm -rf "$cache" && mkdir -p "$cache/partial"
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes --download-only -o Dir::Cache::archives="$cache" $packages
            sudo dpkg -i "$cache"/*.deb > /dev/null || sudo apt-get install --no-install-recommends --yes $packages
            sudo rm -rf "$cache/partial" "$cache/lock"
            sudo chown -R "$(id -u):$(id -g)" "$cache"
          fi
          langs="$(tesseract --list-langs 2>&1)"
          for lang in est eng; do
            grep -qx "$lang" <<<"$langs" || { echo "tesseract has no '$lang'"; echo "$langs"; exit 1; }
          done

      # The suite, partitioned. `--shard-count` and the matrix above are held to
      # each other by tests/test_ci_sharding.py, and the union is proved to be
      # the whole suite by the quality job.
      #
      # Coverage is measured per shard and combined by the gate below, so the
      # instrumentation cost is divided by the shard count along with everything else and
      # the report still describes the whole suite. `--cov-report=` here on
      # purpose: a partial report printed once per shard reads as a coverage
      # collapse.
      - name: Test suite
        env:
          COVERAGE_FILE: .coverage.shard-${{ matrix.shard }}
        # The default tracer, deliberately. `COVERAGE_CORE=sysmon` was measured
        # and rejected: it is nearly free where this is not, but it reported 39%
        # against the same subset the default core reported 40% on, and a
        # cheaper number that means something slightly different is not the same
        # number (docs/ci-architecture.md).
        run: >-
          uv run pytest
          --shard-count=7 --shard-index=${{ matrix.shard }}
          --cov --cov-report=
          --junitxml=artifacts/junit-tests-${{ matrix.shard }}.xml

      # Two things the gate needs and one thing a person needs: the coverage
      # fragment, the durations that keep ci/shard-timings.json refreshable, and
      # a report to read when a shard is red.
      - name: Upload this shard's report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-tests-${{ matrix.shard }}
          path: |
            artifacts/junit-tests-${{ matrix.shard }}.xml
            .coverage.shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  tests-gate:
    # The logical gate, under the name it has always had, so that a required
    # status check and anything referring to this suite keeps meaning what it
    # meant. The shards are what changed; the promise is not.
    name: PostgreSQL 18 test suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [postgres-safety, tests]
    # `always()`, because a gate that only runs when its dependencies succeeded
    # is a gate that is *skipped* when they do not — and a skipped required
    # check does not block anything. It has to run and then refuse.
    if: always()

    steps:
      - name: Every part of the suite succeeded
        env:
          SAFETY: ${{ needs.postgres-safety.result }}
          SHARDS: ${{ needs.tests.result }}
        run: |
          set -euo pipefail
          echo "migration and runtime safety: $SAFETY"
          echo "test shards: $SHARDS"
          # Anything other than success, including `cancelled` and `skipped`.
          # A cancelled shard proved nothing, and a green gate over one would be
          # worse than no gate at all.
          for result in "$SAFETY" "$SHARDS"; do
            if [ "$result" != "success" ]; then
              echo "the PostgreSQL suite did not pass: a dependency reported '$result'"
              exit 1
            fi
          done
          echo "all 7 shards and the safety checks passed"

      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: Collect the coverage fragments
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-tests-*
          path: fragments

      # One report for the whole suite, as before the split. Combining rather
      # than reporting per shard is what keeps this comparable to the number CI
      # printed when the suite ran in one process.
      - name: Coverage across the whole suite
        run: |
          find fragments -name '.coverage.shard-*' -exec cp {} . \;
          uv run coverage combine
          uv run coverage report --show-missing

      - name: Upload the combined coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-combined
          path: .coverage
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  dependency-scan:
    name: Dependency vulnerability baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Export the locked runtime dependency set
        run: >-
          uv export --frozen --no-dev --no-emit-project --no-hashes
          --format requirements-txt -o requirements.txt

      - name: Audit
        run: uvx pip-audit --strict --no-deps --requirement requirements.txt

  browser:
    name: "Browser, shard ${{ matrix.shard }} of 7"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: juristid
          POSTGRES_USER: juristid
          POSTGRES_PASSWORD: juristid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U juristid -d juristid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The browser suite runs against a real server on real PostgreSQL. It is
      # the authoritative check that the workflow works for a person, because
      # the development machine cannot open a browser.
      DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_STATIC_MANIFEST: "0"
      DEV_LOGIN_ENABLED: "1"
      REAL_DATA_ALLOWED: "0"
      APPLICATION_ENVIRONMENT: ci
      POSTGRES_DB: juristid
      POSTGRES_USER: juristid
      POSTGRES_PASSWORD: juristid
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      EVIDENCE_ROOT: /tmp/juristid-evidence
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_SCREENSHOT_DIR: artifacts/screenshots
      # A second server, same database, running the shared gate. The persona
      # switcher exists only in that mode — the routes 404 in the other two —
      # and converting the whole browser suite to type a password before every
      # unrelated test would have been the alternative. One extra `runserver`
      # is cheaper and leaves the rest of the suite exactly as it was
      # (docs/adr/0034).
      E2E_GATE_BASE_URL: http://127.0.0.1:8001
      # A rehearsal password for a throwaway server on localhost, under a
      # test-only name. The deployment variable it stands in for is deliberately
      # absent from every tracked YAML file in this repository — a committed
      # shared password does not look wrong in a diff, it looks like a default
      # (tests/test_repository_data_safety.py, config/e2e_gate_settings.py).
      E2E_GATE_PASSWORD: ci-jagatud-parool-mitte-kusagil-mujal
      # Set to "1" on a manual run to (re)generate the visual baselines. The
      # renderings land in the browser-artifacts upload; commit what you agree
      # with. Baselines have to come from this image, because font
      # rasterisation differs on every other machine.
      E2E_UPDATE_BASELINES: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # `--with-deps` shells out to apt, which is the part that hangs on this
      # runner — twice now, once for a full hour before the job had a timeout.
      # The runner image already carries the libraries Chromium needs, so the
      # browser binary is all that has to be fetched, and it is cached between
      # runs.
      - name: Cache the browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('uv.lock') }}
          restore-keys: playwright-chromium-

      - name: Install the browser
        timeout-minutes: 6
        run: uv run playwright install chromium

      - name: Migrate and seed the deterministic world
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_e2e_data

      - name: Start the application
        run: |
          mkdir -p artifacts
          nohup uv run python manage.py runserver 127.0.0.1:8000 --noreload > artifacts/server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; exit 1

      # The same code and the same data, behind the department password. It is
      # a separate process rather than a setting flipped mid-run because
      # `AUTH_MODE` is read per request from settings: one process cannot be
      # both, and a suite that restarted the server between files would be
      # slower and harder to read than a second port.
      - name: Start the shared-gate application
        env:
          # The mode, the password and the refusal to combine a gate with the
          # synthetic sign-in all live in the settings module, not here.
          DJANGO_SETTINGS_MODULE: config.e2e_gate_settings
        run: |
          nohup uv run python manage.py runserver 127.0.0.1:8001 --noreload > artifacts/server-gate.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8001/healthz > /dev/null; then
              echo "shared-gate server is up"; exit 0
            fi
            sleep 1
          done
          echo "shared-gate server did not start"; exit 1

      # This runner's slice of the browser suite. Whole files, chosen by
      # measured cost, against this runner's own database, its own two servers
      # and its own Chromium — which is what makes 7 of these safe when
      # 7 pytest workers sharing one server would not be. The visual
      # scenarios are not here; they have a job of their own below.
      - name: Browser workflow
        run: >-
          uv run pytest e2e --ignore=e2e/test_ui_regression.py
          --shard-count=7 --shard-index=${{ matrix.shard }}
          --browser chromium
          --tracing retain-on-failure
          --output artifacts/playwright
          --junitxml=artifacts/junit-browser-${{ matrix.shard }}.xml

      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-browser-${{ matrix.shard }}
          path: |
            artifacts/screenshots
            artifacts/playwright
            artifacts/junit-browser-${{ matrix.shard }}.xml
            artifacts/server.log
            artifacts/server-gate.log
          if-no-files-found: warn
          retention-days: 14

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Its own world, which is a determinism fix before it is a speed one.
    #
    # These scenarios used to run in the same job as the behavioural suite and
    # therefore against a database fourteen minutes of browser tests had been
    # writing to: every Matter they created, every stage they moved, every
    # deadline they set was still there when the screenshots were taken. A
    # rendering that depends on what unrelated tests happened to leave behind is
    # a rendering whose baseline drifts for reasons nobody can name.
    #
    # Fresh PostgreSQL, fresh migrations, the same `seed_e2e_data`, fresh
    # servers, the same runner image, the same fonts and the same Chromium. The
    # only thing that changed is what ran before the first screenshot: nothing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: juristid
          POSTGRES_USER: juristid
          POSTGRES_PASSWORD: juristid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U juristid -d juristid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # The browser suite runs against a real server on real PostgreSQL. It is
      # the authoritative check that the workflow works for a person, because
      # the development machine cannot open a browser.
      DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DJANGO_STATIC_MANIFEST: "0"
      DEV_LOGIN_ENABLED: "1"
      REAL_DATA_ALLOWED: "0"
      APPLICATION_ENVIRONMENT: ci
      POSTGRES_DB: juristid
      POSTGRES_USER: juristid
      POSTGRES_PASSWORD: juristid
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      EVIDENCE_ROOT: /tmp/juristid-evidence
      E2E_BASE_URL: http://127.0.0.1:8000
      E2E_SCREENSHOT_DIR: artifacts/screenshots
      # A second server, same database, running the shared gate. The persona
      # switcher exists only in that mode — the routes 404 in the other two —
      # and converting the whole browser suite to type a password before every
      # unrelated test would have been the alternative. One extra `runserver`
      # is cheaper and leaves the rest of the suite exactly as it was
      # (docs/adr/0034).
      E2E_GATE_BASE_URL: http://127.0.0.1:8001
      # A rehearsal password for a throwaway server on localhost, under a
      # test-only name. The deployment variable it stands in for is deliberately
      # absent from every tracked YAML file in this repository — a committed
      # shared password does not look wrong in a diff, it looks like a default
      # (tests/test_repository_data_safety.py, config/e2e_gate_settings.py).
      E2E_GATE_PASSWORD: ci-jagatud-parool-mitte-kusagil-mujal
      # Set to "1" on a manual run to (re)generate the visual baselines. The
      # renderings land in the browser-artifacts upload; commit what you agree
      # with. Baselines have to come from this image, because font
      # rasterisation differs on every other machine.
      E2E_UPDATE_BASELINES: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      # `--with-deps` shells out to apt, which is the part that hangs on this
      # runner — twice now, once for a full hour before the job had a timeout.
      # The runner image already carries the libraries Chromium needs, so the
      # browser binary is all that has to be fetched, and it is cached between
      # runs.
      - name: Cache the browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('uv.lock') }}
          restore-keys: playwright-chromium-

      - name: Install the browser
        timeout-minutes: 6
        run: uv run playwright install chromium

      - name: Migrate and seed the deterministic world
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_e2e_data

      - name: Start the application
        run: |
          mkdir -p artifacts
          nohup uv run python manage.py runserver 127.0.0.1:8000 --noreload > artifacts/server.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8000/healthz > /dev/null; then
              echo "server is up"; exit 0
            fi
            sleep 1
          done
          echo "server did not start"; exit 1

      # The same code and the same data, behind the department password. It is
      # a separate process rather than a setting flipped mid-run because
      # `AUTH_MODE` is read per request from settings: one process cannot be
      # both, and a suite that restarted the server between files would be
      # slower and harder to read than a second port.
      - name: Start the shared-gate application
        env:
          # The mode, the password and the refusal to combine a gate with the
          # synthetic sign-in all live in the settings module, not here.
          DJANGO_SETTINGS_MODULE: config.e2e_gate_settings
        run: |
          nohup uv run python manage.py runserver 127.0.0.1:8001 --noreload > artifacts/server-gate.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:8001/healthz > /dev/null; then
              echo "shared-gate server is up"; exit 0
            fi
            sleep 1
          done
          echo "shared-gate server did not start"; exit 1

      # Kept as its own job so a visual difference reads as a visual difference
      # rather than as "the browser suite failed", and so the renderings are
      # uploaded either way.
      - name: Visual regression
        run: >-
          uv run pytest e2e/test_ui_regression.py
          --browser chromium
          --tracing retain-on-failure
          --output artifacts/playwright
          --junitxml=artifacts/junit-visual.xml

      - name: Upload renderings and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-visual
          path: |
            artifacts/screenshots
            artifacts/playwright
            artifacts/junit-visual.xml
            artifacts/server.log
            artifacts/server-gate.log
          if-no-files-found: warn
          retention-days: 14

  browser-gate:
    # The logical gate, under the name it has always had.
    name: Browser workflow (Playwright on PostgreSQL 18)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [browser, visual]
    if: always()

    steps:
      - name: Every part of the browser workflow succeeded
        env:
          SHARDS: ${{ needs.browser.result }}
          VISUAL: ${{ needs.visual.result }}
        run: |
          set -euo pipefail
          echo "browser shards: $SHARDS"
          echo "visual regression: $VISUAL"
          for result in "$SHARDS" "$VISUAL"; do
            if [ "$result" != "success" ]; then
              echo "the browser workflow did not pass: a dependency reported '$result'"
              exit 1
            fi
          done
          echo "all 7 browser shards and the visual suite passed"

  shard-balance:
    # What this run's shards were predicted to take, beside what they took
    # (ENG-139). The quality job prints the prediction alone, and a model
    # balances perfectly against itself: «slowest / median 1.00» while the same
    # run's PostgreSQL shards ranged 332-570 s. This reads the JUnit reports the
    # shards of *this* run uploaded, against the table committed at this commit.
    #
    # Informational, twice over: not a required check, and `continue-on-error`
    # with a script that exits 0 whatever it finds. Hosted runners have slow
    # days, and a red build over runner noise would teach people to ignore it.
    name: Shard balance, predicted against actual (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [tests, browser]
    if: always()
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen

      - name: This run's PostgreSQL shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-tests-*
          path: junit

      - name: This run's browser shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: test-report-browser-*
          path: junit

      - name: Predicted against actual
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          DJANGO_DEBUG: "0"
          DJANGO_ALLOWED_HOSTS: localhost
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_GATE_BASE_URL: http://127.0.0.1:8001
        run: uv run python scripts/ci/report_shard_health.py --durations junit

  recovery:
    name: Backup and restore rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The strongest claim this repository can make about its backups without
    # touching production: a set is created by the production script, verified,
    # the state it came from is destroyed, and the same production restore
    # script brings it back — after which the canonical fingerprint has to
    # match, byte digests and all.
    #
    # Synthetic data throughout. Nothing real ever enters CI.
    env:
      DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      DJANGO_DEBUG: "0"
      DJANGO_STATIC_MANIFEST: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
      DJANGO_SECURE_SSL_REDIRECT: "0"
      DEV_LOGIN_ENABLED: "0"
      REAL_DATA_ALLOWED: "0"
      APPLICATION_ENVIRONMENT: recovery-rehearsal
      POSTGRES_DB: juristid
      POSTGRES_USER: juristid
      POSTGRES_PASSWORD: rehearsal-only-not-a-secret
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_SSLMODE: disable
      COMPOSE_FILE_PATH: deploy/recovery-rehearsal/compose.yml
      PROJECT: juristid-recovery-rehearsal
      DATA_ROOT: /tmp/juristid-rehearsal/data
      BACKUP_ROOT: /tmp/juristid-rehearsal/backups
      EVIDENCE_ROOT: /tmp/juristid-rehearsal/data/evidence
      DERIVATIVE_ROOT: /tmp/juristid-rehearsal/data/derivatives
      LEGACY_SOURCE_ROOT: /tmp/juristid-rehearsal/data/legacy-source

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Provision the storage classes
        run: |
          mkdir -p "$EVIDENCE_ROOT" "$DERIVATIVE_ROOT" "$LEGACY_SOURCE_ROOT" "$BACKUP_ROOT"

      - name: Start the disposable database
        run: docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" up -d --wait

      - name: Migrate and seed a synthetic register
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py seed_e2e_data

      # Source evidence is its own storage class and its own backup question.
      # A rehearsal that only covers the database would prove half a procedure.
      - name: Synthetic page XML in the legacy-source tree
        run: |
          printf '<page id="rehearsal">synthetic</page>' > "$LEGACY_SOURCE_ROOT/rehearsal-page.xml"

      - name: Fingerprint the state that is about to be destroyed
        run: uv run python manage.py recovery_fingerprint --out /tmp/juristid-rehearsal/before.json

      - name: Back up
        run: |
          scripts/deploy/juristid-backup.sh \
            --project "$PROJECT" \
            --compose-file "$COMPOSE_FILE_PATH" \
            --data-root "$DATA_ROOT" \
            --backup-root "$BACKUP_ROOT" \
            --minimum-free-mib 64

      - name: Name the set that was produced
        run: |
          set_dir="$(find "$BACKUP_ROOT/sets" -mindepth 1 -maxdepth 1 -type d -not -name '*.partial' | sort | tail -1)"
          test -n "$set_dir" || { echo "the backup produced no set"; exit 1; }
          echo "SET_DIR=$set_dir" >> "$GITHUB_ENV"

      # -- failure injection ------------------------------------------------
      #
      # A backup script is only worth having if it fails loudly, so the failures
      # are exercised rather than assumed. Each of these must exit non-zero, and
      # none of them may leave behind something a reader would mistake for a
      # complete backup.

      - name: A missing evidence mount is refused, not recorded as an empty backup
        run: |
          empty=/tmp/juristid-rehearsal/empty-mount
          mkdir -p "$empty/evidence" "$empty/legacy-source"
          # One second, and it is load-bearing rather than superstition. Set
          # directories are named to the second, and a backup of this corpus
          # finishes in well under one, so this run and the real one above can
          # ask for the same name. The script then refuses because the set
          # exists — a refusal for the wrong reason, which never reaches the
          # missing mount and leaves no `.partial` for the last assertion.
          #
          # Waiting is the fix and a separate `--backup-root` is *not*: the
          # guard being tested compares an empty source against a mirror that
          # already holds files, and the mirror lives in the backup root. Point
          # this run somewhere fresh and the mirror is empty too, which is a new
          # deployment rather than a lost mount — so the backup rightly
          # succeeds and the step fails for a reason that is entirely its own
          # doing (scripts/deploy/juristid-backup.sh, `sync_tree`).
          sleep 1
          # Finished sets only. A failed run is *supposed* to leave a directory
          # named `.partial` behind — that is how a crash produces something
          # obviously incomplete rather than something plausible — so counting
          # it here would fail the very behaviour this step exists to prove.
          finished() { find "$BACKUP_ROOT/sets" -mindepth 1 -maxdepth 1 -type d -not -name '*.partial' | wc -l; }
          before="$(finished)"
          if scripts/deploy/juristid-backup.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --data-root "$empty" --backup-root "$BACKUP_ROOT" --minimum-free-mib 64; then
            echo "the backup succeeded against an empty evidence tree"; exit 1
          fi
          test "$before" = "$(finished)" || { echo "a failed backup left a finished-looking set behind"; exit 1; }
          test -n "$(find "$BACKUP_ROOT/sets" -mindepth 1 -maxdepth 1 -name '*.partial' -print -quit)" \
            || { echo "a failed backup left nothing to investigate"; exit 1; }

      - name: A tree emptied on purpose is backed up when the operator says so
        run: |
          # The other half of the guard above. After an operational reset the
          # source is legitimately empty while the mirror still holds the old
          # corpus, and refusing there leaves the reset deployment with no
          # backup at all — which is what happened on 2026-09-12. The claim is
          # the operator's, so it is made on the command line and recorded.
          #
          # Named per tree: `--allow-empty evidence` must not quietly cover
          # legacy-source, or one reset disarms the guard for everything.
          empty=/tmp/juristid-rehearsal/empty-mount
          sleep 1
          scripts/deploy/juristid-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --data-root "$empty" --backup-root "$BACKUP_ROOT" --minimum-free-mib 64 \
            --allow-empty evidence --allow-empty legacy-source
          relaxed="$(find "$BACKUP_ROOT/sets" -mindepth 1 -maxdepth 1 -type d -not -name '*.partial' | sort | tail -1)"
          grep -q '"empty_source_allowed_for": \["evidence", "legacy-source"\]' "$relaxed/manifest.json" \
            || { echo "the manifest does not record which guards were relaxed"; cat "$relaxed/manifest.json"; exit 1; }
          scripts/deploy/juristid-verify-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" --set "$relaxed" --level 2

      - name: Allowing one empty tree does not allow the other
        run: |
          empty=/tmp/juristid-rehearsal/empty-mount
          sleep 1
          if scripts/deploy/juristid-backup.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --data-root "$empty" --backup-root "$BACKUP_ROOT" --minimum-free-mib 64 \
               --allow-empty evidence; then
            echo "an unnamed empty tree was backed up anyway"; exit 1
          fi

      - name: An unknown tree name is refused rather than ignored
        run: |
          # A typo that silently allows nothing would read as a working flag.
          if scripts/deploy/juristid-backup.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --data-root "$DATA_ROOT" --backup-root "$BACKUP_ROOT" --minimum-free-mib 64 \
               --allow-empty evidnce; then
            echo "a misspelled tree name was accepted"; exit 1
          fi

      - name: A backup root that does not exist is refused
        run: |
          if scripts/deploy/juristid-backup.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --data-root "$DATA_ROOT" --backup-root /tmp/juristid-rehearsal/nowhere; then
            echo "the backup succeeded with no destination"; exit 1
          fi

      - name: A corrupted archive fails verification
        run: |
          cp -a "$SET_DIR" /tmp/juristid-rehearsal/corrupt-set
          printf 'this is not a dump' > /tmp/juristid-rehearsal/corrupt-set/database.dump
          if scripts/deploy/juristid-verify-backup.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --set /tmp/juristid-rehearsal/corrupt-set; then
            echo "verification passed a corrupted archive"; exit 1
          fi

      - name: A truncated archive fails verification
        run: |
          cp -a "$SET_DIR" /tmp/juristid-rehearsal/truncated-set
          head -c 512 "$SET_DIR/database.dump" > /tmp/juristid-rehearsal/truncated-set/database.dump
          if scripts/deploy/juristid-verify-backup.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --set /tmp/juristid-rehearsal/truncated-set; then
            echo "verification passed a truncated archive"; exit 1
          fi

      - name: An archive cut inside its data and re-sealed fails level 2
        run: |
          set -euo pipefail
          # The truncation above cuts to 512 bytes and leaves SHA256SUMS alone,
          # so level 1 catches it and level 2 never has to. This is the case
          # level 2 exists for (ENG-141): a dump cut inside its data *before*
          # the set was sealed, so every checksum and the manifest agree with
          # the damaged file and its table of contents is still whole.
          resealed=/tmp/juristid-rehearsal/resealed-set
          cp -a "$SET_DIR" "$resealed"
          full="$(stat -c %s "$SET_DIR/database.dump")"
          head -c "$(( full * 95 / 100 ))" "$SET_DIR/database.dump" > "$resealed/database.dump"
          size="$(stat -c %s "$resealed/database.dump")"
          digest="$(sha256sum "$resealed/database.dump" | cut -d' ' -f1)"
          sed -i \
            -e "/\"database\"/,/}/ s/\"size_bytes\": [0-9]*/\"size_bytes\": $size/" \
            -e "/\"database\"/,/}/ s/\"sha256\": \"[0-9a-f]*\"/\"sha256\": \"$digest\"/" \
            "$resealed/manifest.json"
          ( cd "$resealed" && sha256sum $(awk '{print $2}' SHA256SUMS) > SHA256SUMS.new && mv SHA256SUMS.new SHA256SUMS )

          # Sealed consistently: level 1 is satisfied by the damaged set.
          scripts/deploy/juristid-verify-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --set "$resealed" --backup-root "$BACKUP_ROOT" --level 1
          # And its table of contents still lists — which is all level 2 used
          # to read, so this is the state it used to pass.
          docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" cp "$resealed/database.dump" db:/tmp/resealed.dump
          docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" exec -T db pg_restore --list /tmp/resealed.dump > /dev/null \
            || { echo "the cut reached the table of contents; this step tests nothing"; exit 1; }

          # The pools are named, so reading the data is the only thing left
          # that can fail.
          if scripts/deploy/juristid-verify-backup.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --set "$resealed" --backup-root "$BACKUP_ROOT" --level 2; then
            echo "level 2 passed an archive truncated inside its data"; exit 1
          fi

      - name: Level 2 reads the whole intact archive, and says how long it took
        run: |
          set -euo pipefail
          started="$(date +%s%N)"
          scripts/deploy/juristid-verify-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" --set "$SET_DIR" --level 2 \
            | tee /tmp/juristid-rehearsal/level2.log
          echo "level 2 took $(( ($(date +%s%N) - started) / 1000000 )) ms for $(stat -c %s "$SET_DIR/database.dump") bytes"
          grep -q "the whole archive read cleanly" /tmp/juristid-rehearsal/level2.log \
            || { echo "level 2 did not read the archive's data"; exit 1; }

      # -- exact membership -------------------------------------------------
      #
      # A backup root's evidence/ and legacy-source/ are a shared byte pool:
      # append-only, holding every object any set has ever named. Until manifest
      # version 3 that was the only record of a set's filesystem half, so
      # "restore this set" meant "copy the pool" — the same thing only while
      # nothing has ever left the active tree.
      #
      # On 12.09.2026 something did. An operational reset emptied active
      # evidence and the pool kept its 20068 pre-reset objects, so the set taken
      # that day — a true record of a deployment holding no evidence at all —
      # would have restored twenty thousand orphans beside an empty register.
      #
      # These steps are that scenario, at three objects instead of twenty
      # thousand, against the real scripts. Their own data root, backup root and
      # databases throughout, so the restore rehearsal below is untouched.

      - name: Populated source, and a set that records what it holds
        run: |
          set -euo pipefail
          root=/tmp/juristid-rehearsal/membership
          mkdir -p "$root/source/evidence/aa" "$root/source/legacy-source" "$root/backups"
          printf 'old-a' > "$root/source/evidence/aa/old-a.bin"
          printf 'old-bb' > "$root/source/evidence/aa/old-b.bin"
          printf '<page id="m"/>' > "$root/source/legacy-source/page.xml"

          scripts/deploy/juristid-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --data-root "$root/source" --backup-root "$root/backups" --minimum-free-mib 64
          set_a="$(find "$root/backups/sets" -mindepth 1 -maxdepth 1 -type d -not -name '*.partial' | sort | tail -1)"
          echo "MEMBERSHIP_SET_A=$set_a" >> "$GITHUB_ENV"

          test "$(tr -dc '\000' < "$set_a/evidence.files0" | wc -c)" = 2 \
            || { echo "set A did not record its two evidence objects"; exit 1; }
          grep -q '"manifest_version": 3' "$set_a/manifest.json" \
            || { echo "the backup did not write a membership manifest"; exit 1; }
          grep -q 'evidence.files0' "$set_a/SHA256SUMS" \
            || { echo "the inventory is not covered by the set's checksums"; exit 1; }

      - name: The deployment is reset, and its set records an empty tree
        run: |
          set -euo pipefail
          root=/tmp/juristid-rehearsal/membership

          # A reset deployment: the schema is there and nothing business-shaped
          # is. Its own database, so the restore rehearsal's seeded one — which
          # a fingerprint below still has to match exactly — is never touched.
          docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" exec -T db \
            psql --no-password -U juristid -d postgres -c 'CREATE DATABASE membership_clean OWNER juristid'
          POSTGRES_DB=membership_clean uv run python manage.py migrate --noinput

          find "$root/source/evidence" -type f -delete
          sleep 1
          scripts/deploy/juristid-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --db-name membership_clean \
            --data-root "$root/source" --backup-root "$root/backups" --minimum-free-mib 64 \
            --allow-empty evidence
          set_b="$(find "$root/backups/sets" -mindepth 1 -maxdepth 1 -type d -not -name '*.partial' | sort | tail -1)"
          echo "MEMBERSHIP_SET_B=$set_b" >> "$GITHUB_ENV"

          # The shared pool keeps the history. The set says it owns none of it.
          test "$(find "$root/backups/evidence" -type f | wc -l)" = 2 \
            || { echo "the pool did not keep the pre-reset objects"; exit 1; }
          test "$(tr -dc '\000' < "$set_b/evidence.files0" | wc -c)" = 0 \
            || { echo "the empty tree produced a non-empty inventory"; exit 1; }
          grep -q '"file_count": 0' "$set_b/manifest.json" \
            || { echo "the manifest does not record an empty evidence snapshot"; exit 1; }

          # And the two numbers stay distinguishable: the pool's count is about
          # the pool, and reading it as the set's is the whole defect.
          sed -n '/"evidence_mirror"/,/}/p' "$set_b/manifest.json" | grep -q '"file_count": 2' \
            || { echo "the manifest lost the pool's own state"; exit 1; }

          # Level 2 passes: nothing is missing, because nothing is claimed.
          scripts/deploy/juristid-verify-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" --set "$set_b" --level 2

      - name: Restoring the clean set gives back a clean deployment
        run: |
          set -euo pipefail
          root=/tmp/juristid-rehearsal/membership
          docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" exec -T db \
            psql --no-password -U juristid -d postgres -c 'CREATE DATABASE membership_b OWNER juristid'
          mkdir -p "$root/restored-b/evidence" "$root/restored-b/legacy-source"

          scripts/deploy/juristid-restore.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --db-name membership_b \
            --set "$MEMBERSHIP_SET_B" --backup-root "$root/backups" --data-root "$root/restored-b"

          restored="$(find "$root/restored-b/evidence" -type f | wc -l)"
          test "$restored" = 0 || {
            echo "the clean set restored $restored evidence file(s); it recorded none"
            find "$root/restored-b/evidence" -type f; exit 1; }
          test ! -e "$root/restored-b/evidence/aa/old-a.bin" || { echo "old-a came back"; exit 1; }
          test ! -e "$root/restored-b/evidence/aa/old-b.bin" || { echo "old-b came back"; exit 1; }
          test "$(find "$root/restored-b/legacy-source" -type f | wc -l)" = 1 \
            || { echo "the page XML this set did name was not restored"; exit 1; }

      - name: The older populated set still restores its own objects
        run: |
          set -euo pipefail
          # Membership does not cost an earlier set its bytes: they live once in
          # the shared pool, and each set names the ones that are its own.
          root=/tmp/juristid-rehearsal/membership
          docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" exec -T db \
            psql --no-password -U juristid -d postgres -c 'CREATE DATABASE membership_a OWNER juristid'
          mkdir -p "$root/restored-a/evidence" "$root/restored-a/legacy-source"

          scripts/deploy/juristid-restore.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --db-name membership_a \
            --set "$MEMBERSHIP_SET_A" --backup-root "$root/backups" --data-root "$root/restored-a"

          test -s "$root/restored-a/evidence/aa/old-a.bin" || { echo "old-a did not come back"; exit 1; }
          test -s "$root/restored-a/evidence/aa/old-b.bin" || { echo "old-b did not come back"; exit 1; }
          test "$(find "$root/restored-a/evidence" -type f | wc -l)" = 2 \
            || { echo "set A restored something it never named"; exit 1; }

      - name: A set whose membership is a subset restores the subset only
        run: |
          set -euo pipefail
          # The general property, so the fix cannot be "if the count is zero,
          # skip the pool". The pool holds three objects; this set names one.
          root=/tmp/juristid-rehearsal/membership
          printf 'new-ccc' > "$root/source/evidence/aa/new-c.bin"
          sleep 1
          scripts/deploy/juristid-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --data-root "$root/source" --backup-root "$root/backups" --minimum-free-mib 64
          set_c="$(find "$root/backups/sets" -mindepth 1 -maxdepth 1 -type d -not -name '*.partial' | sort | tail -1)"
          echo "MEMBERSHIP_SET_C=$set_c" >> "$GITHUB_ENV"
          test "$(find "$root/backups/evidence" -type f | wc -l)" = 3 \
            || { echo "the pool is not the three-object pool this step needs"; exit 1; }

          docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" exec -T db \
            psql --no-password -U juristid -d postgres -c 'CREATE DATABASE membership_c OWNER juristid'
          mkdir -p "$root/restored-c/evidence" "$root/restored-c/legacy-source"
          scripts/deploy/juristid-restore.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --db-name membership_c \
            --set "$set_c" --backup-root "$root/backups" --data-root "$root/restored-c"

          test -s "$root/restored-c/evidence/aa/new-c.bin" || { echo "the member was not restored"; exit 1; }
          test "$(find "$root/restored-c/evidence" -type f | wc -l)" = 1 \
            || { echo "the pool's other objects were resurrected"; find "$root/restored-c/evidence" -type f; exit 1; }

      - name: Storage that is not empty is refused, not emptied
        run: |
          set -euo pipefail
          # Exactness by `rsync --delete` would be exactness at the price of the
          # one thing a recovery script must never do to files it did not put
          # there. So the answer is a refusal and the operator decides.
          root=/tmp/juristid-rehearsal/membership
          mkdir -p "$root/dirty/evidence" "$root/dirty/legacy-source"
          printf 'not from any backup' > "$root/dirty/evidence/unexpected.txt"
          if scripts/deploy/juristid-restore.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --db-name membership_c \
               --set "$MEMBERSHIP_SET_C" --backup-root "$root/backups" --data-root "$root/dirty"; then
            echo "the restore wrote into storage that already held something"; exit 1
          fi
          test "$(cat "$root/dirty/evidence/unexpected.txt")" = "not from any backup" \
            || { echo "the refused restore changed the file it refused over"; exit 1; }
          test "$(find "$root/dirty/evidence" -type f | wc -l)" = 1 \
            || { echo "the refused restore copied objects in anyway"; exit 1; }

      - name: A member missing from the pool fails verification
        run: |
          set -euo pipefail
          # And it fails on membership rather than on the pool's own totals: the
          # pool is left with as many files and more bytes than the manifest
          # recorded, which every whole-pool check is satisfied by.
          root=/tmp/juristid-rehearsal/membership
          rm "$root/backups/evidence/aa/new-c.bin"
          printf 'unrelated and larger' > "$root/backups/evidence/aa/historic-z.bin"
          if scripts/deploy/juristid-verify-backup.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --set "$MEMBERSHIP_SET_C" --level 2; then
            echo "verification passed a set whose own object is gone"; exit 1
          fi
          # Put it back: later steps share this pool.
          printf 'new-ccc' > "$root/backups/evidence/aa/new-c.bin"
          rm "$root/backups/evidence/aa/historic-z.bin"

      - name: A set moved away from its pools is verified against the pools it restores from
        run: |
          set -euo pipefail
          # A set fetched back from an off-host copy lives wherever it was
          # fetched to, and nothing two directories above it is a pool. The
          # restore was given the right pools and verified against the wrong
          # place, so it failed closed before writing anything (ENG-054).
          root=/tmp/juristid-rehearsal/membership
          staged="/tmp/juristid-rehearsal/staged/incoming/$(basename "$MEMBERSHIP_SET_C")"
          mkdir -p "$(dirname "$staged")"
          cp -a "$MEMBERSHIP_SET_C" "$staged"
          test ! -e /tmp/juristid-rehearsal/staged/evidence \
            || { echo "a pool sits where the default would find it; this step tests nothing"; exit 1; }

          scripts/deploy/juristid-verify-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --set "$staged" --backup-root "$root/backups" --level 2

          docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" exec -T db \
            psql --no-password -U juristid -d postgres -c 'CREATE DATABASE membership_moved OWNER juristid'
          mkdir -p "$root/restored-moved/evidence" "$root/restored-moved/legacy-source"
          scripts/deploy/juristid-restore.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --db-name membership_moved \
            --set "$staged" --backup-root "$root/backups" --data-root "$root/restored-moved"

          test -s "$root/restored-moved/evidence/aa/new-c.bin" || { echo "the member was not restored"; exit 1; }
          test "$(find "$root/restored-moved/evidence" -type f | wc -l)" = 1 \
            || { echo "the moved set restored something it never named"; exit 1; }

      - name: A moved set restores its database alone without asking for any pool
        run: |
          set -euo pipefail
          staged="/tmp/juristid-rehearsal/staged/incoming/$(basename "$MEMBERSHIP_SET_C")"
          docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" exec -T db \
            psql --no-password -U juristid -d postgres -c 'CREATE DATABASE membership_database_only OWNER juristid'
          scripts/deploy/juristid-restore.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --db-name membership_database_only \
            --set "$staged" --database-only
          tables="$(docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" exec -T db \
            psql --no-password -U juristid -d membership_database_only -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'" | tr -d '\r\n ')"
          test "$tables" -gt 0 || { echo "the database-only restore restored nothing"; exit 1; }

      # -- a deletion during the dump (ENG-114) ------------------------------
      #
      # Kustuta teema commits the deletion of a Teema's rows and then removes
      # its objects. Landing inside the dump, that leaves the rows in the dump's
      # snapshot and the objects gone from the tree, and a membership read only
      # after the dump left them out: a set that verified at levels 1 and 2 and
      # restored the Teema without its bytes.
      #
      # Made deterministic rather than hoped for, the way the audit's verifier
      # did it: a session holds a lock pg_dump needs, so pg_dump waits *inside*
      # its snapshot while the real `delete_matter()` commits, and only then is
      # the lock released. Its own database, data root and backup root.

      - name: A Teema deleted while the dump runs is restored with its bytes
        run: |
          set -euo pipefail
          root=/tmp/juristid-rehearsal/race
          mkdir -p "$root/source/evidence" "$root/source/legacy-source" "$root/source/derivatives" "$root/backups"
          printf '<page id="race"/>' > "$root/source/legacy-source/page.xml"
          compose() { docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" "$@"; }
          sql() { compose exec -T db psql --no-password -U juristid -d race -tAc "$1" | tr -d '\r\n '; }
          on_race() {
            POSTGRES_DB=race EVIDENCE_ROOT="$root/source/evidence" \
              LEGACY_SOURCE_ROOT="$root/source/legacy-source" DERIVATIVE_ROOT="$root/source/derivatives" \
              uv run python manage.py "$@"
          }

          compose exec -T db psql --no-password -U juristid -d postgres -c 'CREATE DATABASE race OWNER juristid'
          on_race migrate --noinput
          on_race seed_e2e_data
          test "$(find "$root/source/evidence" -type f | wc -l)" -gt 0 \
            || { echo "the seed wrote no evidence; this step tests nothing"; exit 1; }

          # Pick a Teema the deletion will accept and write down its objects.
          # The keys stay in the job's temporary files; nothing is printed.
          on_race shell -c "
          from pathlib import Path
          from app.documents.models import DocumentVersion
          from app.matters.deletion import plan_matter_deletion
          for version in DocumentVersion.objects.select_related('document__matter').order_by('pk'):
              matter = version.document.matter
              if not plan_matter_deletion(matter).refusals:
                  keys = sorted(DocumentVersion.objects.filter(document__matter=matter).values_list('storage_key', flat=True))
                  Path('$root/doomed.pk').write_text(str(matter.pk))
                  Path('$root/doomed.keys').write_text(chr(10).join(keys) + chr(10))
                  break
          "
          test -s "$root/doomed.keys" || { echo "no seeded Teema with evidence can be deleted"; exit 1; }

          compose exec -T db psql --no-password -U juristid -d race \
            -c 'BEGIN; LOCK TABLE django_migrations IN ACCESS EXCLUSIVE MODE; SELECT pg_sleep(300); COMMIT;' \
            > /dev/null 2>&1 &
          holder=$!
          held=0
          for _ in $(seq 1 100); do
            held="$(sql "SELECT count(*) FROM pg_locks l JOIN pg_class c ON c.oid = l.relation WHERE c.relname = 'django_migrations' AND l.mode = 'AccessExclusiveLock' AND l.granted")"
            [ "$held" = 1 ] && break
            sleep 0.2
          done
          test "$held" = 1 || { echo "the lock was never taken"; exit 1; }

          scripts/deploy/juristid-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" --db-name race \
            --data-root "$root/source" --backup-root "$root/backups" --minimum-free-mib 64 \
            > "$root/backup.log" 2>&1 &
          backup=$!

          waiting=0
          for _ in $(seq 1 300); do
            waiting="$(sql "SELECT count(*) FROM pg_stat_activity WHERE application_name = 'pg_dump' AND wait_event_type = 'Lock'")"
            [ "$waiting" -ge 1 ] && break
            sleep 0.2
          done
          test "$waiting" -ge 1 || { echo "pg_dump never waited inside its snapshot; this step tests nothing"; cat "$root/backup.log"; exit 1; }

          # The real deletion, committed while the dump's snapshot is open. Its
          # on-commit cleanup removes the objects from the source tree.
          on_race shell -c "
          from pathlib import Path
          from app.matters.deletion import delete_matter
          from app.matters.models import Matter
          delete_matter(matter=Matter.objects.get(pk=Path('$root/doomed.pk').read_text()))
          "
          while IFS= read -r key; do
            test ! -e "$root/source/evidence/$key" || { echo "the deletion did not remove its objects; this step tests nothing"; exit 1; }
          done < "$root/doomed.keys"

          sql "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE query LIKE '%pg_sleep(300)%' AND pid <> pg_backend_pid()" > /dev/null
          wait "$holder" || true
          wait "$backup" || { echo "the backup failed"; cat "$root/backup.log"; exit 1; }
          cat "$root/backup.log"

          set_r="$(find "$root/backups/sets" -mindepth 1 -maxdepth 1 -type d -not -name '*.partial' | sort | tail -1)"
          tr '\0' '\n' < "$set_r/evidence.files0" > "$root/members.txt"
          while IFS= read -r key; do
            grep -qxF -- "$key" "$root/members.txt" \
              || { echo "the set does not name an object of the Teema deleted during the dump"; exit 1; }
          done < "$root/doomed.keys"
          scripts/deploy/juristid-verify-backup.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
            --set "$set_r" --backup-root "$root/backups" --level 2

          # The dump holds the Teema; the restore must bring its bytes back
          # beside it, which is what the integrity check asks.
          compose exec -T db psql --no-password -U juristid -d postgres -c 'CREATE DATABASE race_restored OWNER juristid'
          mkdir -p "$root/restored/evidence" "$root/restored/legacy-source" "$root/restored/derivatives"
          scripts/deploy/juristid-restore.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" --db-name race_restored \
            --set "$set_r" --backup-root "$root/backups" --data-root "$root/restored"
          doomed="$(cat "$root/doomed.pk")"
          test "$(sql "SELECT deleted_at IS NOT NULL FROM matters_matter WHERE id = '$doomed'")" = t \
            || { echo "the Teema is not deleted in the live database; this step tests nothing"; exit 1; }
          restored_live="$(compose exec -T db psql --no-password -U juristid -d race_restored -tAc \
            "SELECT deleted_at IS NULL FROM matters_matter WHERE id = '$doomed'" | tr -d '\r\n ')"
          test "$restored_live" = t \
            || { echo "the dump did not hold the Teema before its deletion; this step tests nothing"; exit 1; }
          POSTGRES_DB=race_restored EVIDENCE_ROOT="$root/restored/evidence" \
            LEGACY_SOURCE_ROOT="$root/restored/legacy-source" DERIVATIVE_ROOT="$root/restored/derivatives" \
            uv run python manage.py check_evidence_integrity

      # -- a restore that fails part-way (ENG-115) ---------------------------
      #
      # pg_restore ran with --exit-on-error but not --single-transaction, so a
      # failure left every statement before it committed: a schema and part of
      # the rows. The rerun the message advised then met the storage refusal,
      # because step 4 had already copied the evidence.
      #
      # The failure is made the honest way: a type in the target database with
      # the name of the dump's last table. `information_schema.tables` does not
      # count types, so the empty-database check passes, the storage copy runs,
      # and pg_restore fails on CREATE TABLE after every earlier one.

      - name: A restore that fails part-way leaves the database empty and says what to move
        run: |
          set -euo pipefail
          root=/tmp/juristid-rehearsal/membership
          compose() { docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" "$@"; }
          tables() {
            compose exec -T db psql --no-password -U juristid -d membership_failed -tAc \
              "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'" | tr -d '\r\n '
          }
          compose cp "$MEMBERSHIP_SET_C/database.dump" db:/tmp/failing.dump
          last="$(compose exec -T db pg_restore --list /tmp/failing.dump \
            | awk '$4 == "TABLE" && $5 == "public" { name = $6 } END { print name }')"
          test -n "$last" || { echo "the dump lists no table; this step tests nothing"; exit 1; }

          compose exec -T db psql --no-password -U juristid -d postgres -c 'CREATE DATABASE membership_failed OWNER juristid'
          compose exec -T db psql --no-password -U juristid -d membership_failed \
            -c "CREATE TYPE public.\"$last\" AS (blocker integer)"
          test "$(tables)" = 0 || { echo "the blocker counts as a table; this step tests nothing"; exit 1; }
          mkdir -p "$root/restored-failed/evidence" "$root/restored-failed/legacy-source"

          if scripts/deploy/juristid-restore.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" --db-name membership_failed \
               --set "$MEMBERSHIP_SET_C" --backup-root "$root/backups" --data-root "$root/restored-failed" \
               2> "$root/failed.err"; then
            echo "the restore succeeded over a blocked table"; exit 1
          fi
          cat "$root/failed.err"
          grep -q "pg_restore failed" "$root/failed.err" \
            || { echo "the restore failed somewhere other than pg_restore; this step tests nothing"; exit 1; }

          # Nothing the failed restore wrote survived.
          test "$(tables)" = 0 || { echo "the failed restore left $(tables) table(s) behind"; exit 1; }
          # And the message names the storage it had already filled.
          grep -qF "$root/restored-failed/evidence" "$root/failed.err" \
            || { echo "the failure does not name the evidence tree to move aside"; exit 1; }
          grep -qF "$root/restored-failed/legacy-source" "$root/failed.err" \
            || { echo "the failure does not name the page-XML tree to move aside"; exit 1; }

          # Doing exactly what it says works: fix the cause, move the trees
          # aside, run again onto the same database and data root.
          compose exec -T db psql --no-password -U juristid -d membership_failed -c "DROP TYPE public.\"$last\""
          mv "$root/restored-failed/evidence" "$root/restored-failed/evidence.aside"
          mv "$root/restored-failed/legacy-source" "$root/restored-failed/legacy-source.aside"
          mkdir -p "$root/restored-failed/evidence" "$root/restored-failed/legacy-source"
          scripts/deploy/juristid-restore.sh \
            --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" --db-name membership_failed \
            --set "$MEMBERSHIP_SET_C" --backup-root "$root/backups" --data-root "$root/restored-failed"
          test "$(tables)" -gt 0 || { echo "the rerun restored nothing"; exit 1; }
          test -s "$root/restored-failed/evidence/aa/new-c.bin" || { echo "the rerun did not restore the member"; exit 1; }

      # -- the destructive part --------------------------------------------

      - name: Destroy the database and the storage trees
        run: |
          docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" exec -T db \
            psql --no-password -U juristid -d juristid \
            -c 'DROP SCHEMA public CASCADE; CREATE SCHEMA public;'
          rm -rf "$EVIDENCE_ROOT" "$LEGACY_SOURCE_ROOT" "$DERIVATIVE_ROOT"

      - name: The application now refuses to call itself ready
        run: |
          if uv run python manage.py deployment_readiness --quiet; then
            echo "readiness passed against a destroyed deployment"; exit 1
          fi

      - name: Restore
        run: |
          scripts/deploy/juristid-restore.sh \
            --project "$PROJECT" \
            --compose-file "$COMPOSE_FILE_PATH" \
            --set "$SET_DIR" \
            --backup-root "$BACKUP_ROOT" \
            --data-root "$DATA_ROOT"

      - name: A restore over a populated database is refused
        run: |
          if scripts/deploy/juristid-restore.sh \
               --project "$PROJECT" --compose-file "$COMPOSE_FILE_PATH" \
               --set "$SET_DIR" --database-only; then
            echo "the restore overwrote a populated database"; exit 1
          fi

      # -- what the restore has to prove ------------------------------------

      - name: The canonical state came back, evidence bytes included
        run: |
          uv run python manage.py recovery_fingerprint \
            --compare /tmp/juristid-rehearsal/before.json \
            --out /tmp/juristid-rehearsal/after.json

      # The fingerprint above proves the restored set is the set that was backed
      # up. This proves the two halves it restored still describe each other —
      # no row whose object is missing, no object no row refers to. Structural
      # only: `--verify-sha` reads every stored byte and is a maintenance
      # window, not a verification step (docs/adr/0022).
      - name: The restored evidence store and database still describe each other
        run: uv run python manage.py check_evidence_integrity

      - name: Rebuildable data is rebuilt rather than restored
        run: |
          uv run python manage.py rebuild_search_index
          uv run python manage.py shell -c "
          from app.search.models import SearchDocument
          count = SearchDocument.objects.count()
          assert count > 0, 'the search projection did not rebuild'
          print(f'{count} search documents rebuilt')
          "

      - name: The restored deployment reports itself ready
        run: uv run python manage.py deployment_readiness

      - name: Rehearsal logs on failure
        if: failure()
        run: docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" logs

      - name: Tear down
        if: always()
        run: docker compose -p "$PROJECT" -f "$COMPOSE_FILE_PATH" down -v

  container:
    name: Container and compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t juristid:ci .

      - name: Start the local stack
        run: docker compose up -d --wait --build

      - name: The application answers its health probe
        run: |
          curl --fail --silent --show-error http://localhost:8000/healthz | tee /dev/stderr | grep -q '"status": "ok"'

      - name: The landing page renders
        run: curl --fail --silent --show-error http://localhost:8000/ > /dev/null

      - name: Synthetic data was seeded
        run: docker compose exec -T web python manage.py shell -c "from app.matters.models import Matter; assert Matter.objects.exists(), 'seed produced no Matters'"

      # ENG-071, proved on the wire rather than by reading a flag. Each deployed
      # stack's access-log format, exactly as `docker compose config` resolves
      # it, is handed to the image's own gunicorn serving this running
      # application, and one request carries a secret in its query string and
      # another in its Referer. The probe first runs gunicorn's default format
      # and requires both secrets to *appear*, so it cannot pass by being blind.
      # `config` also validates both deployment files, `logging:` blocks
      # included; it builds nothing and starts nothing.
      - name: The deployed access-log formats record paths, never query strings
        run: |
          set -euo pipefail
          JURISTID_ENV_FILE="$(mktemp)"
          echo "POSTGRES_PASSWORD=x" > "$JURISTID_ENV_FILE"
          export JURISTID_ENV_FILE
          for stack in unraid-main unraid-test; do
            docker compose -p "juristid-logcheck-$stack" -f "deploy/$stack/compose.yml" \
              config --format json > "$stack.resolved.json"
            FORMAT="$(python3 -c 'import json, sys; command = json.load(open(sys.argv[1]))["services"]["web"]["command"]; print(command[command.index("--access-logformat") + 1])' "$stack.resolved.json")"
            echo "--- $stack: $FORMAT"
            docker compose exec -T -e ACCESS_LOG_FORMAT="$FORMAT" web \
              python scripts/ci/assert_access_log_privacy.py
          done

      # The deployment identity, resolved by Compose itself rather than by a test
      # that re-implements `${VAR:-default}`. `config` reads the file and
      # interpolates; it builds nothing, starts nothing and reaches no host.
      #
      # The invariant the runbook rests on: one pair of exported variables, and
      # every application service resolving the same target image from them.
      # Unset, they fall back to `:local` together — the tag a hand-built image
      # overwrites, and the one a migration must never resolve.
      - name: The production stack resolves one target image from one identity
        run: |
          set -euo pipefail
          SHA=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JURISTID_ENV_FILE="$(mktemp)"
          export JURISTID_ENV_FILE
          echo "POSTGRES_PASSWORD=x" > "$JURISTID_ENV_FILE"
          resolve() { docker compose -p juristid-main -f deploy/unraid-main/compose.yml config --format json; }

          export JURISTID_GIT_SHA="$SHA"
          export JURISTID_IMAGE_TAG="${SHA:0:12}"
          resolve > tagged.json
          python3 scripts/ci/assert_deployment_identity.py tagged.json "$SHA"

          unset JURISTID_GIT_SHA JURISTID_IMAGE_TAG
          resolve > untagged.json
          python3 scripts/ci/assert_deployment_identity.py untagged.json --fallback

      # Two containers, one set of bytes — the property `Uus teema` staging
      # actually needs, proved by crossing the boundary rather than by reading
      # the Compose file (which `tests/test_deployment_unraid_main.py` does).
      #
      # `web` stages a file and the `intake-reader` container parses it, so the
      # storage class they share has to be genuinely shared. It was not: it was
      # an unmounted path in each image, and a container's writable layer is
      # private, so every staged read in production would have failed on a file
      # that existed only in the other container. Nothing in the feature suite
      # could see that, because nothing in it crosses a container boundary.
      #
      # The production model under a synthetic project name and temporary paths:
      # nothing here touches `/mnt/user`, and `down -v` at the end takes the
      # volume with it. `--no-deps` because none of this needs PostgreSQL, and
      # the image is the one already built above, retagged rather than rebuilt.
      #
      # The commands run as the image's own user, which is the other half of
      # what is being checked: a named volume takes the ownership of the image
      # path it covers, so a mount point the Dockerfile did not create would be
      # root-owned and `web` could not stage anything into it.
      - name: Staged uploads written by web are readable by the intake reader
        run: |
          set -euo pipefail
          PROJECT=juristid-sharedvolume-ci
          COMPOSE="deploy/unraid-main/compose.yml"
          TAG=sharedvolumeci
          docker tag juristid:ci "juristid-main-web:${TAG}"

          SCRATCH="$(mktemp -d)"
          JURISTID_ENV_FILE="$(mktemp)"
          echo "POSTGRES_PASSWORD=x" > "$JURISTID_ENV_FILE"
          export JURISTID_ENV_FILE
          export JURISTID_DATA_ROOT="$SCRATCH/data"
          export JURISTID_SOURCE_ROOT="$SCRATCH/source"
          export JURISTID_IMAGE_TAG="$TAG"
          mkdir -p "$JURISTID_DATA_ROOT" "$JURISTID_SOURCE_ROOT"

          PROBE="probe-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"

          # The probe travels as an environment variable and every assertion is
          # made *inside* the container, so nothing here depends on parsing
          # Compose's own progress output back out of a pipeline.
          compose() { docker compose -p "$PROJECT" -f "$COMPOSE" "$@"; }
          in_service() {
            compose run --rm --no-deps -e "PROBE=$PROBE" --entrypoint sh "$1" -c "$2"
          }
          cleanup() { compose down -v --remove-orphans >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          echo "--- web stages the bytes, as the application user"
          in_service web '
            set -e
            test "$(id -un)" = juristid
            mkdir -p /app/pending-uploads/intake
            printf %s "$PROBE" > "/app/pending-uploads/intake/$PROBE"
          '

          echo "--- the intake reader reads the same bytes from its own container"
          in_service intake-reader '
            set -e
            staged="/app/pending-uploads/intake/$PROBE"
            test -f "$staged" || { echo "the volume is not shared: $staged is absent"; exit 1; }
            test "$(cat "$staged")" = "$PROBE" || { echo "different bytes"; exit 1; }
          '

          echo "--- and cannot write to it"
          if in_service intake-reader 'echo tampered > "/app/pending-uploads/intake/$PROBE"'; then
            echo "::error::the intake reader wrote to a mount that must be read-only"
            exit 1
          fi
          in_service intake-reader '
            set -e
            test "$(cat "/app/pending-uploads/intake/$PROBE")" = "$PROBE" \
              || { echo "the staged bytes changed under a read-only mount"; exit 1; }
          '

          echo "--- web deletes it, and the deletion is visible to the reader too"
          in_service web 'rm "/app/pending-uploads/intake/$PROBE"'
          if in_service intake-reader 'test -e "/app/pending-uploads/intake/$PROBE"'; then
            echo "::error::the intake reader still sees a file web deleted"
            exit 1
          fi
          echo "two containers, one set of bytes, web-only writes"

      # The real-data rehearsal template is never started here — it exists to
      # hold a production backup set, and CI has none. What CI can prove is the
      # two things that would otherwise only be discovered mid-rehearsal, by
      # somebody in a hurry: that the file parses, and that its guards fire.
      #
      # `config` interpolates and validates. It builds nothing and starts
      # nothing, so the stack is never brought up against real data by running
      # it.
      - name: The real-data rehearsal template refuses to resolve without its paths
        run: |
          set -euo pipefail
          REAL=deploy/recovery-rehearsal/compose.real-data.yml
          SRC=deploy/recovery-rehearsal/compose.real-data.source.yml
          # Nothing is exported here on purpose: this is the state an operator is
          # in when they forget a step, and `${VAR:?}` has to stop them.
          if docker compose -p juristid-recovery-rehearsal -f "$REAL" config >/dev/null 2>&1; then
            echo "::error::resolved with no scratch paths set; a forgotten export would bind something"
            exit 1
          fi
          echo "no scratch paths -> refused, as it must"

          ENV_FILE="$(mktemp)"
          if JURISTID_REHEARSAL_ENV_FILE="$ENV_FILE" \
             JURISTID_REHEARSAL_DATA_ROOT=/tmp/rehearsal \
             JURISTID_REHEARSAL_PGDATA=/tmp/rehearsal/postgres \
             JURISTID_REHEARSAL_IMAGE_TAG=deadbeefdead \
             docker compose -p juristid-recovery-rehearsal -f "$REAL" -f "$SRC" config >/dev/null 2>&1; then
            echo "::error::the source overlay resolved without a corpus path"
            exit 1
          fi
          echo "no corpus path -> the overlay refused too, as it must"

      - name: The real-data rehearsal template resolves to an isolated stack
        run: |
          set -euo pipefail
          ENV_FILE="$(mktemp)"
          export JURISTID_REHEARSAL_ENV_FILE="$ENV_FILE"
          export JURISTID_REHEARSAL_DATA_ROOT=/tmp/rehearsal
          export JURISTID_REHEARSAL_PGDATA=/tmp/rehearsal/postgres
          export JURISTID_REHEARSAL_IMAGE_TAG=deadbeefdead
          export JURISTID_REHEARSAL_SOURCE_ROOT=/tmp/rehearsal/source
          # `--profile workers` so the gated services appear in the output at all;
          # whether they are gated is then read off their own `profiles` key,
          # which survives the profile being active. Without this the output
          # would depend on how the installed Compose filters profiles.
          docker compose -p juristid-recovery-rehearsal --profile workers \
            -f deploy/recovery-rehearsal/compose.real-data.yml \
            -f deploy/recovery-rehearsal/compose.real-data.source.yml \
            config --format json > rehearsal.json
          python3 scripts/ci/assert_rehearsal_isolation.py rehearsal.json

      - name: Container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
