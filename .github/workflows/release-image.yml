name: Release image

# Build a production image for a reviewed commit, off the deployment host.
#
# KOCORP must not build this image. Its Docker writable storage is parity-backed
# through a USB rotational disk, which makes an on-host build slow enough that
# BuildKit has died in the middle of one — and a build that dies halfway on the
# machine serving real data is a bad place to discover that. So the image is
# built here, saved, carried over, and loaded. The host's only image operations
# are `docker load` and `docker compose up`.
#
# Run it from the Actions tab, or:
#
#   gh workflow run release-image.yml \
#     -f sha=<full-40-char-sha> \
#     -f previous_sha=<the full 40-char commit production runs now>
#
# The artifact holds the gzipped image and a manifest naming the revision, the
# image id, the archive size and the archive's SHA-256. Check that digest again
# after the transfer: it is the only thing that proves the bytes the host loads
# are the bytes this job built.
#
# **The image archived is the image scanned** (G-02). This job builds its own
# image, later than CI built `juristid:ci` and with a fresh `apt-get upgrade`,
# so CI's scan is not evidence about it. CI's runtime check and CI's Trivy gate
# run again here, on this image, before it is saved; the manifest records the
# image id each saw (`scanned_image_id`, `runtime_checked_image_id`), the id
# read back out of the archive (`archive_image_id`), the scan's summary and the
# SHA-256 of the OS package list. On the receiving side,
# `scripts/deploy/juristid-verify-release-artifact.sh` refuses an artifact
# whose manifest does not name one scanned image, and a loaded image that is
# not it.
#
# **Only an accepted revision of main, with CI green on its exact bytes, is
# built** (ENG-015). Before anything else the job proves both: that the commit
# is on main's first-parent history — the merge commits main recorded, not a
# merged pull request's own head, which is an ancestor with the same tree and
# green checks of its own and is still not what main accepted (2026-09-09) —
# and that CI passed on exactly this commit's tree. That is main's own `ci.yml`
# run for this commit, green in every job; or, while main's run is absent or
# still running (never over one that finished red), the merged pull request's
# green run, when the tree it recorded as tested is byte-for-byte this merge
# commit's tree (2026-10-02 — a release no longer waits ~11 minutes for main to
# re-test what the pull request already tested). The decision is
# `scripts/ci/assert_release_provenance.py`, read from this workflow's own
# revision of main rather than from the commit being judged, and it fails
# closed.
#
# `previous_sha` is what makes this a release rather than a build: the two
# commits bound the payload that reaches the Chamber's lawyers, and the gate
# below refuses a payload they will notice that has no entry on /uuendused/.
# That rule lives here and only here — a pull request still owes no release
# note (docs/release-notes/README.md).

on:
  workflow_dispatch:
    inputs:
      sha:
        description: The full 40-character commit to build. Not a branch, not a tag.
        required: true
        type: string
      previous_sha:
        description: >-
          The full 40-character commit production runs now (the footer's
          revision, or /app/GIT_SHA in the running web container). The release
          note is checked over everything between it and `sha`.
        required: true
        type: string
      release_note_waiver:
        description: >-
          Release without a release note, for this stated reason. Only for a
          payload that touches the application yet changes nothing a reader
          meets. Recorded in the release manifest.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  # Reading main's CI result for the commit (ENG-015). Nothing else.
  actions: read

# Runner image pinned to ubuntu-24.04, not ubuntu-latest: GitHub moves
# ubuntu-latest to Ubuntu 26 on 19 Oct 2026, and the visual baselines and the
# OCR package cache are tied to the runner image. Move it deliberately, with
# the baselines regenerated in the same change (JTEST-010).
jobs:
  build:
    name: Build and save the image
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      # The workflow file comes from the default branch; the *source* comes from
      # whatever commit was asked for. Those are deliberately allowed to differ,
      # so a release can be built without its own reviewed tree having to carry
      # the build tooling.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      # The input reaches the shell through the environment, never by
      # interpolating the expression into the script, so its text cannot
      # become shell syntax.
      - name: The checkout is the commit that was asked for, and is clean
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "sha must be a full 40-character commit: $INPUT_SHA"; exit 1; }
          head="$(git rev-parse HEAD)"
          echo "requested: $INPUT_SHA"
          echo "checked out: $head"
          test "$head" = "$INPUT_SHA" || { echo "checkout is not the requested commit"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "the tree is dirty"; git status --porcelain; exit 1; }
          echo "SHORT=${head:0:12}" >> "$GITHUB_ENV"
          echo "FULL=$head" >> "$GITHUB_ENV"

      # Main's own, and CI-green on its exact tree (ENG-015). Before the release note and
      # long before a layer is built.
      #
      # The gate's code comes from this workflow's own commit — main, checked
      # just below — and not from the checked-out tree: the commit being judged
      # must not be able to bring its own judge. Written to RUNNER_TEMP, so the
      # checkout stays exactly the requested commit and nothing extra can reach
      # the build context.
      - name: The commit is main's own, and CI passed on its exact tree
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.sha }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/heads/main" || { echo "run release-image.yml from main, not $WORKFLOW_REF: a release is judged by main's own gate"; exit 1; }
          git fetch --quiet --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git show "$WORKFLOW_SHA:scripts/ci/assert_release_provenance.py" > "$RUNNER_TEMP/assert_release_provenance.py"
          python3 "$RUNNER_TEMP/assert_release_provenance.py" \
            --target "$TARGET" \
            --repository "$REPOSITORY" \
            --main-ref origin/main \
            --git-dir "$GITHUB_WORKSPACE" \
            --env-file "$GITHUB_ENV"

      # The release carries its release note — or is internal only, or says
      # why not. Decided over the paths between what production runs and what
      # is being built, before a single layer is built: a release refused here
      # costs a minute, not an image somebody has to remember not to load.
      #
      # `previous_sha` has to be a real commit this repository holds and an
      # ancestor of `sha`; otherwise the diff describes nothing a deployment
      # will do. The decision itself is `scripts/ci/assert_release_note.py`,
      # which reads the list and nothing else, so every answer it can give is
      # held in tests/test_release_note_gate.py.
      - name: The release carries its release note
        env:
          PREVIOUS: ${{ inputs.previous_sha }}
          TARGET: ${{ inputs.sha }}
          WAIVER: ${{ inputs.release_note_waiver }}
        run: |
          set -euo pipefail
          [[ "$PREVIOUS" =~ ^[0-9a-f]{40}$ ]] || { echo "previous_sha must be a full 40-character commit: $PREVIOUS"; exit 1; }
          git cat-file -e "$PREVIOUS^{commit}" || { echo "previous_sha $PREVIOUS is not a commit in this repository"; exit 1; }
          git merge-base --is-ancestor "$PREVIOUS" "$TARGET" || { echo "the release must descend from what production runs: $PREVIOUS is not an ancestor of $TARGET"; exit 1; }
          git diff --name-only "$PREVIOUS" "$TARGET" > changed-files.txt
          echo "paths changed since production: $(wc -l < changed-files.txt)"
          echo "PREVIOUS=$PREVIOUS" >> "$GITHUB_ENV"
          python3 scripts/ci/assert_release_note.py --changed-files changed-files.txt --waiver "$WAIVER" --env-file "$GITHUB_ENV"

      # Whether this release moves `INDEX_VERSION`, decided from the two
      # commits rather than from anybody's memory (ENG-142). A moved version
      # means search answers nothing until the operator rebuilds the index,
      # while readiness and the healthcheck stay green — so the answer goes
      # into the manifest the operator deploys from. The script comes from this
      # workflow's own revision of main, like the provenance gate's.
      - name: The manifest says whether the search index must be rebuilt
        env:
          PREVIOUS: ${{ inputs.previous_sha }}
          TARGET: ${{ inputs.sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git show "$WORKFLOW_SHA:scripts/ci/index_version_change.py" > "$RUNNER_TEMP/index_version_change.py"
          python3 "$RUNNER_TEMP/index_version_change.py" \
            --previous "$PREVIOUS" --target "$TARGET" --git-dir "$GITHUB_WORKSPACE" \
            --env-file "$GITHUB_ENV"

      # linux/amd64 explicitly, because the runner's default architecture is a
      # property of the runner and the host's is a property of the host, and a
      # release should not depend on those happening to agree.
      - name: Build
        run: |
          docker build \
            --platform linux/amd64 \
            --build-arg GIT_SHA="$FULL" \
            -t "juristid-main-web:$SHORT" \
            .

      # Asked of the image rather than assumed from the build argument. A
      # container that cannot say which commit it is fails `deployment_readiness`
      # on the host, and finding that out here costs a minute instead of a
      # deployment.
      - name: The image says which commit it is
        run: |
          set -euo pipefail
          baked="$(docker run --rm --entrypoint cat "juristid-main-web:$SHORT" /app/GIT_SHA)"
          stamp="$(docker run --rm --entrypoint cat "juristid-main-web:$SHORT" /app/BUILD_STAMP)"
          arch="$(docker image inspect "juristid-main-web:$SHORT" --format '{{.Os}}/{{.Architecture}}')"
          echo "baked revision: $baked"
          echo "build stamp:    $stamp"
          echo "platform:       $arch"
          test "$baked" = "$FULL" || { echo "the image reports $baked, not $FULL"; exit 1; }
          test "$arch" = "linux/amd64" || { echo "wrong platform: $arch"; exit 1; }
          echo "BUILD_STAMP=$stamp" >> "$GITHUB_ENV"

      # Enough to prove the interpreter, the installed application and the
      # settings module all survived the build. Disposable configuration and no
      # database: this is an image check, not a deployment check.
      - name: The application imports inside the image
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          docker run --rm \
            -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS -e DJANGO_DEBUG=0 \
            --entrypoint python "juristid-main-web:$SHORT" \
            -c "import django; django.setup(); from django.conf import settings; print('django', django.get_version()); print('settings', settings.SETTINGS_MODULE); print('revision', open('/app/GIT_SHA').read())"

      # The image this job archives is not the image CI tested. It is built
      # afresh here, and the Dockerfile's `apt-get upgrade` takes whatever
      # Debian has published by now, so its operating-system packages can
      # differ from `juristid:ci`'s (G-02). A green CI run on the source is not
      # evidence about these bytes, so the two image gates CI runs are run
      # again, on this image, by the same rules — and the image id each one
      # saw is recorded, so the manifest names exactly what was checked.
      #
      # The gates are the container job's in ci.yml, held to it by
      # tests/test_aud_w3_release_image_gates.py: the same runtime check from
      # inside the image (the image's own `scripts/ci/assert_image_runtime.py`,
      # the copy CI ran on this commit), and the same pinned Trivy with the same
      # gate. Either failing stops the job here, before anything is saved or
      # uploaded: there is no artifact of an image that failed.
      #
      # The runtime check runs the image by its id, read once from the tag: a
      # tag can be moved between two commands and an id cannot, so the id
      # recorded is the image that ran (2026-11 QA, G-02).
      - name: The image is what its Dockerfile says it is
        env:
          DJANGO_SECRET_KEY: ci-only-secret-not-used-anywhere-else
          DJANGO_ALLOWED_HOSTS: localhost
        run: |
          set -euo pipefail
          checked="$(docker image inspect "juristid-main-web:$SHORT" --format '{{.Id}}')"
          [[ "$checked" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "not an image id: $checked"; exit 1; }
          docker run --rm -e DJANGO_SECRET_KEY -e DJANGO_ALLOWED_HOSTS -e DJANGO_DEBUG=0 \
            --entrypoint python "$checked" scripts/ci/assert_image_runtime.py
          test "$(docker image inspect "juristid-main-web:$SHORT" --format '{{.Id}}')" = "$checked" \
            || { echo "the tag moved while the image was being checked"; exit 1; }
          echo "runtime-checked image: $checked"
          echo "RUNTIME_CHECKED_IMAGE_ID=$checked" >> "$GITHUB_ENV"

      # The rule is CI's: fail on a HIGH or CRITICAL with a fixed version, report
      # the rest; the same Trivy, pinned by the same digest, and no ignore file
      # in either. The full report is written first, then the gate decides by
      # Trivy's exit code. After it, `release_image_record.py` (main's copy,
      # like the provenance gate's) proves the report is about this image id,
      # refuses a fixable HIGH/CRITICAL a second time, and writes the summary
      # for the manifest.
      - name: The image has no fixable HIGH or CRITICAL vulnerability
        env:
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git show "$WORKFLOW_SHA:scripts/ci/release_image_record.py" > "$RUNNER_TEMP/release_image_record.py"
          scanned="$(docker image inspect "juristid-main-web:$SHORT" --format '{{.Id}}')"
          mkdir -p image-scan
          trivy() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache/trivy \
              -v "$PWD/image-scan:/out" \
              "$TRIVY_IMAGE" "$@"
          }
          echo "--- the full report, every severity, fixed or not"
          trivy image --skip-version-check --scanners vuln --format json --output /out/trivy-image.json "juristid-main-web:$SHORT"
          trivy convert --format table --output /out/trivy-image.txt /out/trivy-image.json
          # Which vulnerability database the gate read, for the manifest. Metadata,
          # not a gate: if Trivy cannot say, the manifest says `unknown`.
          trivy version --format json > image-scan/trivy-version.json || echo '{}' > image-scan/trivy-version.json
          echo "--- the gate: HIGH and CRITICAL with a fix available"
          trivy image --skip-version-check --scanners vuln --skip-db-update --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 --format table "juristid-main-web:$SHORT"
          test "$(docker image inspect "juristid-main-web:$SHORT" --format '{{.Id}}')" = "$scanned" \
            || { echo "the tag moved while the image was being scanned"; exit 1; }
          python3 "$RUNNER_TEMP/release_image_record.py" scan \
            --report image-scan/trivy-image.json \
            --version-report image-scan/trivy-version.json \
            --image-id "$scanned" \
            --env-file "$GITHUB_ENV"
          echo "IMAGE_SCANNER=$TRIVY_IMAGE" >> "$GITHUB_ENV"

      # Kept for three days, like CI's: the full report lists every unfixed CVE
      # in the production image, and this repository is public. The manifest
      # keeps the summary and the report's SHA-256 for the life of the release.
      - name: Upload the image scan
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-scan-${{ env.SHORT }}
          path: image-scan/
          if-no-files-found: warn
          retention-days: 3

      # One image id, four times over: the one runtime-checked, the one Trivy
      # read (its own report says so), the one tagged when the archive is
      # written, and the one the archive holds — read back out of the archive's
      # own manifest and config, without loading it. Any two that disagree stop
      # the job, so the manifest's `image_id` is the image that was checked.
      - name: Save and digest
        run: |
          set -euo pipefail
          archive="juristid-main-web-$SHORT.tar.gz"
          image_id="$(docker image inspect "juristid-main-web:$SHORT" --format '{{.Id}}')"
          test "$image_id" = "$RUNTIME_CHECKED_IMAGE_ID" || { echo "archiving $image_id, but $RUNTIME_CHECKED_IMAGE_ID was runtime-checked"; exit 1; }
          test "$image_id" = "$SCANNED_IMAGE_ID" || { echo "archiving $image_id, but $SCANNED_IMAGE_ID was scanned"; exit 1; }
          docker save "juristid-main-web:$SHORT" | gzip -1 > "$archive"
          archive_image_id="$(python3 "$RUNNER_TEMP/release_image_record.py" archive --archive "$archive" --image-id "$image_id" | sed -n 's/^ARCHIVE_IMAGE_ID=//p')"
          test "$archive_image_id" = "$image_id" || { echo "the archive holds ${archive_image_id:-nothing readable}, not $image_id"; exit 1; }
          size="$(stat -c %s "$archive")"
          digest="$(sha256sum "$archive" | cut -d' ' -f1)"
          {
            echo "revision:      $FULL"
            echo "previous:      $PREVIOUS"
            echo "provenance:    $PROVENANCE"
            echo "release_note:  $RELEASE_NOTE${RELEASE_NOTE_DETAIL:+ — $RELEASE_NOTE_DETAIL}"
            echo "index_version: $INDEX_VERSION_PREVIOUS -> $INDEX_VERSION_TARGET"
            echo "index_version_changed: $INDEX_VERSION_CHANGED"
            echo "search_rebuild_required: $INDEX_VERSION_CHANGED"
            echo "image_tag:     juristid-main-web:$SHORT"
            echo "image_id:      $image_id"
            echo "scanned_image_id: $SCANNED_IMAGE_ID"
            echo "runtime_checked_image_id: $RUNTIME_CHECKED_IMAGE_ID"
            echo "archive_image_id: $archive_image_id"
            echo "runtime_check: PASS scripts/ci/assert_image_runtime.py, from inside the image"
            echo "image_scan:    PASS no fixable HIGH or CRITICAL (trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1)"
            echo "image_scanner: $IMAGE_SCANNER"
            echo "image_scan_db: $IMAGE_SCAN_DB"
            echo "image_scan_findings: $IMAGE_SCAN_FINDINGS"
            echo "image_scan_fixable_high_critical: $IMAGE_SCAN_FIXABLE_HIGH_CRITICAL"
            echo "image_scan_report_sha256: $IMAGE_SCAN_REPORT_SHA256"
            echo "platform:      linux/amd64"
            echo "build_stamp:   $BUILD_STAMP"
            echo "archive:       $archive"
            echo "archive_bytes: $size"
            echo "archive_sha256: $digest"
            echo "builder:       github-actions ${{ runner.os }} ${{ runner.arch }}"
          } > "release-manifest-$SHORT.txt"
          cat "release-manifest-$SHORT.txt"
          echo "$digest  $archive" > "$archive.sha256"
          # What the image ships, recorded beside it (security review
          # 2026-10-29, D-09): the Debian packages — the one inventory nothing
          # else keeps, since apt installs them at build time — and the locked
          # Python set, which `uv sync --frozen` installed from uv.lock at this
          # revision. A later advisory is then answered by reading two files
          # rather than by loading the image. Listed from the image by its id,
          # asked again first, so the list is the archived image's and not
          # whatever the tag names by now (2026-11 QA, G-02).
          test "$(docker image inspect "$image_id" --format '{{.Id}}')" = "$image_id" \
            || { echo "image $image_id is gone, or is not an image id"; exit 1; }
          docker run --rm --entrypoint dpkg-query "$image_id" \
            -W -f '${Package}=${Version}\n' | sort > "os-packages-$SHORT.txt"
          cp uv.lock "python-packages-$SHORT.lock"
          echo "os_packages:   os-packages-$SHORT.txt ($(wc -l < "os-packages-$SHORT.txt") entries)" >> "release-manifest-$SHORT.txt"
          echo "os_packages_sha256: $(sha256sum "os-packages-$SHORT.txt" | cut -d' ' -f1)" >> "release-manifest-$SHORT.txt"
          echo "python_lock:   python-packages-$SHORT.lock (uv.lock at $FULL)" >> "release-manifest-$SHORT.txt"
          cat "release-manifest-$SHORT.txt"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image-${{ env.SHORT }}
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
            release-manifest-${{ env.SHORT }}.txt
            os-packages-${{ env.SHORT }}.txt
            python-packages-${{ env.SHORT }}.lock
          # The image is already gzipped; asking the upload to compress it again
          # costs minutes and saves nothing.
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
