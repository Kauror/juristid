{% comment %}
  Andmete sünkroonimine's own pages, under the Haldus strip: the overview,
  the pending differences, the run history and the older Lovable details page
  (`haldus:lovable`, kept at its address).
{% endcomment %}
<nav class="tabs dsync__subnav" aria-label="Andmete sünkroonimise lehed">
  {% for item in sync_pages %}
    <a class="tabs__tab {% if item.active %}is-active{% endif %}"
       {% if item.active %}aria-current="page"{% endif %}
       href="{{ item.url }}">{{ item.label }}</a>
  {% endfor %}
</nav>
