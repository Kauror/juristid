{% load form_labels %}
{% comment %}
The file affordance, once, for every operation that takes evidence.

A `<label>` wrapping a visually hidden `multiple` file input: the whole dashed
box is the picker, so choosing files works with no script at all, and `ux.js`
adds dragging and the chosen-file summary on top of that rather than instead of
it (static/js/ux.js `bindFileDrop`).

One partial rather than six copies, because the accessible name of a hidden
input is the only thing a screen reader has to go on here, and six copies are
six chances for one of them to say something else.

The files go to the record this form creates, explicitly, through
`DocumentLink` — not to the Matter at large and not inferred later from a
timestamp or a filename (app/documents/links.py, brief §21, §22).
{% endcomment %}
<label class="cx-drop" data-filedrop>
  <span class="visually-hidden">{{ field.label }}</span>
  {{ field }}
  {% comment %}
    `drop_text` is for a control that takes a single file. None does today —
    `+ Koja arvamus` takes every file that went out since docs/adr/0144 §5 — so
    every drop gets the plural; the parameter stays so the drop contract, the
    accessible name and the script hook remain one implementation.
  {% endcomment %}
  {% comment %}
    A drop zone has no visible label of its own, so a required one carries the
    marker in its text — the same `*` every required label carries
    (docs/adr/0140 §6).
  {% endcomment %}
  <span class="cx-drop__text" data-filedrop-text>{{ drop_text|default:"Lohista failid siia või " }}<span class="cx-drop__pick">vali arvutist</span>{% if field|is_required %}{% required_mark %}{% endif %}</span>
</label>
{% if field.errors %}
  {% comment %}
    The id is the one Django's `aria-describedby` on the refused control
    already names, so it is always there: without it the control points at
    nothing (ENG-092). Several panels share `id_attachments`, but only the one
    form a request posted is ever bound, so a response holds at most one
    refused upload and the id stays unique in it.

    `describe_errors` only adds `role="alert"`, for the forms that announce a
    refused upload the moment it lands.
  {% endcomment %}
  <p class="field__error" id="{{ field.auto_id }}_error"{% if describe_errors %} role="alert"{% endif %}>{{ field.errors|first }}</p>
{% endif %}
